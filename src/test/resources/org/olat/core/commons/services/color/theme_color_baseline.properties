# Old colour references per module of themes/light/modules (OO-9994, OO-10043).
# Checked by ThemeColorRatchetTest: a count must not grow. When a module
# reads more tokens, lower its count here. Modules not listed have 0.
# Total: 59 references in 18 modules, plus 81 kept (keep.*).
# Kept by design (slice 22, D34): "// o-color-keep(reason)" at the end of a
# line or "// o-color-keep-start(reason)" ... "// o-color-keep-end" around a
# block. The module counts exclude marked references; keep.<reason> is their
# total and must match. Reasons (ThemeColorRatchetTest.KEEP_REASONS): hotspot,
# print, brand, devtool, stored-content, gradient, mask, email, mixin-argument,
# vendor-copy, a11y-checker. Never mark a leftover (B4-18, defaults, links).
# History: since OO-10043 slice 10 the pattern
# counts the colour variables of the course element styles ($o-cn-style-bg,
# $o-cn-style-cover-text-bg): "style" is excluded only at the end of a name.
# Slice 11 splits $o-cn-style-border into $o-cn-style-border-line-width,
# $o-cn-style-border-line-style (not counted) and the token course-style-border.
# Slice 12 (decision D24) removes the glows of the focused fields
# (color-mix() of the token focus) and the halo of .form-control:focus.
# Slice 13 (decision D28): the selectus marks of no rating and of the
# abstention read the tokens of the buttons instead of white and black.
# Slice 14 (decision D29): the hex values, colour names and rgb() literals
# of the B4 review read tokens, palette steps or own element tokens; the
# kept literals (hotspot styles, stored content styles, brand colours,
# developer tools, print sheets) and the rows of B4-18 stay.
# Slice 16: the framework modules (dialog, dmz, card, navbar, table, tree,
# icons, helpers) read element tokens fed by their Sass variables. Kept:
# shorthand borders, translucent color-mix() defaults, "none" defaults,
# non-colour login variables and color-mix( that the pattern counts as mix(.
# Slice 17 (decision D31): the pattern does not count color-mix( (Q5, -109)
# and the non-colour login variables gradient-to, gradient-steps, -img,
# -position-left, -position-top (Q3, Q4, -10): 851 to 732 before the
# rewrites, 501 after them. The shorthand
# borders are width, style and a colour token (Q1), the translucent defaults
# feed tokens (Q2). The assessment and content modules (qti21,
# contenteditor, practice, video, videotask) read element tokens fed by
# their Sass variables. Kept: hotspot styles, stored content styles, print
# sheets and the rows of B4-18.
# Slice 18: the course, user and various modules (various_modules, course,
# selectus, curriculum, user, highscore, projects, coursesite,
# radial-progress, im) read element tokens fed by their Sass variables; 14
# more shorthand borders are width, style and a colour token; the pattern
# does not count -ratio, -break and -blend-mode (no colour, -6). The other
# modules read the tokens of $o-toolbar-border-color, $o-slider-border,
# $o-portfolio-media-content-background-color,
# $o-coursesite-meta-author-color and $o-table-row-selected-color. Kept:
# stored content styles, print sheets, the portrait mask, the rows of
# B4-18, $o-tree-link-bg ("none"), the gradients $o-not-available-bg and
# $o-cat2-header-noimage-bg, the invalid template label border and
# $o-hs-position-title-color (open questions): 501 to 285.
# Slice 19 (decision D32): the pattern accepts upper-case letters in a name
# (E1, +17: $o-qti-textEntryInteraction-*, $o-qti-badResponse-color,
# $o-qti-status-notPresented-color, -notAnswered-color): 285 to 302. The
# other modules read element tokens fed by their Sass variables; 8 more
# shorthand borders are width, style and a colour token;
# $o-hs-position-title-color is a switch and the token
# highscore-position-title (E2); the toolbar reads tokens (E3); the mixin
# o-alert-variant (not in email.css) reads var(--o-text): 302 to 140.
# Kept: stored content styles (B4-16), brand colours and developer tools
# (B4-17), print sheets, the rules of B4-18, the hotspot styles (B4-15),
# "none" and "inherit" defaults, the gradients $o-not-available-bg and
# $o-cat2-header-noimage-bg, the mixins of email.css,
# $o-navbar-login-color, $o-content-link-hover-color,
# $o-footer-default-link-hover-color, the .sr-only colours, the portrait
# mask and the edu-sharing copy.
# Slice 19, follow-up: Sass treats "_" and "-" in a name as equal, so the
# count replaces "_" by "-" in a variable name first (+12:
# $o-o_speedometer-*-border-color 10, $o_color_note, $o_color_note-text-bg):
# 140 to 152. The speedometer and the recording info of the video recorder
# read element tokens: 152 to 140.
# Slice 22 (D34): markers exclude the 81 references that stay: 140 to 59.
