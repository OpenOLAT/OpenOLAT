email.enrollment.partially.body=Dzie\u0144 dobry $recipientDisplayName<br><br>Niniejszym potwierdzamy zapis na podstawie dokonanego wyboru, priorytet\u00F3w i dost\u0119pnych miejsc:<br>$enrollmentList<br>Niestety wyb\u00F3r nie m\u00F3g\u0142 zosta\u0107 w pe\u0142ni uwzgl\u0119dniony.<br><br>Mo\u017Ce to mie\u0107 nast\u0119puj\u0105ce przyczyny:<br>- Nie osi\u0105gni\u0119to minimalnej liczby uczestnik\u00F3w tematu.<br>- Temat jest przepe\u0142niony.<br>- Maksymalna liczba wybor\u00F3w temat\u00F3w nie zosta\u0142a w pe\u0142ni wykorzystana.<br><br>Dost\u0119p: $url<br><br>Aby uzyska\u0107 wi\u0119cej informacji, prosimy o kontakt z opiekunem.
