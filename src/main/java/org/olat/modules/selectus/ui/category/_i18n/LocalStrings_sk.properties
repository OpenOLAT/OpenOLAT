position.tags.description=Tu m\u00F4\u017Eete aktivova\u0165 syst\u00E9mov\u00E9 tagy a tagy \u0161pecifick\u00E9 pre pracovn\u00FA poz\u00EDciu.<br>Ak s\u00FA syst\u00E9mov\u00E9 tagy aktivovan\u00E9, zobraz\u00ED sa tu zoznam dostupn\u00FDch syst\u00E9mov\u00FDch tagov. Syst\u00E9mov\u00E9 tagy m\u00F4\u017Ee upravova\u0165 iba osoba s administr\u00E1torsk\u00FDmi pr\u00E1vami v spr\u00E1ve syst\u00E9mu.<br>Ak s\u00FA aktivovan\u00E9 tagy pracovnej poz\u00EDcie, mo\u017Eno ich tu prid\u00E1va\u0165, upravova\u0165, odstra\u0148ova\u0165 alebo zlu\u010Dova\u0165. Nezabudnite\: Ak existuje tag s rovnak\u00FDm n\u00E1zvom na \u00FArovni syst\u00E9mu aj pracovnej poz\u00EDcie, pri pridan\u00ED k prihl\u00E1\u0161ke sa pou\u017Eije pr\u00EDslu\u0161n\u00FD tag pracovnej poz\u00EDcie.
