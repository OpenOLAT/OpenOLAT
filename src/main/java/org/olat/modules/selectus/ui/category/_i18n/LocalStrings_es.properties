position.tags.description=Aqu\u00ED puede activar etiquetas del sistema y etiquetas espec\u00EDficas de la convocatoria.<br>Si las etiquetas del sistema est\u00E1n activadas, aqu\u00ED se muestra la lista de etiquetas del sistema disponibles. Las etiquetas del sistema solo las puede editar en la administraci\u00F3n del sistema una persona con derechos de administraci\u00F3n.<br>Si las etiquetas de convocatoria est\u00E1n activadas, aqu\u00ED se pueden a\u00F1adir, editar, eliminar o fusionar. Tenga en cuenta\: si existe una etiqueta con el mismo nombre a nivel del sistema y de la convocatoria, al a\u00F1adirla a una candidatura se utiliza la etiqueta de convocatoria correspondiente.
