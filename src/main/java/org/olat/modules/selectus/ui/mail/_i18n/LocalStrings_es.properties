mail.templates.description=Puede personalizar las plantillas de e-mail del sistema de las funciones activadas o, si ya est\u00E1n personalizadas, restablecerlas a su versi\u00F3n original.<br>Con el bot\u00F3n "$\:add.template" puede crear plantillas de e-mail adicionales espec\u00EDficas de la convocatoria para contactar con los candidatos. Las plantillas de convocatoria existentes se pueden editar o eliminar, pero no restablecer a una versi\u00F3n anterior.
mail.templates.description.with.letter=Las plantillas de e-mail con carta modelo incluyen una carta modelo adjunta en formato PDF. El texto de la carta modelo solo se puede personalizar, definir o editar aqu\u00ED, no al enviar e-mails a los candidatos. Tenga en cuenta que, al restablecer una plantilla de e-mail del sistema con carta modelo, tambi\u00E9n se restablece el texto de la carta modelo.
mail.templates.description.with.management=La plantilla "Confirmaci\u00F3n de candidatura sin gesti\u00F3n de referencias" est\u00E1 activa y se env\u00EDa autom\u00E1ticamente a los candidatos si la funci\u00F3n "Los candidatos pueden indicar y gestionar personas de referencia" no est\u00E1 activada.<br>La plantilla "Confirmaci\u00F3n de candidatura con gesti\u00F3n de referencias" est\u00E1 activa y se env\u00EDa autom\u00E1ticamente a los candidatos si la funci\u00F3n "Los candidatos pueden indicar y gestionar personas de referencia" est\u00E1 activada.<br>Vaya a "<a href\='{0}'>Persona de referencia / experto</a>" en la navegaci\u00F3n principal del modo de edici\u00F3n para configurar las personas de referencia y su gesti\u00F3n.
