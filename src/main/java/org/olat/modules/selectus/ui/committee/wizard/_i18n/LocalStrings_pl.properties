wizard.email.explanation=Podaj adres e-mail cz\u0142onka komisji, kt\u00F3rego chcesz doda\u0107. Je\u015Bli ta osoba jest ju\u017C u\u017Cytkownikiem Selectus, jej dane zostan\u0105 automatycznie przeniesione do tej komisji. W przeciwnym razie mo\u017Cesz uzupe\u0142ni\u0107 dane w nast\u0119pnym kroku. Je\u015Bli nie znasz adresu e-mail istniej\u0105cej osoby w Selectus, mo\u017Cesz klikn\u0105\u0107 "Wyszukiwanie os\u00F3b". Aby doda\u0107 kilku cz\u0142onk\u00F3w komisji w jednym kroku, podaj kilka adres\u00F3w e-mail rozdzielonych \u015Brednikiem (;).
wizard.email.explanation.azure=Podaj adres e-mail cz\u0142onka komisji, kt\u00F3rego chcesz doda\u0107. Je\u015Bli ta osoba jest osob\u0105 wewn\u0119trzn\u0105 lub jest ju\u017C zewn\u0119trznym cz\u0142onkiem innej komisji, jej dane zostan\u0105 automatycznie przeniesione do tej komisji. W przeciwnym razie mo\u017Cesz uzupe\u0142ni\u0107 dane w nast\u0119pnym kroku. Je\u015Bli nie znasz adresu e-mail istniej\u0105cej osoby zewn\u0119trznej, mo\u017Cesz klikn\u0105\u0107 "Wyszukiwanie os\u00F3b". Aby doda\u0107 kilku cz\u0142onk\u00F3w komisji w jednym kroku, podaj kilka adres\u00F3w e-mail rozdzielonych \u015Brednikiem (;).
wizard.email.explanation.ldap=Podaj adres e-mail cz\u0142onka komisji, kt\u00F3rego chcesz doda\u0107. Je\u015Bli ta osoba jest osob\u0105 wewn\u0119trzn\u0105 lub jest ju\u017C zewn\u0119trznym cz\u0142onkiem innej komisji, jej dane zostan\u0105 automatycznie przeniesione do tej komisji. W przeciwnym razie mo\u017Cesz uzupe\u0142ni\u0107 dane w nast\u0119pnym kroku. Je\u015Bli nie znasz adresu e-mail osoby wewn\u0119trznej lub istniej\u0105cej osoby zewn\u0119trznej, mo\u017Cesz klikn\u0105\u0107 "Wyszukiwanie os\u00F3b". Aby doda\u0107 kilku cz\u0142onk\u00F3w komisji w jednym kroku, podaj kilka adres\u00F3w e-mail rozdzielonych \u015Brednikiem (;).
