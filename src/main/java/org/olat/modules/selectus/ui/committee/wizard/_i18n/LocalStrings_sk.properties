wizard.email.description=E-mail
wizard.email.explanation=Zadajte, pros\u00EDm, e-mailov\u00FA adresu \u010Dlena komisie, ktor\u00E9ho chcete prida\u0165. Ak je t\u00E1to osoba u\u017E pou\u017E\u00EDvate\u013Eom Selectusu, jej \u00FAdaje sa do tejto komisie prevezm\u00FA automaticky. V opa\u010Dnom pr\u00EDpade m\u00F4\u017Eete \u00FAdaje doplni\u0165 v \u010Fal\u0161om kroku. Ak e-mailov\u00FA adresu existuj\u00FAcej osoby v Selectuse nepozn\u00E1te, m\u00F4\u017Eete klikn\u00FA\u0165 na "Vyh\u013Ead\u00E1vanie u\u017E\u00EDvate\u013Eov". Ak chcete prida\u0165 viacer\u00FDch \u010Dlenov komisie v jednom kroku, zadajte viacer\u00E9 e-mailov\u00E9 adresy oddelen\u00E9 bodko\u010Diarkou (;).
wizard.email.explanation.azure=Zadajte, pros\u00EDm, e-mailov\u00FA adresu \u010Dlena komisie, ktor\u00E9ho chcete prida\u0165. Ak je t\u00E1to osoba intern\u00E1 alebo u\u017E je extern\u00FDm \u010Dlenom inej komisie, jej \u00FAdaje sa do tejto komisie prevezm\u00FA automaticky. V opa\u010Dnom pr\u00EDpade m\u00F4\u017Eete \u00FAdaje doplni\u0165 v \u010Fal\u0161om kroku. Ak e-mailov\u00FA adresu existuj\u00FAcej externej osoby nepozn\u00E1te, m\u00F4\u017Eete klikn\u00FA\u0165 na "Vyh\u013Ead\u00E1vanie u\u017E\u00EDvate\u013Eov". Ak chcete prida\u0165 viacer\u00FDch \u010Dlenov komisie v jednom kroku, zadajte viacer\u00E9 e-mailov\u00E9 adresy oddelen\u00E9 bodko\u010Diarkou (;).
wizard.email.explanation.ldap=Zadajte, pros\u00EDm, e-mailov\u00FA adresu \u010Dlena komisie, ktor\u00E9ho chcete prida\u0165. Ak je t\u00E1to osoba intern\u00E1 alebo u\u017E je extern\u00FDm \u010Dlenom inej komisie, jej \u00FAdaje sa do tejto komisie prevezm\u00FA automaticky. V opa\u010Dnom pr\u00EDpade m\u00F4\u017Eete \u00FAdaje doplni\u0165 v \u010Fal\u0161om kroku. Ak e-mailov\u00FA adresu internej alebo existuj\u00FAcej externej osoby nepozn\u00E1te, m\u00F4\u017Eete klikn\u00FA\u0165 na "Vyh\u013Ead\u00E1vanie u\u017E\u00EDvate\u013Eov". Ak chcete prida\u0165 viacer\u00FDch \u010Dlenov komisie v jednom kroku, zadajte viacer\u00E9 e-mailov\u00E9 adresy oddelen\u00E9 bodko\u010Diarkou (;).
