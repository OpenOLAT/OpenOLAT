mail.templates.description=Mo\u017Cesz dostosowa\u0107 systemowe szablony e-mail aktywnych funkcji lub, je\u015Bli zosta\u0142y ju\u017C dostosowane, przywr\u00F3ci\u0107 ich wersj\u0119 oryginaln\u0105.<br>Za pomoc\u0105 przycisku "$\:add.template" mo\u017Cesz utworzy\u0107 dodatkowe szablony e-mail specyficzne dla konkursu do kontaktu z kandydatami. Istniej\u0105ce szablony konkursu mo\u017Cna edytowa\u0107 lub usuwa\u0107, ale nie mo\u017Cna przywr\u00F3ci\u0107 ich wcze\u015Bniejszej wersji.
mail.templates.description.with.letter=Szablony e-mail z korespondencj\u0105 seryjn\u0105 zawieraj\u0105 za\u0142\u0105czony list seryjny w formacie PDF. Tekst korespondencji seryjnej mo\u017Cna dostosowa\u0107, zdefiniowa\u0107 lub edytowa\u0107 tylko tutaj, a nie podczas wysy\u0142ania e-maili do kandydat\u00F3w. Pami\u0119taj, \u017Ce przy resetowaniu systemowego szablonu e-mail z korespondencj\u0105 seryjn\u0105 resetowany jest r\u00F3wnie\u017C tekst korespondencji seryjnej.
mail.templates.description.with.management=Szablon "Potwierdzenie kandydatury bez zarz\u0105dzania referencjami" jest aktywny i jest automatycznie wysy\u0142any do kandydat\u00F3w, je\u015Bli funkcja "Kandydaci mog\u0105 podawa\u0107 osoby polecaj\u0105ce i nimi zarz\u0105dza\u0107" nie jest aktywna.<br>Szablon "Potwierdzenie kandydatury z zarz\u0105dzaniem referencjami" jest aktywny i jest automatycznie wysy\u0142any do kandydat\u00F3w, je\u015Bli funkcja "Kandydaci mog\u0105 podawa\u0107 osoby polecaj\u0105ce i nimi zarz\u0105dza\u0107" jest aktywna.<br>Przejd\u017A w g\u0142\u00F3wnej nawigacji trybu edycji do "<a href\='{0}'>Osoba polecaj\u0105ca / ekspert</a>", aby skonfigurowa\u0107 osoby polecaj\u0105ce i zarz\u0105dzanie nimi.
