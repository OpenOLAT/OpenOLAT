wizard.email.explanation=Veuillez indiquer l'adresse e-mail du membre de la commission que vous souhaitez ajouter. Si cette personne est d\u00E9j\u00E0 utilisatrice de Selectus, ses donn\u00E9es sont reprises automatiquement dans cette commission. Sinon, vous pouvez compl\u00E9ter les donn\u00E9es \u00E0 l'\u00E9tape suivante. Si vous ne connaissez pas l'adresse e-mail d'une personne d\u00E9j\u00E0 enregistr\u00E9e dans Selectus, vous pouvez cliquer sur "Recherche de personnes". Pour ajouter plusieurs membres en une seule \u00E9tape, indiquez plusieurs adresses e-mail s\u00E9par\u00E9es par un point-virgule (;).
wizard.email.explanation.azure=Veuillez indiquer l'adresse e-mail du membre de la commission que vous souhaitez ajouter. Si cette personne est une personne interne ou d\u00E9j\u00E0 membre externe d'une autre commission, ses donn\u00E9es sont reprises automatiquement dans cette commission. Sinon, vous pouvez compl\u00E9ter les donn\u00E9es \u00E0 l'\u00E9tape suivante. Si vous ne connaissez pas l'adresse e-mail d'une personne externe d\u00E9j\u00E0 enregistr\u00E9e, vous pouvez cliquer sur "Recherche de personnes". Pour ajouter plusieurs membres en une seule \u00E9tape, indiquez plusieurs adresses e-mail s\u00E9par\u00E9es par un point-virgule (;).
wizard.email.explanation.ldap=Veuillez indiquer l'adresse e-mail du membre de la commission que vous souhaitez ajouter. Si cette personne est une personne interne ou d\u00E9j\u00E0 membre externe d'une autre commission, ses donn\u00E9es sont reprises automatiquement dans cette commission. Sinon, vous pouvez compl\u00E9ter les donn\u00E9es \u00E0 l'\u00E9tape suivante. Si vous ne connaissez pas l'adresse e-mail d'une personne interne ou d'une personne externe d\u00E9j\u00E0 enregistr\u00E9e, vous pouvez cliquer sur "Recherche de personnes". Pour ajouter plusieurs membres en une seule \u00E9tape, indiquez plusieurs adresses e-mail s\u00E9par\u00E9es par un point-virgule (;).
