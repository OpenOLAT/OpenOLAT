wizard.email.description=E-mail
wizard.email.explanation=Indique la direcci\u00F3n de e-mail del miembro de la comisi\u00F3n que desea a\u00F1adir. Si esta persona ya es usuario de Selectus, sus datos se incorporar\u00E1n autom\u00E1ticamente a esta comisi\u00F3n. En caso contrario, podr\u00E1 completar los datos en el paso siguiente. Si no conoce la direcci\u00F3n de e-mail de una persona existente en Selectus, puede hacer clic en "B\u00FAsqueda de personas". Para a\u00F1adir varios miembros de la comisi\u00F3n en un solo paso, indique varias direcciones de e-mail separadas por punto y coma (;).
wizard.email.explanation.azure=Indique la direcci\u00F3n de e-mail del miembro de la comisi\u00F3n que desea a\u00F1adir. Si esta persona es una persona interna o ya es miembro externo de otra comisi\u00F3n, sus datos se incorporar\u00E1n autom\u00E1ticamente a esta comisi\u00F3n. En caso contrario, podr\u00E1 completar los datos en el paso siguiente. Si no conoce la direcci\u00F3n de e-mail de una persona externa existente, puede hacer clic en "B\u00FAsqueda de personas". Para a\u00F1adir varios miembros de la comisi\u00F3n en un solo paso, indique varias direcciones de e-mail separadas por punto y coma (;).
wizard.email.explanation.ldap=Indique la direcci\u00F3n de e-mail del miembro de la comisi\u00F3n que desea a\u00F1adir. Si esta persona es una persona interna o ya es miembro externo de otra comisi\u00F3n, sus datos se incorporar\u00E1n autom\u00E1ticamente a esta comisi\u00F3n. En caso contrario, podr\u00E1 completar los datos en el paso siguiente. Si no conoce la direcci\u00F3n de e-mail de una persona interna o de una persona externa existente, puede hacer clic en "B\u00FAsqueda de personas". Para a\u00F1adir varios miembros de la comisi\u00F3n en un solo paso, indique varias direcciones de e-mail separadas por punto y coma (;).
