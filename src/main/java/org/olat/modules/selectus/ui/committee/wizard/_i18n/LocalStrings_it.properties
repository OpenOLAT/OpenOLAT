wizard.email.description=E-mail
wizard.email.explanation=Indichi l'indirizzo e-mail del membro della commissione che desidera aggiungere. Se questa persona \u00E8 gi\u00E0 utente di Selectus, i dati vengono ripresi automaticamente in questa commissione. Altrimenti pu\u00F2 completare i dati nel passo successivo. Se non conosce l'indirizzo e-mail di una persona gi\u00E0 registrata in Selectus, pu\u00F2 cliccare su "Ricerca utenti". Per aggiungere pi\u00F9 membri della commissione in un solo passo, indichi pi\u00F9 indirizzi e-mail separati da un punto e virgola (;).
wizard.email.explanation.azure=Indichi l'indirizzo e-mail del membro della commissione che desidera aggiungere. Se questa persona \u00E8 una persona interna oppure \u00E8 gi\u00E0 membro esterno di un'altra commissione, i dati vengono ripresi automaticamente in questa commissione. Altrimenti pu\u00F2 completare i dati nel passo successivo. Se non conosce l'indirizzo e-mail di una persona esterna gi\u00E0 registrata, pu\u00F2 cliccare su "Ricerca utenti". Per aggiungere pi\u00F9 membri della commissione in un solo passo, indichi pi\u00F9 indirizzi e-mail separati da un punto e virgola (;).
wizard.email.explanation.ldap=Indichi l'indirizzo e-mail del membro della commissione che desidera aggiungere. Se questa persona \u00E8 una persona interna oppure \u00E8 gi\u00E0 membro esterno di un'altra commissione, i dati vengono ripresi automaticamente in questa commissione. Altrimenti pu\u00F2 completare i dati nel passo successivo. Se non conosce l'indirizzo e-mail di una persona interna o di una persona esterna gi\u00E0 registrata, pu\u00F2 cliccare su "Ricerca utenti". Per aggiungere pi\u00F9 membri della commissione in un solo passo, indichi pi\u00F9 indirizzi e-mail separati da un punto e virgola (;).
