wizard.email.explanation=Bitte geben Sie die E-Mail-Adresse des Kommissionsmitglieds an, das Sie hinzuf\u00FCgen m\u00F6chten. Ist diese Person bereits Selectus-Benutzerin oder -Benutzer, werden die Angaben automatisch in diese Kommission \u00FCbernommen. Andernfalls k\u00F6nnen Sie die Angaben im n\u00E4chsten Schritt erg\u00E4nzen. Wenn Sie die E-Mail-Adresse einer bestehenden Selectus-Person nicht kennen, k\u00F6nnen Sie auf "Personensuche" klicken. Um mehrere Kommissionsmitglieder in einem Schritt hinzuzuf\u00FCgen, geben Sie mehrere E-Mail-Adressen durch Semikolon (;) getrennt an.
wizard.email.explanation.azure=Bitte geben Sie die E-Mail-Adresse des Kommissionsmitglieds an, das Sie hinzuf\u00FCgen m\u00F6chten. Ist diese Person eine interne Person oder bereits externes Mitglied einer anderen Kommission, werden die Angaben automatisch in diese Kommission \u00FCbernommen. Andernfalls k\u00F6nnen Sie die Angaben im n\u00E4chsten Schritt erg\u00E4nzen. Wenn Sie die E-Mail-Adresse einer bestehenden externen Person nicht kennen, k\u00F6nnen Sie auf "Personensuche" klicken. Um mehrere Kommissionsmitglieder in einem Schritt hinzuzuf\u00FCgen, geben Sie mehrere E-Mail-Adressen durch Semikolon (;) getrennt an.
