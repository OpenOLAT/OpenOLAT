mail.templates.description=Sie k\u00F6nnen die System-E-Mail-Vorlagen aktivierter Funktionen anpassen oder, sofern bereits angepasst, auf die Originalversion zur\u00FCcksetzen.<br>\u00DCber die Schaltfl\u00E4che "$\:add.template" k\u00F6nnen Sie zus\u00E4tzliche ausschreibungsspezifische E-Mail-Vorlagen f\u00FCr die Kontaktaufnahme mit Bewerbenden erstellen. Bestehende Ausschreibungsvorlagen k\u00F6nnen bearbeitet oder gel\u00F6scht, aber nicht auf eine fr\u00FChere Version zur\u00FCckgesetzt werden.
mail.templates.description.with.letter=E-Mail-Vorlagen mit Serienbrief enthalten einen angeh\u00E4ngten Serienbrief im PDF-Format. Der Text des Serienbriefs kann nur hier angepasst, definiert oder bearbeitet werden, nicht beim Versenden von E-Mails an Bewerbende. Beachten Sie, dass beim Zur\u00FCcksetzen einer System-E-Mail-Vorlage mit Serienbrief auch der Text des Serienbriefs zur\u00FCckgesetzt wird.
mail.templates.description.with.management=Die Vorlage "Bewerbungsbest\u00E4tigung ohne Referenzverwaltung" ist aktiv und wird automatisch an Bewerbende versendet, wenn die Funktion "Bewerbende k\u00F6nnen Referenzpersonen angeben und verwalten" nicht aktiviert ist.<br>Die Vorlage "Bewerbungsbest\u00E4tigung mit Referenzverwaltung" ist aktiv und wird automatisch an Bewerbende versendet, wenn die Funktion "Bewerbende k\u00F6nnen Referenzpersonen angeben und verwalten" aktiviert ist.<br>Gehen Sie in der Hauptnavigation des Bearbeitungsmodus zu "<a href\='{0}'>Referenzperson / Gutachter{in}</a>", um Referenzpersonen und deren Verwaltung zu konfigurieren.
