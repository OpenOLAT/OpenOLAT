wizard.referees.description=Posudzovatelia
wizard.referees.explain.additional=Hne\u010F po odoslan\u00ED prihl\u00E1\u0161ky z\u00EDskate prihl\u00E1senie do n\u00E1stroja Faculty Recruiting Tool, aby ste mohli sledova\u0165 stav svojich referenci\u00ED. Ak referen\u010Dn\u00E9 osoby odmietnu \u017Eiados\u0165 o odpor\u00FA\u010Dac\u00ED list, m\u00F4\u017Eete ur\u010Di\u0165 \u010Fal\u0161ie referen\u010Dn\u00E9 osoby. Odoslan\u00E9 odpor\u00FA\u010Dacie listy s\u00FA d\u00F4vern\u00E9 a nie s\u00FA v\u00E1m pr\u00EDstupn\u00E9.
wizard.referees.explain.auto=Uve\u010Fte referen\u010Dn\u00E9 osoby, ktor\u00E9 bud\u00FA kontaktovan\u00E9 a po\u017Eiadan\u00E9 o nahranie odpor\u00FA\u010Dacieho listu. Uistite sa, \u017Ee kontaktn\u00E9 \u00FAdaje s\u00FA spr\u00E1vne. Referen\u010Dn\u00E9 osoby m\u00F4\u017Eu z\u00EDska\u0165 pr\u00EDstup k va\u0161im osobn\u00FDm \u00FAdajom a odoslan\u00FDm dokumentom.
wizard.referees.explain.staff=Uve\u010Fte referen\u010Dn\u00E9 osoby, ktor\u00E9 bud\u00FA kontaktovan\u00E9 a po\u017Eiadan\u00E9 o nahranie odpor\u00FA\u010Dacieho listu. Uistite sa, \u017Ee kontaktn\u00E9 \u00FAdaje s\u00FA spr\u00E1vne. Referen\u010Dn\u00E9 osoby m\u00F4\u017Eu z\u00EDska\u0165 pr\u00EDstup k va\u0161im osobn\u00FDm \u00FAdajom a odoslan\u00FDm dokumentom.
