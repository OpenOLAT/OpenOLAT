wizard.instructions.app.text1=Pr\u00E1ve sa uch\u00E1dzate o poz\u00EDciu "{0}". Po\u010Das procesu pod\u00E1vania prihl\u00E1\u0161ky budete vyzvan\u00ED, aby ste uviedli osobn\u00E9 \u00FAdaje (meno, adresu, kontaktn\u00E9 \u00FAdaje, d\u00E1tum narodenia, \u0161t\u00E1tnu pr\u00EDslu\u0161nos\u0165 at\u010F.) a inform\u00E1cie o svojom akademickom vzdelan\u00ED (s\u00FA\u010Dasn\u00E1 poz\u00EDcia a organiz\u00E1cia, n\u00E1zov a rok dizerta\u010Dnej pr\u00E1ce at\u010F.).
wizard.instructions.app.text2=Okrem toho s\u00FA potrebn\u00E9 nasleduj\u00FAce dokumenty ako jednotliv\u00E9 s\u00FAbory PDF. Nahrajte s\u00FAbory bez ochrany heslom alebo \u0161ifrovania.
