mail.templates.description=Vous pouvez personnaliser les mod\u00E8les d'e-mail syst\u00E8me des fonctions activ\u00E9es ou, s'ils ont d\u00E9j\u00E0 \u00E9t\u00E9 personnalis\u00E9s, les r\u00E9initialiser \u00E0 leur version originale.<br>Le bouton "$\:add.template" vous permet de cr\u00E9er des mod\u00E8les d'e-mail suppl\u00E9mentaires propres au poste pour contacter les candidat{e}s. Les mod\u00E8les de poste existants peuvent \u00EAtre modifi\u00E9s ou supprim\u00E9s, mais pas r\u00E9initialis\u00E9s \u00E0 une version ant\u00E9rieure.
mail.templates.description.with.letter=Les mod\u00E8les d'e-mail avec lettre type comportent une lettre type joint au format PDF. Le texte de la lettre type ne peut \u00EAtre personnalis\u00E9, d\u00E9fini ou modifi\u00E9 qu'ici, et non lors de l'envoi des e-mails aux candidat{e}s. Notez que la r\u00E9initialisation d'un mod\u00E8le d'e-mail syst\u00E8me avec lettre type r\u00E9initialise \u00E9galement le texte de la lettre type.
mail.templates.description.with.management=Le mod\u00E8le "Confirmation de candidature sans gestion des r\u00E9f\u00E9rences" est activ\u00E9 et envoy\u00E9 automatiquement aux candidat{e}s lorsque la fonction "Les candidat{e}s peuvent indiquer et g\u00E9rer leurs r\u00E9f\u00E9rent{e}s" n'est pas activ\u00E9e.<br>Le mod\u00E8le "Confirmation de candidature avec gestion des r\u00E9f\u00E9rences" est activ\u00E9 et envoy\u00E9 automatiquement aux candidat{e}s lorsque cette fonction est activ\u00E9e.<br>Dans la navigation principale du mode \u00E9dition, acc\u00E9dez \u00E0 "<a href\='{0}'>R\u00E9f\u00E9rent{e} / expert{e}</a>" pour configurer les r\u00E9f\u00E9rent{e}s et leur gestion.
