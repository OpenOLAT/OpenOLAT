position.tags.description=Tutaj mo\u017Cesz aktywowa\u0107 tagi systemowe i tagi specyficzne dla konkursu.<br>Je\u015Bli tagi systemowe s\u0105 aktywne, wy\u015Bwietlana jest tutaj lista dost\u0119pnych tag\u00F3w systemowych. Tagi systemowe mo\u017Ce edytowa\u0107 tylko osoba z uprawnieniami administratora w administracji systemu.<br>Je\u015Bli tagi konkursu s\u0105 aktywne, mo\u017Cna je tutaj dodawa\u0107, edytowa\u0107, usuwa\u0107 lub \u0142\u0105czy\u0107. Uwaga\: je\u015Bli tag o tej samej nazwie istnieje na poziomie systemu i konkursu, przy dodawaniu do kandydatury u\u017Cywany jest odpowiedni tag konkursu.
