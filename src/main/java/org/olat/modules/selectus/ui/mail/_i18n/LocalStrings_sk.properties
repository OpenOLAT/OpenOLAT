mail.templates.description=Syst\u00E9mov\u00E9 e-mailov\u00E9 \u0161abl\u00F3ny aktivovan\u00FDch funkci\u00ED m\u00F4\u017Eete prisp\u00F4sobi\u0165 alebo, ak u\u017E boli prisp\u00F4soben\u00E9, obnovi\u0165 na p\u00F4vodn\u00FA verziu.<br>Pomocou tla\u010Didla "$\:add.template" m\u00F4\u017Eete vytvori\u0165 \u010Fal\u0161ie e-mailov\u00E9 \u0161abl\u00F3ny \u0161pecifick\u00E9 pre pracovn\u00FA poz\u00EDciu na kontaktovanie uch\u00E1dza\u010Dov. Existuj\u00FAce \u0161abl\u00F3ny pracovn\u00FDch poz\u00EDci\u00ED je mo\u017En\u00E9 upravi\u0165 alebo vymaza\u0165, nie je v\u0161ak mo\u017En\u00E9 ich obnovi\u0165 na predch\u00E1dzaj\u00FAcu verziu.
mail.templates.description.with.letter=E-mailov\u00E9 \u0161abl\u00F3ny s hromadn\u00FDm listom obsahuj\u00FA prilo\u017Een\u00FD hromadn\u00FD list vo form\u00E1te PDF. Text hromadn\u00E9ho listu je mo\u017En\u00E9 prisp\u00F4sobi\u0165, definova\u0165 alebo upravi\u0165 iba tu, nie pri odosielan\u00ED e-mailov uch\u00E1dza\u010Dom. Nezabudnite, \u017Ee pri obnoven\u00ED syst\u00E9movej e-mailovej \u0161abl\u00F3ny s hromadn\u00FDm listom sa obnov\u00ED aj text hromadn\u00E9ho listu.
mail.templates.description.with.management=\u0160abl\u00F3na "Potvrdenie prihl\u00E1\u0161ky bez spr\u00E1vy referen\u010Dn\u00FDch os\u00F4b" je akt\u00EDvna a automaticky sa odosiela uch\u00E1dza\u010Dom, ak funkcia "Uch\u00E1dza\u010Di m\u00F4\u017Eu uv\u00E1dza\u0165 a spravova\u0165 referen\u010Dn\u00E9 osoby" nie je aktivovan\u00E1.<br>\u0160abl\u00F3na "Potvrdenie prihl\u00E1\u0161ky so spr\u00E1vou referen\u010Dn\u00FDch os\u00F4b" je akt\u00EDvna a automaticky sa odosiela uch\u00E1dza\u010Dom, ak je funkcia "Uch\u00E1dza\u010Di m\u00F4\u017Eu uv\u00E1dza\u0165 a spravova\u0165 referen\u010Dn\u00E9 osoby" aktivovan\u00E1.<br>Ak chcete nakonfigurova\u0165 referen\u010Dn\u00E9 osoby a ich spr\u00E1vu, prejdite v hlavnej navig\u00E1cii re\u017Eimu \u00FAprav na "<a href\='{0}'>Referen\u010Dn\u00E1 osoba / Posudzovate\u013E</a>".
