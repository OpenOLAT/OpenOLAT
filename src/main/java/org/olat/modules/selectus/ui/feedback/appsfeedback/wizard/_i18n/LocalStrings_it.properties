wizard.email.explanation.ldap=Si prega di indicare l'indirizzo o gli indirizzi e-mail delle persone che si desidera aggiungere alle candidature selezionate. Separare pi\u00F9 indirizzi e-mail con un punto e virgola (;). Se una persona dispone di un login LDAP o \u00E8 gi\u00E0 registrata come utente nel sistema, i suoi dati vengono ripresi automaticamente.
