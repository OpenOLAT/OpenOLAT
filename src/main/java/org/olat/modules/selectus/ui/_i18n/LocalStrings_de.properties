reference.comparative.expert.mail.body=<p>$refereeDearTitleName,</p><p>ich wende mich an Sie im Zusammenhang mit dem Berufungsverfahren an der OpenOlat University f\u00FCr die offene Position "$positionTitle".</p><p>Die Berufungskommission zieht f\u00FCr diese Position die folgenden Kandidaturen in Betracht\:<br>$applicantList</p><p>Da Sie auf diesem Gebiet \u00FCber besondere Fachkenntnis verf\u00FCgen, w\u00E4ren wir Ihnen sehr dankbar, wenn Sie uns bei der Beurteilung unterst\u00FCtzen und ein Vergleichsgutachten zur Eignung dieser Kandidaturen f\u00FCr die offene Position verfassen w\u00FCrden. Wir freuen uns, Ihr Gutachten m\u00F6glichst bald, sp\u00E4testens jedoch bis zum $refereeDeadline, zu erhalten.</p><p>Bitte folgen Sie dem untenstehenden Link, um unsere Anfrage anzunehmen, Informationen zu den Kandidaturen und zum Profil der Position zu erhalten und Ihr Gutachten als einzelne PDF-Datei hochzuladen. Sollten Sie nicht als Gutachterin oder Gutachter zur Verf\u00FCgung stehen, bitten wir Sie, uns dies \u00FCber denselben Link mitzuteilen und die Anfrage abzulehnen\:<br>$refereeUrl</p><p>Mit freundlichen Gr\u00FCssen<br>$headFirstname $headLastname<br>Pr\u00E4sidium der Berufungskommission</p>
