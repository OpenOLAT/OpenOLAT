edit.form_description=F\u00FCllen Sie das untenstehende Formular aus, um eine neue Ausschreibung zu erstellen. \u00DCber den Ausschreibungsstatus publizieren Sie die offene Stelle oder lassen sie im Status "In Vorbereitung". Alle Felder k\u00F6nnen sp\u00E4ter ge\u00E4ndert werden.
edit.form_description.apps.feedback=W\u00E4hlen Sie, ob die Sachbearbeitung Feedback von Fakult\u00E4tsmitgliedern einholen kann. Wenn ja, k\u00F6nnen Sie die Details unten konfigurieren. Alle Felder k\u00F6nnen sp\u00E4ter ge\u00E4ndert werden.<br>Fakult\u00E4tsmitglieder ben\u00F6tigen einen Login, um Feedback abzugeben. Die Sichtbarkeit der Bewerbungsdokumente f\u00FCr Fakult\u00E4tsmitglieder konfigurieren Sie im Tab "$\:edit.step.references.visibility".
edit.form_description.comparative.experts=W\u00E4hlen Sie, ob die Sachbearbeitung Gutachter{innen} f\u00FCr ein Vergleichsgutachten \u00FCber mehrere Bewerbungen hinzuf\u00FCgen kann, und konfigurieren Sie in diesem Fall die Details unten. Eine solche Person erh\u00E4lt Zugang zu mehreren Bewerbungen und kann eine einzelne Datei mit einem Vergleichsgutachten dieser Bewerbungen hochladen.<br>Nach der Aktivierung k\u00F6nnen Sie im Tab "$\:edit.step.references.visibility" konfigurieren, welche Elemente der Bewerbungen f\u00FCr diese Personen sichtbar sind.
edit.form_description.configuration=Konfigurieren Sie die Ausschreibung unten, indem Sie die f\u00FCr diese Ausschreibung relevanten Optionen w\u00E4hlen. Alle Felder k\u00F6nnen sp\u00E4ter ge\u00E4ndert werden.
edit.form_description.decision=Aktivieren bzw. deaktivieren Sie das Entscheidungswerkzeug, das w\u00E4hrend einer Kommissionssitzung verwendet werden kann. Entscheidungsrubriken k\u00F6nnen direkt im Werkzeug erstellt werden.
edit.form_description.document=W\u00E4hlen Sie aus der untenstehenden Liste, welche Dokumente Sie f\u00FCr die Ausschreibung verlangen. Klicken Sie auf "Bearbeiten", um weitere Details eines Dokuments anzupassen.
edit.form_description.experts=W\u00E4hlen Sie, ob die Sachbearbeitung Gutachter{innen} hinzuf\u00FCgen kann, und konfigurieren Sie in diesem Fall die Details unten. Eine Gutachterperson erh\u00E4lt Zugang zu einer einzelnen Bewerbung und kann eine Datei mit einem Gutachten zu dieser Bewerbung hochladen.<br>Nach der Aktivierung k\u00F6nnen Sie im Tab "$\:edit.step.references.visibility" konfigurieren, welche Elemente der Bewerbungen f\u00FCr diese Personen sichtbar sind.
edit.form_description.public.feedback=W\u00E4hlen Sie, ob Bewerbungen einen Link f\u00FCr \u00F6ffentliche R\u00FCckmeldungen haben. Wenn ja, k\u00F6nnen Sie unten die Einreichefrist erfassen. Alle Felder k\u00F6nnen sp\u00E4ter ge\u00E4ndert werden. Sind die Links aktiviert, k\u00F6nnen sie zum Teilen kopiert werden (ein Link pro Bewerbung). Die Links sind nur mit Login zug\u00E4nglich. F\u00FCr Personen, die den Link \u00F6ffnen, ist nur der Name der Bewerbung sichtbar.
edit.form_description.referees=W\u00E4hlen Sie, ob die Sachbearbeitung Gutachter{innen} hinzuf\u00FCgen kann und ob Bewerbende Referenzpersonen angeben k\u00F6nnen. Wenn ja, k\u00F6nnen Sie die Details unten konfigurieren. Alle Felder k\u00F6nnen sp\u00E4ter ge\u00E4ndert werden.
edit.form_description.referees.management=W\u00E4hlen Sie, ob Bewerbende Referenzpersonen angeben und verwalten k\u00F6nnen, und konfigurieren Sie in diesem Fall die Details unten.<br>Beachten Sie\: K\u00F6nnen Bewerbende Referenzpersonen verwalten, wird die E-Mail an die Referenzpersonen immer unmittelbar nach dem Einreichen der Bewerbung gesendet.<br>Nach der Aktivierung k\u00F6nnen Sie im Tab "$\:edit.step.references.visibility" konfigurieren, welche Elemente der Bewerbungen f\u00FCr die Referenzpersonen sichtbar sind.
edit.form_description.status=Definieren Sie die angegebenen Fristen und konfigurieren Sie, ob Kommissionsmitglieder ohne Beurteilung automatisch per E-Mail erinnert werden sollen. \u00DCber den Ausschreibungsstatus publizieren Sie die offene Stelle oder lassen sie im Status "In Vorbereitung". Alle Felder k\u00F6nnen sp\u00E4ter ge\u00E4ndert werden.
