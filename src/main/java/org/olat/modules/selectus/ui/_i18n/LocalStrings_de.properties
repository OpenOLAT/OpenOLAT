apply_application.acceptTerms=Ich bin damit einverstanden, dass die zugeh\u00F6rige Kommission alle notwendigen Schritte unternehmen darf, um meine Bewerbung zu evaluieren. Dies kann die Anfrage nach Referenzschreiben von internen oder externen Experten beinhalten.
apply_application.acceptTerms.error=Bevor Sie Ihre Bewerbung hochladen k\u00F6nnen, m\u00FCssen Sie die Datenschutz- und Bewertungsbestimmungen akzeptieren.
apply_application.acceptTerms.lastStep=Ich bin damit einverstanden, dass die zust\u00E4ndige Berufungskommission alle notwendigen Massnahmen ergreift, um meine Bewerbung zu beurteilen. Dies kann auch das Einholen von Referenzschreiben interner und/oder externer Gutachterpersonen umfassen.
apply_application.email=<p>Sehr geehrte, sehr geehrter {0}</p><p>Im Namen des Dekanats danken wir Ihnen f\u00FCr Ihre Bewerbung auf die oben genannte Position. Ihre Bewerbung wird der Kommission vorgelegt, die das Dekanat bei der Auswahl der Kandidaturen ber\u00E4t.</p><p>Die sorgf\u00E4ltige Pr\u00FCfung der vielen Bewerbungen wird einige Zeit in Anspruch nehmen. Wir werden uns so bald wie m\u00F6glich wieder bei Ihnen melden.</p><p>Mit freundlichen Gr\u00FCssen<br>Gesch\u00E4ftsstelle</p>
