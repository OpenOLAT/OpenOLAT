edit.steps=Schritte bearbeiten
edit.steps.explain=<p>Klicken Sie auf "$\:edit.steps", um die Schritte zu aktivieren bzw. zu deaktivieren, die im Bewerbungsprozess erscheinen sollen.<br>Klicken Sie auf die jeweiligen Schritte, um deren Inhalt anzupassen und eine Vorschau anzuzeigen. Die Anpassungsm\u00F6glichkeiten unterscheiden sich je Schritt.</p><ul><li>Passen Sie die Anleitungs- und Hilfetexte an, die in den verschiedenen Schritten des Bewerbungsprozesses sichtbar sind.</li><li>F\u00FCgen Sie eigene Fragen zu den Schritten "$\:edit.step.personal.data", "$\:edit.step.academical.background" und "$\:edit.step.project" hinzu.</li><li>W\u00E4hlen Sie im Schritt "$\:edit.step.documents", welche Dokumente von Bewerbenden verlangt werden.</li><li>Konfigurieren Sie die Feedback-Optionen im Schritt "$\:edit.step.review.and.submit".</li><li>Passen Sie den Best\u00E4tigungstext und die E-Mail an, die Bewerbende nach dem Einreichen ihrer Bewerbung erhalten, im Schritt "$\:edit.step.confirmation".</li><li>Beachten Sie, dass Referenzpersonen im Tab "Referenzperson / Gutachter{in}" in der Hauptnavigation des Bearbeitungsmodus konfiguriert werden.</li></ul>
