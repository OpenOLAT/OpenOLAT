apps.feedback.acknowledge.text=<p>Sie sind dabei, die vertraulichen Unterlagen von {0} Bewerbung(en) mit {1} Fakult\u00E4tsmitglied(ern) zu teilen, die nicht der Berufungskommission angeh\u00F6ren.</p><p>Je nach Konfiguration k\u00F6nnen Fakult\u00E4tsmitglieder einen Teil oder alle Daten der Bewerbung sowie die folgenden Dokumente sehen\:</p><p>{2}</p><p>Vertrauliche Unterlagen d\u00FCrfen nur geteilt werden, wenn dies notwendig ist und von der Berufungskommission bewilligt wurde.</p><p>M\u00F6chten Sie wirklich fortfahren?</p>
