edit.rating.policy.points.confidentiality=Wir bitten Sie, alle Informationen und Dokumente streng vertraulich zu behandeln. Alle Dokumente und m\u00FCndlichen Informationen zu den Kandidaturen, die die Berufungskommission im Verlauf der Vorbereitung des Verfahrens erh\u00E4lt, unterliegen der Vertraulichkeit.<br/>Die Dokumente sind ausschliesslich f\u00FCr die Mitglieder der Berufungskommission bestimmt. Dokumente d\u00FCrfen weder kopiert noch auf andere Weise Dritten zug\u00E4nglich gemacht werden. Heruntergeladene Dokumente und Ausdrucke sind nach Abschluss des Verfahrens zu l\u00F6schen bzw. zu vernichten.<br/>Ihre Beurteilungen im Werkzeug sind f\u00FCr die Sachbearbeitung, das Kommissionspr\u00E4sidium und die anderen Kommissionsmitglieder anonymisiert.<br/>Ihre Kommentare sind pers\u00F6nlich. Die Sachbearbeitung, das Kommissionspr\u00E4sidium und die anderen Kommissionsmitglieder haben keinen Zugriff. Nach Abschluss des gesamten Verfahrens werden alle relevanten Daten vom Server gel\u00F6scht.
edit.rating.policy.points.confidentiality.title=Vertraulichkeit\:
edit.rating.policy.points.focus=Im Zentrum steht die Exzellenz in Forschung und Lehre. Eine perfekte Passung zum Profil ist zweitrangig.
edit.rating.policy.points.focus.title=Fokus auf Exzellenz\:
edit.rating.policy.points.introduction=Es ist \u00FCblich, dass qualifizierte Wissenschaftlerinnen und Wissenschaftler, die sich nicht beworben haben und daher nicht auf der Bewerbungsliste stehen, in jeder Phase des Verfahrens eingebracht werden k\u00F6nnen. Wir ermutigen alle Mitglieder der Berufungskommission ausdr\u00FCcklich, an m\u00F6gliche Spitzenkandidaturen zu denken und deren Lebenslauf und Publikationsliste entweder an die Sitzungen mitzubringen oder uns vorab zu senden, damit wir sie allen Kommissionsmitgliedern im Vorfeld weiterleiten k\u00F6nnen.
