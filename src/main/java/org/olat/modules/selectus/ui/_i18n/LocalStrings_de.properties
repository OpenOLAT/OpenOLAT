rejection.mail.body=<p>Sehr geehrte, sehr geehrter $nameAndTitle</p><p>ich wende mich an Sie im Zusammenhang mit Ihrer Bewerbung auf die oben genannte Position.</p><p>Die mich in dieser Angelegenheit beratende Berufungskommission hat die Bewerbungen inzwischen sorgf\u00E4ltig gepr\u00FCft. Nach ausf\u00FChrlicher Diskussion haben die Mitglieder empfohlen, andere Kandidaturen f\u00FCr das Auswahlverfahren zu ber\u00FCcksichtigen. Ich habe entschieden, dieser Empfehlung zu folgen, und bedaure, Ihnen mitteilen zu m\u00FCssen, dass Ihre Kandidatur daher nicht weiter ber\u00FCcksichtigt wird.</p><p>Ich danke Ihnen sehr f\u00FCr die Zeit, die Sie in Ihre Bewerbung investiert haben, und w\u00FCnsche Ihnen f\u00FCr Ihren weiteren beruflichen Weg alles Gute.</p><p>Mit freundlichen Gr\u00FCssen<br>$headFirstname $headLastname<br>Pr\u00E4sidium der Kommission</p>
rejection.mail.bonhold.body=<p>$dearTitleAndName</p><p>Sie haben sich auf die "{0}" beworben. Wir danken Ihnen f\u00FCr Ihr damit bekundetes Interesse an einer T\u00E4tigkeit an der Universit\u00E4t OpenOlat. </p><p>Leider muss ich Ihnen mitteilen, dass die zust\u00E4ndige Berufungskommission nach eingehender Pr\u00FCfung Ihrer Bewerbung entschieden hat, Ihre Bewerbung nicht in die engste Wahl f\u00FCr die ausgeschriebene Stelle aufzunehmen. Ihr Einverst\u00E4ndnis vorausgesetzt, m\u00F6chte die Kommission Ihre Bewerbung jedoch noch pendent halten. Ihre elektronisch eingereichten Bewerbungsunterlagen w\u00FCrden erst nach dem endg\u00FCltigen Abschluss des Berufungsverfahrens gel\u00F6scht, wir w\u00FCrden Sie wieder dar\u00FCber informieren.</p><p>Freundliche Gr\u00FCsse<br>Prof. Dr. {2}<br>Pr\u00E4sidium der Berufungskommission<br>Universit\u00E4t OpenOlat</p>
rejection.mail.bonhold.subject=Ihre Bewerbung an die Universit\u00E4t OpenOlat
rejection.mail.crejection.body=<p>$dearTitleAndName</p><p>Sie haben sich auf die "{0}" beworben. Wir danken Ihnen f\u00FCr Ihr damit bekundetes Interesse an einer T\u00E4tigkeit an der Universit\u00E4t OpenOlat.</p><p>Leider muss ich Ihnen mitteilen, dass die zust\u00E4ndige Berufungskommission entschieden hat, Ihre Bewerbung im weiteren Verfahren nicht mehr zu ber\u00FCcksichtigen.</p><p>Ihre elektronischen Bewerbungsunterlagen werden aus datenschutzrechtlichen Gr\u00FCnden gel\u00F6scht.</p><p>Im Namen der Kommission w\u00FCnsche ich Ihnen f\u00FCr Ihre wissenschaftliche Laufbahn viel Erfolg und alles Gute.</p><p>Freundliche Gr\u00FCsse<br>Prof. Dr. {2}<br>Pr\u00E4sidium der Berufungskommission\nUniversit\u00E4t OpenOlat</p>
