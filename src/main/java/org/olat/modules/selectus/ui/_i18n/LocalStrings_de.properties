edit.step.references.visibility.explain=W\u00E4hlen Sie, welche Elemente des Bewerbungsprofils f\u00FCr Gutachter{innen} und Referenzpersonen in ihrem Beurteilungsprozess sichtbar sind. Standardm\u00E4ssig werden keine Bewerbungsangaben offengelegt. W\u00E4hlen Sie "alle", um alle eingereichten Angaben verf\u00FCgbar zu machen, oder "anpassen", um nur Teile des Bewerbungsprofils offenzulegen.
