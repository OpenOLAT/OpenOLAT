edit.form_description=Wype\u0142nij poni\u017Cszy formularz, aby utworzy\u0107 nowy konkurs. Za pomoc\u0105 statusu konkursu publikujesz wolne stanowisko lub pozostawiasz je w statusie "W przygotowaniu". Wszystkie pola mo\u017Cna p\u00F3\u017Aniej zmieni\u0107.
edit.form_description.apps.feedback=Wybierz, czy administracja mo\u017Ce zbiera\u0107 feedback od cz\u0142onk\u00F3w wydzia\u0142u. Je\u015Bli tak, mo\u017Cesz skonfigurowa\u0107 szczeg\u00F3\u0142y poni\u017Cej. Wszystkie pola mo\u017Cna p\u00F3\u017Aniej zmieni\u0107.<br>Cz\u0142onkowie wydzia\u0142u potrzebuj\u0105 loginu, aby przekaza\u0107 feedback. Widoczno\u015B\u0107 dokument\u00F3w kandydatury dla cz\u0142onk\u00F3w wydzia\u0142u konfigurujesz w zak\u0142adce "$\:edit.step.references.visibility".
edit.form_description.comparative.experts=Wybierz, czy administracja mo\u017Ce dodawa\u0107 ekspert\u00F3w do ekspertyzy por\u00F3wnawczej kilku kandydatur, i w takim przypadku skonfiguruj szczeg\u00F3\u0142y poni\u017Cej. Taka osoba otrzymuje dost\u0119p do kilku kandydatur i mo\u017Ce przes\u0142a\u0107 jeden plik z ekspertyz\u0105 por\u00F3wnawcz\u0105 tych kandydatur.<br>Po aktywacji mo\u017Cesz w zak\u0142adce "$\:edit.step.references.visibility" skonfigurowa\u0107, kt\u00F3re elementy kandydatur s\u0105 widoczne dla tych os\u00F3b.
edit.form_description.configuration=Skonfiguruj poni\u017Cej konkurs, wybieraj\u0105c opcje istotne dla tego konkursu. Wszystkie pola mo\u017Cna p\u00F3\u017Aniej zmieni\u0107.
edit.form_description.decision=Aktywuj lub dezaktywuj narz\u0119dzie decyzyjne, kt\u00F3rego mo\u017Cna u\u017Cywa\u0107 podczas posiedzenia komisji. Rubryki decyzyjne mo\u017Cna tworzy\u0107 bezpo\u015Brednio w narz\u0119dziu.
edit.form_description.document=Wybierz z poni\u017Cszej listy, jakich dokument\u00F3w wymagasz w konkursie. Kliknij "Edytuj", aby dostosowa\u0107 dalsze szczeg\u00F3\u0142y dokumentu.
edit.form_description.experts=Wybierz, czy administracja mo\u017Ce dodawa\u0107 ekspert\u00F3w, i w takim przypadku skonfiguruj szczeg\u00F3\u0142y poni\u017Cej. Ekspert otrzymuje dost\u0119p do jednej kandydatury i mo\u017Ce przes\u0142a\u0107 plik z ekspertyz\u0105 dotycz\u0105c\u0105 tej kandydatury.<br>Po aktywacji mo\u017Cesz w zak\u0142adce "$\:edit.step.references.visibility" skonfigurowa\u0107, kt\u00F3re elementy kandydatur s\u0105 widoczne dla tych os\u00F3b.
edit.form_description.public.feedback=Wybierz, czy kandydatury maj\u0105 link do publicznej informacji zwrotnej. Je\u015Bli tak, mo\u017Cesz poni\u017Cej wprowadzi\u0107 termin przes\u0142ania. Wszystkie pola mo\u017Cna p\u00F3\u017Aniej zmieni\u0107. Je\u015Bli linki s\u0105 aktywne, mo\u017Cna je skopiowa\u0107 w celu udost\u0119pnienia (jeden link na kandydatur\u0119). Linki s\u0105 dost\u0119pne tylko po zalogowaniu. Osoby otwieraj\u0105ce link widz\u0105 tylko nazwisko kandydata.
edit.form_description.referees=Wybierz, czy administracja mo\u017Ce dodawa\u0107 ekspert\u00F3w i czy kandydaci mog\u0105 wskazywa\u0107 osoby polecaj\u0105ce. Je\u015Bli tak, mo\u017Cesz skonfigurowa\u0107 szczeg\u00F3\u0142y poni\u017Cej. Wszystkie pola mo\u017Cna p\u00F3\u017Aniej zmieni\u0107.
edit.form_description.referees.management=Wybierz, czy kandydaci mog\u0105 wskazywa\u0107 osoby polecaj\u0105ce i nimi zarz\u0105dza\u0107, i w takim przypadku skonfiguruj szczeg\u00F3\u0142y poni\u017Cej.<br>Uwaga\: je\u015Bli kandydaci mog\u0105 zarz\u0105dza\u0107 osobami polecaj\u0105cymi, e-mail do os\u00F3b polecaj\u0105cych jest zawsze wysy\u0142any bezpo\u015Brednio po z\u0142o\u017Ceniu kandydatury.<br>Po aktywacji mo\u017Cesz w zak\u0142adce "$\:edit.step.references.visibility" skonfigurowa\u0107, kt\u00F3re elementy kandydatur s\u0105 widoczne dla os\u00F3b polecaj\u0105cych.
edit.form_description.status=Zdefiniuj podane terminy i skonfiguruj, czy cz\u0142onkowie komisji bez wydanej opinii maj\u0105 otrzymywa\u0107 automatyczne przypomnienia e-mailem. Za pomoc\u0105 statusu konkursu publikujesz wolne stanowisko lub pozostawiasz je w statusie "W przygotowaniu". Wszystkie pola mo\u017Cna p\u00F3\u017Aniej zmieni\u0107.
