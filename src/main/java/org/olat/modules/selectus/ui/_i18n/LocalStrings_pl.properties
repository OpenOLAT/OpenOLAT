edit.rating.policy.points.confidentiality=Prosimy o traktowanie wszystkich informacji i dokument\u00F3w jako \u015Bci\u015Ble poufnych. Wszystkie dokumenty i ustne informacje dotycz\u0105ce kandydatur, kt\u00F3re komisja rekrutacyjna otrzymuje w trakcie przygotowania post\u0119powania, podlegaj\u0105 poufno\u015Bci.<br/>Dokumenty s\u0105 przeznaczone wy\u0142\u0105cznie dla cz\u0142onk\u00F3w komisji rekrutacyjnej. Dokument\u00F3w nie wolno kopiowa\u0107 ani w inny spos\u00F3b udost\u0119pnia\u0107 osobom trzecim. Pobrane dokumenty i wydruki nale\u017Cy po zako\u0144czeniu post\u0119powania usun\u0105\u0107 lub zniszczy\u0107.<br/>Twoje opinie w narz\u0119dziu s\u0105 zanonimizowane dla administracji, przewodnictwa komisji i pozosta\u0142ych cz\u0142onk\u00F3w komisji.<br/>Twoje komentarze s\u0105 osobiste. Administracja, przewodnictwo komisji i pozostali cz\u0142onkowie komisji nie maj\u0105 do nich dost\u0119pu. Po zako\u0144czeniu ca\u0142ego post\u0119powania wszystkie istotne dane zostan\u0105 usuni\u0119te z serwera.
edit.rating.policy.points.confidentiality.title=Poufno\u015B\u0107\:
edit.rating.policy.points.focus=Najwa\u017Cniejsza jest doskona\u0142o\u015B\u0107 w badaniach i dydaktyce. Idealne dopasowanie do profilu ma znaczenie drugorz\u0119dne.
edit.rating.policy.points.focus.title=Nacisk na doskona\u0142o\u015B\u0107\:
edit.rating.policy.points.introduction=Przyj\u0119te jest, \u017Ce wykwalifikowani naukowcy, kt\u00F3rzy nie z\u0142o\u017Cyli kandydatury i w zwi\u0105zku z tym nie figuruj\u0105 na li\u015Bcie kandydatur, mog\u0105 zosta\u0107 zg\u0142oszeni na ka\u017Cdym etapie post\u0119powania. Wyra\u017Anie zach\u0119camy wszystkich cz\u0142onk\u00F3w komisji rekrutacyjnej do rozwa\u017Cenia potencjalnych czo\u0142owych kandydatur i przyniesienia ich \u017Cyciorysu oraz listy publikacji na posiedzenia lub wcze\u015Bniejszego przes\u0142ania ich do nas, aby\u015Bmy mogli przekaza\u0107 je z wyprzedzeniem wszystkim cz\u0142onkom komisji.
edit.rating.policy.points.introduction.title=Zg\u0142aszanie potencjalnych kandydatur\:
edit.rating.policy.points.women=Aby zwi\u0119kszy\u0107 liczb\u0119 kobiet na kierowniczych stanowiskach akademickich, wydzia\u0142 przy por\u00F3wnywalnych kwalifikacjach naukowych i dydaktycznych preferuje kandydatki przed kandydatami.
