edit.steps.explain=<p>Kliknij "$\:edit.steps", aby aktywowa\u0107 lub dezaktywowa\u0107 kroki, kt\u00F3re maj\u0105 pojawi\u0107 si\u0119 w procesie sk\u0142adania kandydatury.<br>Kliknij poszczeg\u00F3lne kroki, aby dostosowa\u0107 ich tre\u015B\u0107 i wy\u015Bwietli\u0107 podgl\u0105d. Mo\u017Cliwo\u015Bci dostosowania r\u00F3\u017Cni\u0105 si\u0119 w zale\u017Cno\u015Bci od kroku.</p><ul><li>Dostosuj teksty instrukcji i pomocy widoczne w r\u00F3\u017Cnych krokach procesu sk\u0142adania kandydatury.</li><li>Dodaj w\u0142asne pytania do krok\u00F3w "$\:edit.step.personal.data", "$\:edit.step.academical.background" i "$\:edit.step.project".</li><li>W kroku "$\:edit.step.documents" wybierz, jakich dokument\u00F3w wymaga si\u0119 od kandydat\u00F3w.</li><li>Skonfiguruj opcje feedbacku w kroku "$\:edit.step.review.and.submit".</li><li>W kroku "$\:edit.step.confirmation" dostosuj tekst potwierdzenia i e-mail, kt\u00F3re kandydaci otrzymuj\u0105 po z\u0142o\u017Ceniu kandydatury.</li><li>Pami\u0119taj, \u017Ce osoby polecaj\u0105ce konfiguruje si\u0119 w zak\u0142adce "Osoba polecaj\u0105ca / ekspert" w g\u0142\u00F3wnej nawigacji trybu edycji.</li></ul>
