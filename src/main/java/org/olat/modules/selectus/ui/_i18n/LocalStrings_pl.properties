reference.comparative.expert.mail.body=<p>$refereeDearTitleName,</p><p>zwracam si\u0119 do Pani/Pana w zwi\u0105zku z post\u0119powaniem rekrutacyjnym na OpenOlat University na wolne stanowisko "$positionTitle".</p><p>Komisja rekrutacyjna rozwa\u017Ca na to stanowisko nast\u0119puj\u0105ce kandydatury\:<br>$applicantList</p><p>Poniewa\u017C dysponuje Pani/Pan szczeg\u00F3ln\u0105 wiedz\u0105 specjalistyczn\u0105 w tej dziedzinie, byliby\u015Bmy bardzo wdzi\u0119czni za wsparcie w opiniowaniu i sporz\u0105dzenie ekspertyzy por\u00F3wnawczej dotycz\u0105cej przydatno\u015Bci tych kandydatur na wolne stanowisko. Z przyjemno\u015Bci\u0105 otrzymamy ekspertyz\u0119 mo\u017Cliwie jak najszybciej, jednak nie p\u00F3\u017Aniej ni\u017C do $refereeDeadline.</p><p>Prosz\u0119 skorzysta\u0107 z poni\u017Cszego linku, aby przyj\u0105\u0107 nasz\u0105 pro\u015Bb\u0119, uzyska\u0107 informacje o kandydaturach i profilu stanowiska oraz przes\u0142a\u0107 ekspertyz\u0119 jako pojedynczy plik PDF. Je\u015Bli nie mo\u017Ce Pani/Pan pe\u0142ni\u0107 funkcji eksperta, prosimy o poinformowanie nas o tym za pomoc\u0105 tego samego linku i odrzucenie pro\u015Bby\:<br>$refereeUrl</p><p>Z powa\u017Caniem<br>$headFirstname $headLastname<br>Przewodnictwo komisji rekrutacyjnej</p>
