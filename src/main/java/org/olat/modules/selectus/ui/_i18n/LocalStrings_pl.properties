apply_application.acceptTerms=Wyra\u017Cam zgod\u0119 na to, aby w\u0142a\u015Bciwa komisja podj\u0119\u0142a wszelkie niezb\u0119dne kroki w celu oceny mojej kandydatury. Mo\u017Ce to obejmowa\u0107 pro\u015Bb\u0119 o listy polecaj\u0105ce od ekspert\u00F3w wewn\u0119trznych lub zewn\u0119trznych.
apply_application.acceptTerms.error=Zanim prze\u015Blesz swoj\u0105 kandydatur\u0119, musisz zaakceptowa\u0107 zasady ochrony danych i oceny.
apply_application.acceptTerms.lastStep=Wyra\u017Cam zgod\u0119 na to, aby w\u0142a\u015Bciwa komisja rekrutacyjna podj\u0119\u0142a wszelkie niezb\u0119dne dzia\u0142ania w celu zaopiniowania mojej kandydatury. Mo\u017Ce to obejmowa\u0107 r\u00F3wnie\u017C uzyskanie list\u00F3w polecaj\u0105cych od wewn\u0119trznych i/lub zewn\u0119trznych ekspert\u00F3w.
apply_application.email=<p>Szanowna Pani, Szanowny Panie {0}</p><p>W imieniu dziekanatu dzi\u0119kujemy za z\u0142o\u017Cenie kandydatury na wy\u017Cej wymienione stanowisko. Kandydatura zostanie przedstawiona komisji, kt\u00F3ra doradza dziekanatowi w wyborze kandydat\u00F3w.</p><p>Staranne rozpatrzenie wielu kandydatur zajmie troch\u0119 czasu. Skontaktujemy si\u0119 z Pani\u0105/Panem mo\u017Cliwie jak najszybciej.</p><p>Z wyrazami szacunku<br>Biuro</p>
