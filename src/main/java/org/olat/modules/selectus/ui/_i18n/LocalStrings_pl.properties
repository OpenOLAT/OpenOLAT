rejection.mail.body=<p>Szanowna Pani, Szanowny Panie $nameAndTitle</p><p>zwracam si\u0119 do Pani/Pana w zwi\u0105zku z Pani/Pana kandydatur\u0105 na wy\u017Cej wymienione stanowisko.</p><p>Doradzaj\u0105ca mi w tej sprawie komisja rekrutacyjna starannie rozpatrzy\u0142a kandydatury. Po obszernej dyskusji cz\u0142onkowie zalecili uwzgl\u0119dnienie w procedurze wyboru innych kandydatur. Postanowi\u0142em zastosowa\u0107 si\u0119 do tego zalecenia i z przykro\u015Bci\u0105 informuj\u0119, \u017Ce Pani/Pana kandydatura nie b\u0119dzie w zwi\u0105zku z tym dalej rozpatrywana.</p><p>Serdecznie dzi\u0119kuj\u0119 za czas po\u015Bwi\u0119cony na przygotowanie kandydatury i \u017Cycz\u0119 wszystkiego dobrego na dalszej drodze zawodowej.</p><p>Z powa\u017Caniem<br>$headFirstname $headLastname<br>Przewodnictwo komisji</p>
rejection.mail.bonhold.body=<p>$dearTitleAndName</p><p>Z\u0142o\u017Cy\u0142(a) Pani/Pan kandydatur\u0119 na "{0}". Dzi\u0119kujemy za wyra\u017Cone w ten spos\u00F3b zainteresowanie prac\u0105 na Uniwersytecie OpenOlat. </p><p>Niestety musz\u0119 poinformowa\u0107, \u017Ce w\u0142a\u015Bciwa komisja rekrutacyjna po wnikliwym rozpatrzeniu kandydatury postanowi\u0142a nie umieszcza\u0107 jej na kr\u00F3tkiej li\u015Bcie na og\u0142oszone stanowisko. Za Pani/Pana zgod\u0105 komisja chcia\u0142aby jednak utrzyma\u0107 kandydatur\u0119 w stanie oczekiwania. Dokumenty z\u0142o\u017Cone elektronicznie zosta\u0142yby usuni\u0119te dopiero po ostatecznym zako\u0144czeniu post\u0119powania rekrutacyjnego, o czym ponownie Pani\u0105/Pana poinformujemy.</p><p>Z powa\u017Caniem<br>Prof. Dr. {2}<br>Przewodnictwo komisji rekrutacyjnej<br>Uniwersytet OpenOlat</p>
rejection.mail.bonhold.subject=Twoja kandydatura na Uniwersytecie OpenOlat
rejection.mail.crejection.body=<p>$dearTitleAndName</p><p>Z\u0142o\u017Cy\u0142(a) Pani/Pan kandydatur\u0119 na "{0}". Dzi\u0119kujemy za wyra\u017Cone w ten spos\u00F3b zainteresowanie prac\u0105 na Uniwersytecie OpenOlat.</p><p>Niestety musz\u0119 poinformowa\u0107, \u017Ce w\u0142a\u015Bciwa komisja rekrutacyjna postanowi\u0142a nie uwzgl\u0119dnia\u0107 dalej Pani/Pana kandydatury w post\u0119powaniu.</p><p>Pani/Pana dokumenty elektroniczne zostan\u0105 usuni\u0119te ze wzgl\u0119du na przepisy o ochronie danych.</p><p>W imieniu komisji \u017Cycz\u0119 Pani/Panu wielu sukces\u00F3w i wszystkiego dobrego w karierze naukowej.</p><p>Z powa\u017Caniem<br>Prof. Dr. {2}<br>Przewodnictwo komisji rekrutacyjnej\nUniwersytet OpenOlat</p>
