edit.step.public.feedback.visibility.explain=Wybierz, kt\u00F3re elementy profilu kandydatury s\u0105 widoczne dla os\u00F3b przekazuj\u0105cych informacj\u0119 zwrotn\u0105. Niekt\u00F3re aspekty s\u0105 wst\u0119pnie skonfigurowane i nie mo\u017Cna ich zmieni\u0107. Domy\u015Blnie \u017Cadne dokumenty kandydatury nie s\u0105 ujawniane.
