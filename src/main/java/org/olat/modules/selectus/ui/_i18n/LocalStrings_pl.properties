apply_application.email.dr=Dr
apply_application.email.duplicate=<p>Automatycznie wygenerowane powiadomienie</p><p>{3}</p><p>Otrzymali\u015Bmy ju\u017C Pani/Pana kandydatur\u0119 na "{1}". Je\u015Bli chce Pani/Pan zmieni\u0107 swoje dane, prosz\u0119 wys\u0142a\u0107 e-mail na adres {2}.</p><p>Z powa\u017Caniem<br>Biuro ds. rekrutacji profesor\u00F3w</p>
