apply_application.email.referee.mgmt=<p>Automatycznie wygenerowane potwierdzenie odbioru</p><p>$applicantDearTitleName</p><p>Dzi\u0119kujemy za z\u0142o\u017Cenie kandydatury na "$positionTitle". Pani/Pana dokumenty zostan\u0105 przekazane w\u0142a\u015Bciwej komisji rekrutacyjnej.</p><p>W ramach kandydatury komisja wymaga list\u00F3w polecaj\u0105cych. Prosz\u0119 skorzysta\u0107 z poni\u017Cszego linku, aby zalogowa\u0107 si\u0119 do narz\u0119dzia Faculty Recruiting Tool i \u015Bledzi\u0107 status swoich referencji. Mo\u017Ce Pani/Pan wskaza\u0107 dodatkowe osoby polecaj\u0105ce, je\u015Bli odm\u00F3wi\u0105 one napisania listu polecaj\u0105cego. Przes\u0142ane listy polecaj\u0105ce s\u0105 poufne i nie s\u0105 dla Pani/Pana dost\u0119pne.<br>$applicantURL</p><p>Opiniowanie kandydatur zajmie troch\u0119 czasu. Poinformujemy Pani\u0105/Pana, gdy tylko komisja podejmie decyzj\u0119.</p><p>Z powa\u017Caniem</p>
