disclaimer.privacy.text=<h5>Gromadzenie danych</h5><p>Podczas korzystania z Selectus dane s\u0105 zapisywane. Ze wzgl\u0119du na identyfikowalno\u015B\u0107 dotyczy to r\u00F3wnie\u017C sytuacji, gdy proces zostanie przerwany.</p><p>Gromadzone s\u0105 dane osobowe, takie jak imi\u0119 i nazwisko, e-mail i adres. Przes\u0142ane dane i dokumenty s\u0105 widoczne dla opiniuj\u0105cej komisji oraz ewentualnie r\u00F3wnie\u017C dla ekspert\u00F3w i recenzent\u00F3w. Ponadto rejestrowane s\u0105 dane online, takie jak adres IP, lokalizacja, wersja przegl\u0105darki oraz data i godzina dost\u0119pu. Dane te s\u0105 zapisywane w plikach log\u00F3w w celu zapewnienia identyfikowalno\u015Bci.</p><p>Po zako\u0144czeniu post\u0119powania dane s\u0105 przechowywane przez kolejne dwa lata, a nast\u0119pnie trwale usuwane.</p><h5>Przesy\u0142anie danych</h5><p>Ca\u0142y ruch danych jest szyfrowany. Serwery do przechowywania danych s\u0105 w\u0142asno\u015Bci\u0105 frentix GmbH i znajduj\u0105 si\u0119 w Szwajcarii.</p><h5>Usuwanie lub wgl\u0105d w dane</h5><p>Wnioski o usuni\u0119cie lub wgl\u0105d w swoje dane prosimy przesy\u0142a\u0107 na adres datenschutz@frentix.com. Po usuni\u0119ciu dane pozostaj\u0105 w kopiach zapasowych przez kolejne trzy miesi\u0105ce, zanim zostan\u0105 trwale usuni\u0119te. Eksport danych nie daje wgl\u0105du w ocen\u0119 ani opini\u0119 dotycz\u0105c\u0105 Twojej kandydatury.</p><h5>Akceptacja</h5>
