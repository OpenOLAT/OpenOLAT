apps.feedback.acknowledge=Mam \u015Bwiadomo\u015B\u0107, \u017Ce udost\u0119pniam poufne dokumenty, i chc\u0119 kontynuowa\u0107.
apps.feedback.acknowledge.error=Musisz to potwierdzi\u0107.
apps.feedback.acknowledge.text=<p>Zamierzasz udost\u0119pni\u0107 poufne dokumenty {0} kandydatur(y) {1} cz\u0142onkom wydzia\u0142u, kt\u00F3rzy nie nale\u017C\u0105 do komisji rekrutacyjnej.</p><p>W zale\u017Cno\u015Bci od konfiguracji cz\u0142onkowie wydzia\u0142u mog\u0105 zobaczy\u0107 cz\u0119\u015B\u0107 lub wszystkie dane kandydatury oraz nast\u0119puj\u0105ce dokumenty\:</p><p>{2}</p><p>Poufne dokumenty mog\u0105 by\u0107 udost\u0119pniane tylko wtedy, gdy jest to konieczne i zosta\u0142o zatwierdzone przez komisj\u0119 rekrutacyjn\u0105.</p><p>Czy na pewno chcesz kontynuowa\u0107?</p>
