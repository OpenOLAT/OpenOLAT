edit.step.references.visibility.explain=Wybierz, kt\u00F3re elementy profilu kandydatury s\u0105 widoczne dla ekspert\u00F3w i os\u00F3b polecaj\u0105cych w ich procesie opiniowania. Domy\u015Blnie \u017Cadne dane kandydatury nie s\u0105 ujawniane. Wybierz "wszystkie", aby udost\u0119pni\u0107 wszystkie przes\u0142ane dane, lub "dostosuj", aby ujawni\u0107 tylko cz\u0119\u015Bci profilu kandydatury.
