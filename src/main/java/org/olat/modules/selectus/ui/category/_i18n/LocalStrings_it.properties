position.tags.description=Qui \u00E8 possibile attivare i tag di sistema e i tag specifici della posizione.<br>Se i tag di sistema sono attivati, qui viene visualizzato l'elenco dei tag di sistema disponibili. I tag di sistema possono essere modificati solo nell'amministrazione del sistema da una persona con diritti di amministrazione.<br>Se i tag di posizione sono attivati, qui possono essere aggiunti, modificati, eliminati o uniti. Si noti\: se esiste un tag con lo stesso nome a livello di sistema e di posizione, quando viene aggiunto a una candidatura viene utilizzato il rispettivo tag di posizione.
