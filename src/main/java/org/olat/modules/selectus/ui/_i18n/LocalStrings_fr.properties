reference.comparative.expert.mail.body=<p>$refereeDearTitleName,</p><p>je vous \u00E9cris au sujet de la proc\u00E9dure de nomination \u00E0 OpenOlat University pour le poste ouvert "$positionTitle".</p><p>La commission de nomination examine les candidatures suivantes pour ce poste \:<br>$applicantList</p><p>Comme vous \u00EAtes sp\u00E9cialiste de ce domaine, nous vous serions tr\u00E8s reconnaissants de bien vouloir nous aider dans l'\u00E9valuation et de r\u00E9diger ainsi une \u00E9valuation comparative de l'ad\u00E9quation de ces candidatures au poste ouvert. Nous nous r\u00E9jouissons de recevoir votre expertise dans les meilleurs d\u00E9lais, et au plus tard le $refereeDeadline.</p><p>Veuillez suivre le lien ci-dessous pour accepter notre demande, obtenir des informations sur les candidatures et sur le profil du poste, et t\u00E9l\u00E9verser votre expertise sous forme d'un seul fichier PDF. Si vous n'\u00EAtes pas disponible comme expert\u00B7e, nous vous prions de nous le faire savoir en suivant le m\u00EAme lien et en refusant la demande \:<br>$refereeUrl</p><p>Avec mes salutations les meilleures<br>$headFirstname $headLastname<br>Pr\u00E9sidence de la commission de nomination</p>
