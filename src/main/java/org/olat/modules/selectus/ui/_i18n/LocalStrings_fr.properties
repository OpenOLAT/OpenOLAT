apply_application.email.dr=Dr.
apply_application.email.duplicate=Madame, Monsieur {0}\n\nNous souhaitons vous informer que nous avons d\u00E9j\u00E0 re\u00E7u votre candidature pour le poste "{1}". Si vous avez des modifications \u00E0 apporter, veuillez contacter le secr\u00E9tariat (e-mail \: {2}).\n\nAvec nos salutations les meilleures\n\nLe secr\u00E9tariat
