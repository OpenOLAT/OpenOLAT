edit.steps.explain=<p>Cliquez sur "$\:edit.steps" pour activer ou d\u00E9sactiver les \u00E9tapes qui doivent appara\u00EEtre dans le processus de candidature.<br>Cliquez sur les diff\u00E9rentes \u00E9tapes pour personnaliser leur contenu et en afficher un aper\u00E7u. Les options de personnalisation varient selon les \u00E9tapes.</p><ul><li>Adaptez les textes d'instructions et d'aide visibles dans les diff\u00E9rentes \u00E9tapes du processus de candidature.</li><li>Ajoutez des questions personnalis\u00E9es aux \u00E9tapes "$\:edit.step.personal.data", "$\:edit.step.academical.background" et "$\:edit.step.project".</li><li>Choisissez \u00E0 l'\u00E9tape "$\:edit.step.documents" quels documents sont exig\u00E9s des candidat\u00B7es.</li><li>Configurez les options de retour \u00E0 l'\u00E9tape "$\:edit.step.review.and.submit".</li><li>Adaptez le texte de confirmation et l'e-mail que les candidat\u00B7es re\u00E7oivent apr\u00E8s la soumission de leur candidature \u00E0 l'\u00E9tape "$\:edit.step.confirmation".</li><li>Notez que les r\u00E9f\u00E9rent\u00B7es se configurent dans l'onglet "R\u00E9f\u00E9rent\u00B7e / expert\u00B7e" de la navigation principale du mode \u00E9dition.</li></ul>
