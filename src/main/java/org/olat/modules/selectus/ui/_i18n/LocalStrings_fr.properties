apply_application.acceptTerms=J'accepte que le comit\u00E9 de s\u00E9lection concern\u00E9 prenne toutes les mesures n\u00E9cessaires pour \u00E9valuer ma candidature. Cela peut \u00E9galement inclure la demande de lettres de recommandation aupr\u00E8s d'experts internes et/ou externes.
apply_application.acceptTerms.error=Avant de pouvoir t\u00E9l\u00E9charger votre candidature, vous devez accepter les dispositions relatives \u00E0 la protection des donn\u00E9es et aux r\u00E8gles d'\u00E9valuation.
apply_application.acceptTerms.lastStep=J'accepte que la commission de nomination comp\u00E9tente prenne toutes les mesures n\u00E9cessaires pour \u00E9valuer ma candidature. Cela peut inclure la demande de lettres de r\u00E9f\u00E9rence \u00E0 des expert\u00B7es internes et/ou externes.
apply_application.email=Cher Monsieur, Ch\u00E8re Madame {0}\n\nAu nom du pr\u00E9sident de la facult\u00E9, nous tenons \u00E0 vous remercier d'avoir postul\u00E9 au poste susmentionn\u00E9. Votre candidature sera port\u00E9e \u00E0 l'attention du comit\u00E9 charg\u00E9 de conseiller le pr\u00E9sident dans la s\u00E9lection des candidats.\n\nL'\u00E9valuation minutieuse des nombreuses candidatures prendra un certain temps. Nous vous r\u00E9pondrons d\u00E8s que possible.\n\nCordialement,\n\nBureau des affaires professorales
