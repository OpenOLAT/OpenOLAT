edit.form_description=Remplissez le formulaire ci-dessous pour cr\u00E9er un nouveau poste. Utilisez le statut du poste pour publier le poste ouvert ou laissez-le en pr\u00E9paration. Tous les champs peuvent \u00EAtre modifi\u00E9s ult\u00E9rieurement.
edit.form_description.apps.feedback=Choisissez si le personnel administratif peut solliciter un retour des membres de la facult\u00E9. Si oui, vous pouvez configurer les d\u00E9tails ci-dessous. Tous les champs peuvent \u00EAtre modifi\u00E9s ult\u00E9rieurement.<br>Les membres de la facult\u00E9 ont besoin d'un login pour donner un retour. Vous pouvez configurer la visibilit\u00E9 des documents de candidature pour les membres de la facult\u00E9 dans l'onglet "$\:edit.step.references.visibility".
edit.form_description.comparative.experts=Choisissez si le personnel administratif peut ajouter des expert\u00B7es pour une \u00E9valuation comparative de plusieurs candidatures et, si oui, configurez les d\u00E9tails ci-dessous. Un\u00B7e tel\u00B7le expert\u00B7e obtient acc\u00E8s \u00E0 un ensemble de candidatures et peut t\u00E9l\u00E9verser un seul fichier contenant une \u00E9valuation comparative de ces candidatures.<br>Apr\u00E8s activation, vous pouvez configurer dans l'onglet "$\:edit.step.references.visibility" quels \u00E9l\u00E9ments des candidatures sont visibles pour ces personnes.
edit.form_description.configuration=Configurez le poste ci-dessous en choisissant les options pertinentes pour ce poste. Tous les champs peuvent \u00EAtre modifi\u00E9s ult\u00E9rieurement.
edit.form_description.decision=Activez ou d\u00E9sactivez l'outil de d\u00E9cision, qui peut \u00EAtre utilis\u00E9 pendant une s\u00E9ance de la commission. Les rubriques de d\u00E9cision peuvent \u00EAtre cr\u00E9\u00E9es directement dans l'outil.
edit.form_description.document=Choisissez dans la liste ci-dessous quels documents vous exigez pour le poste. Cliquez sur "Modifier" pour ajuster les d\u00E9tails d'un document.
edit.form_description.experts=Choisissez si le personnel administratif peut ajouter des expert\u00B7es et, si oui, configurez les d\u00E9tails ci-dessous. Un\u00B7e expert\u00B7e obtient acc\u00E8s \u00E0 une seule candidature et peut t\u00E9l\u00E9verser un fichier contenant une expertise de cette candidature.<br>Apr\u00E8s activation, vous pouvez configurer dans l'onglet "$\:edit.step.references.visibility" quels \u00E9l\u00E9ments des candidatures sont visibles pour ces personnes.
edit.form_description.public.feedback=Choisissez si les candidatures disposent d'un lien de retour public. Si oui, vous pouvez saisir le d\u00E9lai de soumission ci-dessous. Tous les champs peuvent \u00EAtre modifi\u00E9s ult\u00E9rieurement. Si les liens de retour public sont activ\u00E9s, ils peuvent \u00EAtre copi\u00E9s pour \u00EAtre partag\u00E9s (un lien par candidature). Les liens ne sont accessibles qu'avec un login. Pour les personnes qui ouvrent le lien, seul le nom de la personne candidate est visible.
edit.form_description.referees=Choisissez si le personnel administratif peut ajouter des expert\u00B7es et si les candidat\u00B7es peuvent indiquer des r\u00E9f\u00E9rent\u00B7es. Si oui, vous pouvez configurer les d\u00E9tails ci-dessous. Tous les champs peuvent \u00EAtre modifi\u00E9s ult\u00E9rieurement.
edit.form_description.referees.management=Choisissez si les candidat\u00B7es peuvent indiquer et g\u00E9rer leurs r\u00E9f\u00E9rent\u00B7es et, si oui, configurez les d\u00E9tails ci-dessous.<br>Notez que si les candidat\u00B7es peuvent g\u00E9rer leurs r\u00E9f\u00E9rent\u00B7es, l'e-mail aux r\u00E9f\u00E9rent\u00B7es est toujours envoy\u00E9 imm\u00E9diatement apr\u00E8s la soumission de la candidature.<br>Apr\u00E8s activation, vous pouvez configurer dans l'onglet "$\:edit.step.references.visibility" quels \u00E9l\u00E9ments des candidatures sont visibles pour les r\u00E9f\u00E9rent\u00B7es.
edit.form_description.status=D\u00E9finissez les d\u00E9lais indiqu\u00E9s et configurez si les membres de la commission qui n'ont pas encore donn\u00E9 d'appr\u00E9ciation doivent recevoir un rappel automatique par e-mail. Utilisez le statut du poste pour publier le poste ouvert ou laissez-le en pr\u00E9paration. Tous les champs peuvent \u00EAtre modifi\u00E9s ult\u00E9rieurement.
