edit.rating.policy.points.confidentiality=Nous vous prions de traiter toutes les informations et tous les documents de mani\u00E8re strictement confidentielle. Tous les documents et informations orales concernant les candidatures, que la commission de nomination obtient au cours de la pr\u00E9paration de la proc\u00E9dure, sont soumis \u00E0 la confidentialit\u00E9.<br/>Les documents sont destin\u00E9s exclusivement aux membres de la commission de nomination. Les documents ne doivent \u00EAtre ni copi\u00E9s ni rendus accessibles de quelque mani\u00E8re que ce soit \u00E0 des tiers. Tout document t\u00E9l\u00E9charg\u00E9 ou imprim\u00E9 doit \u00EAtre supprim\u00E9 ou d\u00E9truit apr\u00E8s la cl\u00F4ture de la proc\u00E9dure.<br/>Vos appr\u00E9ciations dans l'outil sont anonymis\u00E9es pour le personnel administratif, la pr\u00E9sidence de la commission et les autres membres.<br/>Vos commentaires sont personnels. Le personnel administratif, la pr\u00E9sidence de la commission et les autres membres n'y ont pas acc\u00E8s. Apr\u00E8s la cl\u00F4ture de l'ensemble de la proc\u00E9dure, toutes les donn\u00E9es concern\u00E9es seront supprim\u00E9es du serveur.
edit.rating.policy.points.confidentiality.title=Confidentialit\u00E9 \:
edit.rating.policy.points.focus=L'accent est mis avant tout sur l'excellence en recherche et en enseignement. Une ad\u00E9quation parfaite au profil est consid\u00E9r\u00E9e comme secondaire.
edit.rating.policy.points.focus.title=Priorit\u00E9 \u00E0 l'excellence \:
edit.rating.policy.points.introduction=Il est d'usage que des scientifiques qualifi\u00E9s qui n'ont pas postul\u00E9 et ne figurent donc pas sur la liste des candidatures puissent \u00EAtre propos\u00E9s \u00E0 tout stade de la proc\u00E9dure. Nous encourageons vivement tous les membres de la commission de nomination \u00E0 penser \u00E0 d'\u00E9ventuelles candidatures de premier plan et \u00E0 apporter leur curriculum vitae et leur liste de publications aux s\u00E9ances ou \u00E0 nous les envoyer \u00E0 l'avance, afin que nous puissions les transmettre au pr\u00E9alable \u00E0 tous les membres de la commission.
edit.rating.policy.points.introduction.title=Proposition de candidatures potentielles \:
edit.rating.policy.points.women=Afin d'augmenter le nombre de femmes dans les positions acad\u00E9miques dirigeantes, la facult\u00E9 pr\u00E9f\u00E8re les candidatures f\u00E9minines aux candidatures masculines \u00E0 qualifications scientifiques et p\u00E9dagogiques comparables.
