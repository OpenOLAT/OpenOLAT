edit.rating.policy.points.confidentiality=La preghiamo di trattare tutte le informazioni e tutti i documenti in modo strettamente confidenziale. Tutti i documenti e le informazioni orali sulle candidature che la commissione di nomina riceve durante la preparazione della procedura sono soggetti a riservatezza.<br/>I documenti sono destinati esclusivamente ai membri della commissione di nomina. I documenti non possono essere copiati n\u00E9 resi accessibili a terzi in altro modo. I documenti scaricati e le stampe devono essere cancellati o distrutti al termine della procedura.<br/>I Suoi giudizi nello strumento sono anonimizzati per la segreteria, la presidenza della commissione e gli altri membri della commissione.<br/>I Suoi commenti sono personali. La segreteria, la presidenza della commissione e gli altri membri della commissione non vi hanno accesso. Al termine dell'intera procedura tutti i dati rilevanti vengono cancellati dal server.
edit.rating.policy.points.confidentiality.title=Riservatezza\:
edit.rating.policy.points.focus=Al centro c'\u00E8 l'eccellenza nella ricerca e nella didattica. Una corrispondenza perfetta con il profilo \u00E8 secondaria.
edit.rating.policy.points.focus.title=Focus sull'eccellenza\:
edit.rating.policy.points.introduction=\u00C8 consuetudine che scienziate e scienziati qualificati che non si sono candidati e che quindi non figurano nell'elenco delle candidature possano essere proposti in ogni fase della procedura. Invitiamo espressamente tutti i membri della commissione di nomina a pensare a possibili candidature di primo piano e a portare alle riunioni il loro curriculum vitae e l'elenco delle pubblicazioni oppure a inviarceli in anticipo, affinch\u00E9 possiamo trasmetterli preventivamente a tutti i membri della commissione.
edit.rating.policy.points.introduction.title=Proposta di possibili candidature\:
edit.rating.policy.points.women=Per aumentare il numero di donne nelle posizioni accademiche dirigenziali, a parit\u00E0 di qualifiche scientifiche e didattiche la facolt\u00E0 preferisce le candidature femminili a quelle maschili.
