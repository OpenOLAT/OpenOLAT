edit.step.references.visibility.explain=Selezioni quali elementi del profilo di candidatura sono visibili a esperti e referenti nel loro processo di giudizio. Per impostazione predefinita non viene divulgato nessun dato della candidatura. Selezioni "tutti" per rendere disponibili tutti i dati presentati, oppure "personalizzare" per divulgare solo parti del profilo di candidatura.
