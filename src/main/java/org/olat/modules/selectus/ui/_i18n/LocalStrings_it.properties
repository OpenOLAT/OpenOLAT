edit.steps.explain=<p>Clicchi su "$\:edit.steps" per attivare o disattivare i passi che devono apparire nel processo di candidatura.<br>Clicchi sui singoli passi per adattarne il contenuto e visualizzare un'anteprima. Le possibilit\u00E0 di adattamento variano a seconda del passo.</p><ul><li>Adatti i testi di istruzione e di aiuto visibili nei diversi passi del processo di candidatura.</li><li>Aggiunga domande proprie ai passi "$\:edit.step.personal.data", "$\:edit.step.academical.background" e "$\:edit.step.project".</li><li>Selezioni nel passo "$\:edit.step.documents" quali documenti sono richiesti alle persone candidate.</li><li>Configuri le opzioni di feedback nel passo "$\:edit.step.review.and.submit".</li><li>Adatti nel passo "$\:edit.step.confirmation" il testo di conferma e l'e-mail che le persone candidate ricevono dopo la presentazione della loro candidatura.</li><li>Noti che i referenti si configurano nella scheda "Referente / esperto" nella navigazione principale della modalit\u00E0 di modifica.</li></ul>
