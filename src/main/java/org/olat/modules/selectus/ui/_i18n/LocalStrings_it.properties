apply_application.email.referee.mgmt=<p>Conferma di ricezione generata automaticamente</p><p>$applicantDearTitleName</p><p>La ringraziamo per la Sua candidatura a "$positionTitle". La Sua documentazione sar\u00E0 trasmessa alla commissione di nomina competente.</p><p>Come parte della Sua candidatura, la commissione necessita di lettere di raccomandazione. La preghiamo di seguire il link qui sotto per accedere al Faculty Recruiting Tool e seguire lo stato delle Sue referenze. Pu\u00F2 indicare altri referenti se questi rifiutano la richiesta di una lettera di referenza. Le lettere di referenza presentate sono confidenziali e non sono consultabili da parte Sua.<br>$applicantURL</p><p>Il giudizio delle candidature richieder\u00E0 del tempo. Non appena la commissione avr\u00E0 preso una decisione, La informeremo.</p><p>Cordiali saluti</p>
