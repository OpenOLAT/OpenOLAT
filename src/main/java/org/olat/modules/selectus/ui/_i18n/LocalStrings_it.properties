reference.comparative.expert.mail.body=<p>$refereeDearTitleName,</p><p>mi rivolgo a Lei in merito alla procedura di nomina presso OpenOlat University per la posizione aperta "$positionTitle".</p><p>La commissione di nomina prende in considerazione per questa posizione le candidature seguenti\:<br>$applicantList</p><p>Poich\u00E9 dispone di competenze particolari in questo campo, Le saremmo molto grati se ci sostenesse nel giudizio e redigesse un parere comparativo sull'idoneit\u00E0 di queste candidature per la posizione aperta. Ci auguriamo di ricevere il Suo parere il prima possibile, al pi\u00F9 tardi entro il $refereeDeadline.</p><p>La preghiamo di seguire il link qui sotto per accettare la nostra richiesta, ottenere informazioni sulle candidature e sul profilo della posizione e caricare il Suo parere come un unico file PDF. Se non fosse disponibile come esperto, La preghiamo di comunicarcelo tramite lo stesso link e di rifiutare la richiesta\:<br>$refereeUrl</p><p>Cordiali saluti<br>$headFirstname $headLastname<br>Presidenza della commissione di nomina</p>
