edit.form_description=Compili il modulo sottostante per creare una nuova posizione. Con lo stato della posizione pubblica il posto vacante oppure lo lascia nello stato "In preparazione". Tutti i campi possono essere modificati in un secondo momento.
edit.form_description.apps.feedback=Selezioni se la segreteria pu\u00F2 richiedere un feedback ai membri della facolt\u00E0. In tal caso pu\u00F2 configurare i dettagli qui sotto. Tutti i campi possono essere modificati in un secondo momento.<br>I membri della facolt\u00E0 hanno bisogno di un login per dare un feedback. La visibilit\u00E0 dei documenti di candidatura per i membri della facolt\u00E0 si configura nella scheda "$\:edit.step.references.visibility".
edit.form_description.comparative.experts=Selezioni se la segreteria pu\u00F2 aggiungere esperti per un parere comparativo su pi\u00F9 candidature e, in tal caso, configuri i dettagli qui sotto. Una persona di questo tipo ottiene l'accesso a pi\u00F9 candidature e pu\u00F2 caricare un unico file con un parere comparativo di queste candidature.<br>Dopo l'attivazione pu\u00F2 configurare nella scheda "$\:edit.step.references.visibility" quali elementi delle candidature sono visibili a queste persone.
edit.form_description.configuration=Configuri la posizione qui sotto scegliendo le opzioni rilevanti per questa posizione. Tutti i campi possono essere modificati in un secondo momento.
edit.form_description.decision=Attivi o disattivi lo strumento di decisione, che pu\u00F2 essere utilizzato durante una riunione della commissione. Le rubriche di decisione possono essere create direttamente nello strumento.
edit.form_description.document=Selezioni dall'elenco sottostante quali documenti richiede per la posizione. Clicchi su "Modificare" per adattare altri dettagli di un documento.
edit.form_description.experts=Selezioni se la segreteria pu\u00F2 aggiungere esperti e, in tal caso, configuri i dettagli qui sotto. Un esperto ottiene l'accesso a una singola candidatura e pu\u00F2 caricare un file con un parere su questa candidatura.<br>Dopo l'attivazione pu\u00F2 configurare nella scheda "$\:edit.step.references.visibility" quali elementi delle candidature sono visibili a queste persone.
edit.form_description.public.feedback=Selezioni se le candidature dispongono di un link per riscontri pubblici. In tal caso pu\u00F2 indicare qui sotto il termine di presentazione. Tutti i campi possono essere modificati in un secondo momento. Se i link sono attivati, possono essere copiati per essere condivisi (un link per candidatura). I link sono accessibili solo con login. Per le persone che aprono il link \u00E8 visibile solo il nome della candidatura.
edit.form_description.referees=Selezioni se la segreteria pu\u00F2 aggiungere esperti e se le persone candidate possono indicare referenti. In tal caso pu\u00F2 configurare i dettagli qui sotto. Tutti i campi possono essere modificati in un secondo momento.
edit.form_description.referees.management=Selezioni se le persone candidate possono indicare e gestire i referenti e, in tal caso, configuri i dettagli qui sotto.<br>Attenzione\: se le persone candidate possono gestire i referenti, l'e-mail ai referenti viene sempre inviata immediatamente dopo la presentazione della candidatura.<br>Dopo l'attivazione pu\u00F2 configurare nella scheda "$\:edit.step.references.visibility" quali elementi delle candidature sono visibili ai referenti.
edit.form_description.status=Definisca i termini indicati e configuri se i membri della commissione senza giudizio devono ricevere automaticamente un promemoria per e-mail. Con lo stato della posizione pubblica il posto vacante oppure lo lascia nello stato "In preparazione". Tutti i campi possono essere modificati in un secondo momento.
