rejection.mail.-.subject=Riservato - {0}
rejection.mail.body=<p>Gentile $nameAndTitle</p><p>mi rivolgo a Lei in merito alla Sua candidatura per la posizione sopra indicata.</p><p>La commissione di nomina che mi assiste in questa procedura ha esaminato attentamente le candidature. Dopo un'ampia discussione i membri hanno raccomandato di prendere in considerazione altre candidature per la procedura di selezione. Ho deciso di seguire questa raccomandazione e mi dispiace doverLe comunicare che la Sua candidatura non sar\u00E0 quindi presa ulteriormente in considerazione.</p><p>La ringrazio molto per il tempo che ha dedicato alla Sua candidatura e Le auguro ogni bene per il Suo percorso professionale.</p><p>Cordiali saluti<br>$headFirstname $headLastname<br>Presidenza della commissione</p>
rejection.mail.bonhold.body=<p>$dearTitleAndName</p><p>Ha presentato la Sua candidatura per "{0}". La ringraziamo per l'interesse dimostrato per un'attivit\u00E0 presso l'Universit\u00E0 OpenOlat. </p><p>Purtroppo devo comunicarLe che la commissione di nomina competente, dopo un attento esame della Sua candidatura, ha deciso di non includerla nella rosa ristretta per la posizione messa a concorso. Con il Suo consenso, la commissione desidera tuttavia mantenere in sospeso la Sua candidatura. I documenti di candidatura inviati elettronicamente saranno eliminati solo dopo la conclusione definitiva della procedura di nomina e Le daremo nuovamente comunicazione.</p><p>Cordiali saluti<br>Prof. Dr. {2}<br>Presidenza della commissione di nomina<br>Universit\u00E0 OpenOlat</p>
rejection.mail.bonhold.subject=La Sua candidatura all'Universit\u00E0 OpenOlat
rejection.mail.crejection.body=<p>$dearTitleAndName</p><p>Ha presentato la Sua candidatura per "{0}". La ringraziamo per l'interesse dimostrato per un'attivit\u00E0 presso l'Universit\u00E0 OpenOlat.</p><p>Purtroppo devo comunicarLe che la commissione di nomina competente ha deciso di non tenere pi\u00F9 in considerazione la Sua candidatura nel prosieguo della procedura.</p><p>I Suoi documenti di candidatura elettronici saranno eliminati per motivi di protezione dei dati.</p><p>A nome della commissione Le auguro molto successo e ogni bene per la Sua carriera scientifica.</p><p>Cordiali saluti<br>Prof. Dr. {2}<br>Presidenza della commissione di nomina\nUniversit\u00E0 OpenOlat</p>
