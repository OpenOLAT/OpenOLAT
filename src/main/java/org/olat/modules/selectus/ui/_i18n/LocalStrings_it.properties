disclaimer.privacy.accept=<strong>Ho preso conoscenza delle disposizioni sulla protezione dei dati e acconsento alla memorizzazione e al trattamento dei miei dati.</strong>
disclaimer.privacy.ok=Accettare
disclaimer.privacy.text=<h5>Raccolta dei dati</h5><p>Con l'utilizzo di Selectus vengono memorizzati dei dati. Per motivi di tracciabilit\u00E0 questo vale anche quando il processo viene interrotto.</p><p>Vengono raccolti dati personali come nome, e-mail e indirizzo. I dati e i documenti presentati sono visibili alla commissione giudicante e, se del caso, anche a esperti e periti. Inoltre vengono registrati dati online come indirizzo IP, posizione, versione del browser e data e ora di accesso. Questi dati vengono memorizzati in file di log a scopo di tracciabilit\u00E0.</p><p>Al termine di una procedura i dati vengono conservati per altri due anni e poi eliminati definitivamente.</p><h5>Trasferimento dei dati</h5><p>Tutto il traffico di dati \u00E8 cifrato. I server per la memorizzazione dei dati sono di propriet\u00E0 di frentix GmbH e si trovano in Svizzera.</p><h5>Eliminare o consultare i dati</h5><p>Le richieste di eliminazione o di consultazione dei propri dati vanno inviate a datenschutz@frentix.com. Dopo l'eliminazione i dati restano nei backup per altri tre mesi, prima di essere eliminati definitivamente. Le esportazioni di dati non danno accesso alla valutazione o al giudizio della propria candidatura.</p><h5>Accettare</h5>
disclaimer.privacy.title=Informativa sulla privacy
