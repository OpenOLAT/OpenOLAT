referee.submission.notification.body=<p>$refereeDearTitleName,</p><p>V\u00E1\u0161 odpor\u00FA\u010Dac\u00ED list pre $applicantTitleFirstLastName k pracovnej poz\u00EDcii "$positionTitle" na OpenOlat University bol \u00FAspe\u0161ne odoslan\u00FD.</p><p>\u010Eakujeme v\u00E1m za cenn\u00FA pomoc\!</p><p>S pozdravom<br>$\!headFirstname $\!headLastname<br>Predsedn\u00EDctvo v\u00FDberovej komisie</p>
