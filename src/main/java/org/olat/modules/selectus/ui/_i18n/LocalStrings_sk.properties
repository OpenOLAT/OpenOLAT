edit.step.references.visibility.explain=Vyberte, ktor\u00E9 prvky profilu prihl\u00E1\u0161ky s\u00FA vidite\u013En\u00E9 pre posudzovate\u013Eov a referen\u010Dn\u00E9 osoby v ich procese posudzovania. \u0160tandardne sa nespr\u00EDstup\u0148uj\u00FA \u017Eiadne \u00FAdaje prihl\u00E1\u0161ky. Vyberte "v\u0161etko", aby ste spr\u00EDstupnili v\u0161etky odoslan\u00E9 \u00FAdaje, alebo "prisp\u00F4sobi\u0165", aby ste spr\u00EDstupnili iba \u010Dasti profilu prihl\u00E1\u0161ky.
