edit.rating.policy.points.confidentiality=Pros\u00EDme v\u00E1s, aby ste v\u0161etky inform\u00E1cie a dokumenty pova\u017Eovali za pr\u00EDsne d\u00F4vern\u00E9. V\u0161etky dokumenty a \u00FAstne inform\u00E1cie o kandidat\u00FArach, ktor\u00E9 v\u00FDberov\u00E1 komisia dostane po\u010Das pr\u00EDpravy konania, podliehaj\u00FA d\u00F4vernosti.<br/>Dokumenty s\u00FA ur\u010Den\u00E9 v\u00FDhradne \u010Dlenom v\u00FDberovej komisie. Dokumenty sa nesm\u00FA kop\u00EDrova\u0165 ani inak spr\u00EDstup\u0148ova\u0165 tret\u00EDm osob\u00E1m. Stiahnut\u00E9 dokumenty a v\u00FDtla\u010Dky je potrebn\u00E9 po skon\u010Den\u00ED konania vymaza\u0165, respekt\u00EDve zni\u010Di\u0165.<br/>Va\u0161e hodnotenia v n\u00E1stroji s\u00FA pre administrat\u00EDvnych pracovn\u00EDkov, predsedn\u00EDctvo komisie a ostatn\u00FDch \u010Dlenov komisie anonymizovan\u00E9.<br/>Va\u0161e koment\u00E1re s\u00FA osobn\u00E9. Administrat\u00EDvni pracovn\u00EDci, predsedn\u00EDctvo komisie ani ostatn\u00ED \u010Dlenovia komisie k nim nemaj\u00FA pr\u00EDstup. Po skon\u010Den\u00ED cel\u00E9ho konania sa v\u0161etky relevantn\u00E9 \u00FAdaje zo servera vyma\u017E\u00FA.
