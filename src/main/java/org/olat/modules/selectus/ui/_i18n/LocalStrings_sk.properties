refereedashboard.new.password=Skontrolujte si e-maily. Dostali ste e-mail s \u00FAdajmi o svojom pou\u017E\u00EDvate\u013Eskom mene a hesle.
refereedashboard.new.password.body=<p>{1},</p><p>Na prihl\u00E1senie do n\u00E1stroja pre v\u00FDberov\u00E9 konanie potrebujete pou\u017E\u00EDvate\u013Esk\u00E9 meno a heslo.</p><p>Pou\u017E\u00EDvate\u013Esk\u00E9 meno zodpoved\u00E1 kontaktnej e-mailovej adrese, ktor\u00FA ste uviedli vo svojej prihl\u00E1\u0161ke.</p><p>Va\u0161e heslo\: {2}</p><p>Toto heslo si uschovajte na \u010Fal\u0161ie pou\u017Eitie.</p>
