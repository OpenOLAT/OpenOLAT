rejection.mail.body=<p>V\u00E1\u017Een\u00E1 pani, v\u00E1\u017Een\u00FD p\u00E1n $nameAndTitle</p><p>obraciam sa na v\u00E1s v s\u00FAvislosti s va\u0161ou prihl\u00E1\u0161kou na uveden\u00FA poz\u00EDciu.</p><p>V\u00FDberov\u00E1 komisia, ktor\u00E1 ma v tejto veci poradensky sprev\u00E1dza, medzit\u00FDm prihl\u00E1\u0161ky starostlivo pos\u00FAdila. Po podrobnej diskusii jej \u010Dlenovia odporu\u010Dili zv\u00E1\u017Ei\u0165 pre v\u00FDberov\u00E9 konanie in\u00E9 kandidat\u00FAry. Rozhodol som sa toto odpor\u00FA\u010Danie prija\u0165 a s \u013E\u00FAtos\u0165ou v\u00E1m oznamujem, \u017Ee va\u0161a kandidat\u00FAra sa preto \u010Falej nezoh\u013Eadn\u00ED.</p><p>Ve\u013Emi v\u00E1m \u010Fakujem za \u010Das, ktor\u00FD ste svojej prihl\u00E1\u0161ke venovali, a prajem v\u00E1m ve\u013Ea \u00FAspechov v \u010Fal\u0161ej profesijnej dr\u00E1he.</p><p>S pozdravom<br>$headFirstname $headLastname<br>Predsedn\u00EDctvo komisie</p>
rejection.mail.bonhold.body=<p>$dearTitleAndName</p><p>Prihl\u00E1sili ste sa na "{0}". \u010Eakujeme v\u00E1m za z\u00E1ujem o p\u00F4sobenie na Univerzite OpenOlat. </p><p>S \u013E\u00FAtos\u0165ou v\u00E1m mus\u00EDm ozn\u00E1mi\u0165, \u017Ee pr\u00EDslu\u0161n\u00E1 v\u00FDberov\u00E1 komisia sa po d\u00F4kladnom pos\u00FAden\u00ED va\u0161ej prihl\u00E1\u0161ky rozhodla nezaradi\u0165 va\u0161u prihl\u00E1\u0161ku do u\u017E\u0161ieho v\u00FDberu na vyp\u00EDsan\u00E9 miesto. Ak budete s\u00FAhlasi\u0165, komisia by v\u0161ak va\u0161u prihl\u00E1\u0161ku chcela ponecha\u0165 otvoren\u00FA. Va\u0161e elektronicky odoslan\u00E9 podklady k prihl\u00E1\u0161ke by sa vymazali a\u017E po definit\u00EDvnom skon\u010Den\u00ED v\u00FDberov\u00E9ho konania, o \u010Dom v\u00E1s znova budeme informova\u0165.</p><p>S pozdravom<br>Prof. Dr. {2}<br>Predsedn\u00EDctvo v\u00FDberovej komisie<br>Univerzita OpenOlat</p>
rejection.mail.bonhold.subject=Va\u0161a prihl\u00E1\u0161ka na Univerzitu OpenOlat
rejection.mail.crejection.body=<p>$dearTitleAndName</p><p>Prihl\u00E1sili ste sa na "{0}". \u010Eakujeme v\u00E1m za z\u00E1ujem o p\u00F4sobenie na Univerzite OpenOlat.</p><p>S \u013E\u00FAtos\u0165ou v\u00E1m mus\u00EDm ozn\u00E1mi\u0165, \u017Ee pr\u00EDslu\u0161n\u00E1 v\u00FDberov\u00E1 komisia sa rozhodla va\u0161u prihl\u00E1\u0161ku v \u010Fal\u0161om konan\u00ED u\u017E nezoh\u013Ead\u0148ova\u0165.</p><p>Va\u0161e elektronick\u00E9 podklady k prihl\u00E1\u0161ke sa z d\u00F4vodu ochrany osobn\u00FDch \u00FAdajov vyma\u017E\u00FA.</p><p>V mene komisie v\u00E1m prajem ve\u013Ea \u00FAspechov a v\u0161etko dobr\u00E9 vo va\u0161ej vedeckej dr\u00E1he.</p><p>S pozdravom<br>Prof. Dr. {2}<br>Predsedn\u00EDctvo v\u00FDberovej komisie\nUniverzita OpenOlat</p>
