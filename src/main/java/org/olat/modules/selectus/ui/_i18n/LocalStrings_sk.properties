edit.steps.explain=<p>Kliknut\u00EDm na \u201E$\:edit.steps\u201C m\u00F4\u017Eete povoli\u0165 alebo zak\u00E1za\u0165 jednotliv\u00E9 kroky procesu pod\u00E1vania \u017Eiadosti.<br>Kliknut\u00EDm na jednotliv\u00E9 kroky si m\u00F4\u017Eete prisp\u00F4sobi\u0165 ich obsah a zobrazi\u0165 uk\u00E1\u017Eku. Mo\u017Enosti prisp\u00F4sobenia sa l\u00ED\u0161ia v z\u00E1vislosti od konkr\u00E9tneho kroku.</p><ul><li>Prisp\u00F4sobte si pokyny a pomocn\u00E9 texty, ktor\u00E9 sa zobrazuj\u00FA po\u010Das jednotliv\u00FDch krokov procesu pod\u00E1vania \u017Eiadosti.</li><li>Pridajte vlastn\u00E9 ot\u00E1zky do krokov \u201E$\:edit.step.personal.data\u201C, \u201E$\:edit.step.academical.background\u201C a \u201E$\:edit.step.project\u201C.</li><li>Vyberte, ktor\u00E9 dokumenty sa od uch\u00E1dza\u010Dov vy\u017Eaduj\u00FA v kroku \u201E$\:edit.step.documents\u201C.</li><li>Nastavte mo\u017Enosti sp\u00E4tnej v\u00E4zby v kroku \u201E$\:edit.step.review.and.submit\u201C.</li><li>Prisp\u00F4sobte si text potvrdenia a e-mail, ktor\u00E9 uch\u00E1dza\u010Di dostan\u00FA po odoslan\u00ED \u017Eiadosti, v kroku \u201E$\:edit.step.confirmation\u201C.</li><li>Upozor\u0148ujeme, \u017Ee referencie a osoby poskytuj\u00FAce referencie sa nastavuj\u00FA na karte \u201EReference / Referee\u201C v hlavnej navig\u00E1cii re\u017Eimu \u00FAprav.</li></ul>\r\n Porovn\u00E1vac\u00ED jazyk\: \r\nAngli\u010Dtina (en)\r\n \r\n Aktivova\u0165
