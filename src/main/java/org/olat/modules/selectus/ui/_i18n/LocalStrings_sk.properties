confirm.delete=Naozaj chcete vymaza\u0165 t\u00FAto pracovn\u00FA poz\u00EDciu\: "{0}"?
confirm.delete.anonymous=Vybran\u00E1 pracovn\u00E1 poz\u00EDcia "{0}", v\u0161etky jej dokumenty a v\u0161etky \u00FAdaje, ktor\u00E9 umo\u017E\u0148uj\u00FA identifikova\u0165 osoby (uch\u00E1dza\u010Di, \u010Dlenovia komisie, referen\u010Dn\u00E9 osoby, posudzovatelia at\u010F.), bud\u00FA nen\u00E1vratne vymazan\u00E9. Pre \u0161tatistick\u00E9 reportovanie zostan\u00FA zachovan\u00E9 iba ur\u010Dit\u00E9 anonymizovan\u00E9 \u00FAdaje. Pracovn\u00E1 poz\u00EDcia z\u00EDska stav "Reportovanie", \u010Do je mo\u017En\u00E9 zru\u0161i\u0165 iba \u00FApln\u00FDm vymazan\u00EDm pracovnej poz\u00EDcie.
confirm.delete.anonymous.2=Pred pokra\u010Dovan\u00EDm <strong>skontrolujte a dopl\u0148te nasleduj\u00FAce dodato\u010Dn\u00E9 \u00FAdaje o pracovnej poz\u00EDcii</strong>, ktor\u00E9 s\u00FA potrebn\u00E9 pre reportovanie. \u00DAdaje m\u00F4\u017Eete doplni\u0165 aj nesk\u00F4r, <strong>potom v\u0161ak u\u017E nebudete ma\u0165 pr\u00EDstup k \u017Eiadnym in\u00FDm \u00FAdajom a nebudete ich m\u00F4c\u0165 meni\u0165.</strong>
confirm.delete.anonymous.option.1=Pracovn\u00E1 poz\u00EDcia bude nen\u00E1vratne vymazan\u00E1, zachovan\u00E9 zostan\u00FA iba ur\u010Dit\u00E9 anonymizovan\u00E9 \u00FAdaje. Tento \u00FAkon nie je mo\u017En\u00E9 vr\u00E1ti\u0165 sp\u00E4\u0165.
confirm.delete.anonymous.option.2=K anonymizovan\u00FDm \u00FAdajom uchovan\u00FDm pre \u0161tatistiku a reportovanie u\u017E nie je mo\u017En\u00E9 priamo pristupova\u0165, nie je mo\u017En\u00E9 ich meni\u0165 ani dop\u013A\u0148a\u0165. Nesk\u00F4r je mo\u017En\u00E9 meni\u0165 alebo dop\u013A\u0148a\u0165 iba polia pracovnej poz\u00EDcie zobrazen\u00E9 vy\u0161\u0161ie.
confirm.delete.anonymous.title=Vymaza\u0165 a zachova\u0165 anonymizovan\u00E9 \u00FAdaje
