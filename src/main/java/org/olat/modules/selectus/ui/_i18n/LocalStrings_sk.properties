apps.feedback.acknowledge.text=<p>Chyst\u00E1te sa zdie\u013Ea\u0165 d\u00F4vern\u00E9 podklady {0} prihl\u00E1\u0161ok s {1} \u010Dlenmi fakulty, ktor\u00ED nie s\u00FA \u010Dlenmi v\u00FDberovej komisie.</p><p>V z\u00E1vislosti od konfigur\u00E1cie m\u00F4\u017Eu \u010Dlenovia fakulty vidie\u0165 \u010Das\u0165 alebo v\u0161etky \u00FAdaje prihl\u00E1\u0161ky, ako aj tieto dokumenty\:</p><p>{2}</p><p>D\u00F4vern\u00E9 podklady sa sm\u00FA zdie\u013Ea\u0165 iba vtedy, ak je to nevyhnutn\u00E9 a ak to schv\u00E1lila v\u00FDberov\u00E1 komisia.</p><p>Naozaj chcete pokra\u010Dova\u0165?</p>
