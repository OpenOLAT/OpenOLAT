edit.rating.policy.points.focus=V centre pozornosti je excelentnos\u0165 vo v\u00FDskume a v\u00FDu\u010Dbe. Dokonal\u00E1 zhoda s profilom je druhorad\u00E1.
edit.rating.policy.points.focus.title=Zameranie na excelentnos\u0165\:
edit.rating.policy.points.introduction=Je be\u017En\u00E9, \u017Ee kvalifikovan\u00E9 vedkyne a vedci, ktor\u00ED sa neprihl\u00E1sili, a preto nie s\u00FA na zozname prihl\u00E1\u0161ok, m\u00F4\u017Eu by\u0165 navrhnut\u00ED v ktorejko\u013Evek f\u00E1ze konania. V\u00FDslovne povzbudzujeme v\u0161etk\u00FDch \u010Dlenov v\u00FDberovej komisie, aby mysleli na mo\u017En\u00E9 \u0161pi\u010Dkov\u00E9 kandidat\u00FAry a ich \u017Eivotopis a zoznam publik\u00E1ci\u00ED bu\u010F priniesli na zasadnutia, alebo n\u00E1m ich poslali vopred, aby sme ich mohli v\u0161etk\u00FDm \u010Dlenom komisie post\u00FApi\u0165 v predstihu.
