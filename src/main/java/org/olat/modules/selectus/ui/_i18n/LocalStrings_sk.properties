edit.filter=Filter\:
edit.form_description=Vypl\u0148te formul\u00E1r ni\u017E\u0161ie a vytvorte nov\u00FA pracovn\u00FA poz\u00EDciu. Pomocou stavu pracovnej poz\u00EDcie vo\u013En\u00E9 miesto zverejn\u00EDte alebo ho ponech\u00E1te v stave "V pr\u00EDprave". V\u0161etky polia je mo\u017En\u00E9 zmeni\u0165 nesk\u00F4r.
edit.form_description.apps.feedback=Vyberte, \u010Di administrat\u00EDvny pracovn\u00EDk m\u00F4\u017Ee vy\u017Eiada\u0165 sp\u00E4tn\u00FA v\u00E4zbu od \u010Dlenov fakulty. Ak \u00E1no, podrobnosti m\u00F4\u017Eete nakonfigurova\u0165 ni\u017E\u0161ie. V\u0161etky polia je mo\u017En\u00E9 zmeni\u0165 nesk\u00F4r.<br>\u010Clenovia fakulty potrebuj\u00FA na poskytnutie sp\u00E4tnej v\u00E4zby prihl\u00E1senie. Vidite\u013Enos\u0165 dokumentov prihl\u00E1\u0161ky pre \u010Dlenov fakulty nakonfigurujete na karte "$\:edit.step.references.visibility".
edit.form_description.comparative.experts=Vyberte, \u010Di administrat\u00EDvny pracovn\u00EDk m\u00F4\u017Ee prid\u00E1va\u0165 posudzovate\u013Eov pre porovn\u00E1vac\u00ED posudok viacer\u00FDch prihl\u00E1\u0161ok, a v takom pr\u00EDpade nakonfigurujte podrobnosti ni\u017E\u0161ie. Tak\u00E1to osoba z\u00EDska pr\u00EDstup k viacer\u00FDm prihl\u00E1\u0161kam a m\u00F4\u017Ee nahra\u0165 jedin\u00FD s\u00FAbor s porovn\u00E1vac\u00EDm posudkom t\u00FDchto prihl\u00E1\u0161ok.<br>Po aktiv\u00E1cii m\u00F4\u017Eete na karte "$\:edit.step.references.visibility" nakonfigurova\u0165, ktor\u00E9 prvky prihl\u00E1\u0161ok s\u00FA pre tieto osoby vidite\u013En\u00E9.
edit.form_description.configuration=Nakonfigurujte pracovn\u00FA poz\u00EDciu ni\u017E\u0161ie v\u00FDberom mo\u017Enost\u00ED, ktor\u00E9 s\u00FA pre t\u00FAto pracovn\u00FA poz\u00EDciu relevantn\u00E9. V\u0161etky polia je mo\u017En\u00E9 zmeni\u0165 nesk\u00F4r.
edit.form_description.decision=Aktivujte alebo deaktivujte n\u00E1stroj rozhodovania, ktor\u00FD je mo\u017En\u00E9 pou\u017Ei\u0165 po\u010Das zasadnutia komisie. Rozhodovacie krit\u00E9ri\u00E1 je mo\u017En\u00E9 vytvori\u0165 priamo v n\u00E1stroji.
edit.form_description.document=Zo zoznamu ni\u017E\u0161ie vyberte, ktor\u00E9 dokumenty pre pracovn\u00FA poz\u00EDciu vy\u017Eadujete. Kliknut\u00EDm na "Upravi\u0165" uprav\u00EDte \u010Fal\u0161ie podrobnosti dokumentu.
edit.form_description.experts=Vyberte, \u010Di administrat\u00EDvny pracovn\u00EDk m\u00F4\u017Ee prid\u00E1va\u0165 posudzovate\u013Eov, a v takom pr\u00EDpade nakonfigurujte podrobnosti ni\u017E\u0161ie. Posudzovate\u013E z\u00EDska pr\u00EDstup k jednej prihl\u00E1\u0161ke a m\u00F4\u017Ee nahra\u0165 s\u00FAbor s odborn\u00FDm posudkom k tejto prihl\u00E1\u0161ke.<br>Po aktiv\u00E1cii m\u00F4\u017Eete na karte "$\:edit.step.references.visibility" nakonfigurova\u0165, ktor\u00E9 prvky prihl\u00E1\u0161ok s\u00FA pre tieto osoby vidite\u013En\u00E9.
edit.form_description.public.feedback=Vyberte, \u010Di prihl\u00E1\u0161ky maj\u00FA odkaz na verejn\u00FA sp\u00E4tn\u00FA v\u00E4zbu. Ak \u00E1no, ni\u017E\u0161ie m\u00F4\u017Eete zada\u0165 term\u00EDn odovzdania. V\u0161etky polia je mo\u017En\u00E9 zmeni\u0165 nesk\u00F4r. Ak s\u00FA odkazy aktivovan\u00E9, je mo\u017En\u00E9 ich skop\u00EDrova\u0165 a zdie\u013Ea\u0165 (jeden odkaz na prihl\u00E1\u0161ku). Odkazy s\u00FA pr\u00EDstupn\u00E9 iba po prihl\u00E1sen\u00ED. Osoby, ktor\u00E9 odkaz otvoria, vidia iba meno uch\u00E1dza\u010Da.
edit.form_description.referees=Vyberte, \u010Di administrat\u00EDvny pracovn\u00EDk m\u00F4\u017Ee prid\u00E1va\u0165 posudzovate\u013Eov a \u010Di uch\u00E1dza\u010Di m\u00F4\u017Eu uv\u00E1dza\u0165 referen\u010Dn\u00E9 osoby. Ak \u00E1no, podrobnosti m\u00F4\u017Eete nakonfigurova\u0165 ni\u017E\u0161ie. V\u0161etky polia je mo\u017En\u00E9 zmeni\u0165 nesk\u00F4r.
edit.form_description.referees.management=Vyberte, \u010Di uch\u00E1dza\u010Di m\u00F4\u017Eu uv\u00E1dza\u0165 a spravova\u0165 referen\u010Dn\u00E9 osoby, a v takom pr\u00EDpade nakonfigurujte podrobnosti ni\u017E\u0161ie.<br>Upozornenie\: Ak uch\u00E1dza\u010Di m\u00F4\u017Eu spravova\u0165 referen\u010Dn\u00E9 osoby, e-mail referen\u010Dn\u00FDm osob\u00E1m sa v\u017Edy odo\u0161le bezprostredne po odoslan\u00ED prihl\u00E1\u0161ky.<br>Po aktiv\u00E1cii m\u00F4\u017Eete na karte "$\:edit.step.references.visibility" nakonfigurova\u0165, ktor\u00E9 prvky prihl\u00E1\u0161ok s\u00FA pre referen\u010Dn\u00E9 osoby vidite\u013En\u00E9.
edit.form_description.status=Stanovte uveden\u00E9 term\u00EDny a nakonfigurujte, \u010Di sa \u010Dlenom komisie bez hodnotenia m\u00E1 automaticky posla\u0165 e-mailov\u00E1 pripomienka. Pomocou stavu pracovnej poz\u00EDcie vo\u013En\u00E9 miesto zverejn\u00EDte alebo ho ponech\u00E1te v stave "V pr\u00EDprave". V\u0161etky polia je mo\u017En\u00E9 zmeni\u0165 nesk\u00F4r.
