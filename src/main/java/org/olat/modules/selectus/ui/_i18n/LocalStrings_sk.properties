apply_application.email.referee.mgmt=<p>Automaticky vytvoren\u00E9 potvrdenie o prijat\u00ED</p><p>$applicantDearTitleName</p><p>\u010Eakujeme v\u00E1m za prihl\u00E1\u0161ku na "$positionTitle". Va\u0161e podklady bud\u00FA post\u00FApen\u00E9 pr\u00EDslu\u0161nej v\u00FDberovej komisii.</p><p>Ako s\u00FA\u010Das\u0165 va\u0161ej prihl\u00E1\u0161ky komisia vy\u017Eaduje odpor\u00FA\u010Dacie listy. Kliknite na odkaz ni\u017E\u0161ie, prihl\u00E1ste sa do n\u00E1stroja Faculty Recruiting Tool a sledujte stav svojich referenci\u00ED. Ak referen\u010Dn\u00E1 osoba \u017Eiados\u0165 o odpor\u00FA\u010Dac\u00ED list odmietne, m\u00F4\u017Eete ur\u010Di\u0165 \u010Fal\u0161ie referen\u010Dn\u00E9 osoby. Odoslan\u00E9 odpor\u00FA\u010Dacie listy s\u00FA d\u00F4vern\u00E9 a nie s\u00FA v\u00E1m pr\u00EDstupn\u00E9.<br>$applicantURL</p><p>Pos\u00FAdenie prihl\u00E1\u0161ok si vy\u017Eiada ur\u010Dit\u00FD \u010Das. Hne\u010F ako komisia rozhodne, budeme v\u00E1s informova\u0165.</p><p>S pozdravom</p>
