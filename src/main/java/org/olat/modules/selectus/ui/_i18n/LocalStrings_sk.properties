disclaimer.privacy.ok=Prija\u0165
disclaimer.privacy.text=<h5>Zber \u00FAdajov</h5><p>Pri pou\u017E\u00EDvan\u00ED syst\u00E9mu Selectus sa ukladaj\u00FA \u00FAdaje. Z d\u00F4vodov sledovate\u013Enosti to plat\u00ED aj vtedy, ke\u010F sa proces preru\u0161\u00ED.</p><p>Zbieraj\u00FA sa osobn\u00E9 \u00FAdaje ako meno, e-mail a adresa. Odoslan\u00E9 \u00FAdaje a dokumenty s\u00FA vidite\u013En\u00E9 pre hodnotiacu komisiu a pr\u00EDpadne aj pre expertov a posudzovate\u013Eov. \u010Ealej sa zaznamen\u00E1vaj\u00FA online \u00FAdaje ako IP adresa, poloha, verzia prehliada\u010Da a d\u00E1tum a \u010Das pr\u00EDstupu. Tieto \u00FAdaje sa na \u00FA\u010Dely sledovate\u013Enosti ukladaj\u00FA do protokolov\u00FDch s\u00FAborov.</p><p>Po ukon\u010Den\u00ED konania sa \u00FAdaje uchov\u00E1vaj\u00FA \u010Fal\u0161ie dva roky a potom sa definit\u00EDvne vyma\u017E\u00FA.</p><h5>Prenos \u00FAdajov</h5><p>Cel\u00E1 d\u00E1tov\u00E1 komunik\u00E1cia je \u0161ifrovan\u00E1. Servery na ukladanie \u00FAdajov vlastn\u00ED frentix GmbH a nach\u00E1dzaj\u00FA sa vo \u0160vaj\u010Diarsku.</p><h5>Vymazanie alebo nahliadnutie do \u00FAdajov</h5><p>\u017Diadosti o vymazanie svojich \u00FAdajov alebo o nahliadnutie do nich posielajte na adresu datenschutz@frentix.com. Po vymazan\u00ED zostan\u00FA \u00FAdaje \u010Fal\u0161ie tri mesiace v z\u00E1loh\u00E1ch, k\u00FDm sa definit\u00EDvne nevyma\u017E\u00FA. Exporty \u00FAdajov neposkytuj\u00FA nahliadnutie do hodnotenia alebo pos\u00FAdenia va\u0161ej prihl\u00E1\u0161ky.</p><h5>Prijatie</h5>
