apply_application.email=<p>V\u00E1\u017Een\u00E1 pani, v\u00E1\u017Een\u00FD p\u00E1n {0}</p><p>V mene dekan\u00E1tu v\u00E1m \u010Fakujeme za va\u0161u prihl\u00E1\u0161ku na uveden\u00FA poz\u00EDciu. Va\u0161a prihl\u00E1\u0161ka bude predlo\u017Een\u00E1 komisii, ktor\u00E1 dekan\u00E1t poradensky sprev\u00E1dza pri v\u00FDbere uch\u00E1dza\u010Dov.</p><p>Starostliv\u00E9 pos\u00FAdenie mnoh\u00FDch prihl\u00E1\u0161ok si vy\u017Eiada ur\u010Dit\u00FD \u010Das. Ozveme sa v\u00E1m hne\u010F, ako to bude mo\u017En\u00E9.</p><p>S pozdravom<br>Kancel\u00E1ria</p>
