reference.comparative.expert.mail.body=<p>$refereeDearTitleName,</p><p>obraciam sa na v\u00E1s v s\u00FAvislosti s v\u00FDberov\u00FDm konan\u00EDm na OpenOlat University na vo\u013En\u00FA poz\u00EDciu "$positionTitle".</p><p>V\u00FDberov\u00E1 komisia zva\u017Euje pre t\u00FAto poz\u00EDciu tieto kandidat\u00FAry\:<br>$applicantList</p><p>Ke\u010F\u017Ee v tejto oblasti m\u00E1te osobitn\u00FA odbornos\u0165, boli by sme v\u00E1m ve\u013Emi v\u010Fa\u010Dn\u00ED, keby ste n\u00E1m pomohli s pos\u00FAden\u00EDm a vypracovali porovn\u00E1vac\u00ED posudok o vhodnosti t\u00FDchto kandidat\u00FAr na vo\u013En\u00FA poz\u00EDciu. V\u00E1\u0161 posudok radi prijmeme \u010Do najsk\u00F4r, najnesk\u00F4r v\u0161ak do $refereeDeadline.</p><p>Kliknite na odkaz ni\u017E\u0161ie, prijmite na\u0161u \u017Eiados\u0165, z\u00EDskajte inform\u00E1cie o kandidat\u00FArach a o profile poz\u00EDcie a nahrajte svoj posudok ako jeden s\u00FAbor PDF. Ak nie ste k dispoz\u00EDcii ako posudzovate\u013E, pros\u00EDme v\u00E1s, aby ste n\u00E1m to ozn\u00E1mili cez ten ist\u00FD odkaz a \u017Eiados\u0165 odmietli\:<br>$refereeUrl</p><p>S pozdravom<br>$headFirstname $headLastname<br>Predsedn\u00EDctvo v\u00FDberovej komisie</p>
