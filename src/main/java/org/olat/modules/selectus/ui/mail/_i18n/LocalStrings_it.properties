mail.templates.description=Pu\u00F2 personalizzare i modelli di e-mail di sistema delle funzioni attivate oppure, se gi\u00E0 personalizzati, ripristinarli alla versione originale.<br>Con il pulsante "$\:add.template" pu\u00F2 creare ulteriori modelli di e-mail specifici per la posizione per contattare le persone candidate. I modelli di posizione esistenti possono essere modificati o eliminati, ma non ripristinati a una versione precedente.
mail.templates.description.with.letter=I modelli di e-mail con lettera circolare contengono una lettera circolare allegata in formato PDF. Il testo della lettera circolare pu\u00F2 essere personalizzato, definito o modificato solo qui, non al momento dell'invio delle e-mail alle persone candidate. Noti che, con il ripristino di un modello di e-mail di sistema con lettera circolare, viene ripristinato anche il testo della lettera circolare.
mail.templates.description.with.management=Il modello "Conferma di candidatura senza gestione delle referenze" \u00E8 attivo e viene inviato automaticamente alle persone candidate se la funzione "Le persone candidate possono indicare e gestire i referenti" non \u00E8 attivata.<br>Il modello "Conferma di candidatura con gestione delle referenze" \u00E8 attivo e viene inviato automaticamente alle persone candidate se la funzione "Le persone candidate possono indicare e gestire i referenti" \u00E8 attivata.<br>Nella navigazione principale della modalit\u00E0 di modifica vada a "<a href\='{0}'>Referente / Esperto</a>" per configurare i referenti e la loro gestione.
