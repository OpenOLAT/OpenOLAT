edit.steps.explain=<p>Haga clic en "$\:edit.steps" para activar o desactivar los pasos que deben aparecer en el proceso de candidatura.<br>Haga clic en cada paso para personalizar su contenido y ver una vista previa. Las opciones de personalizaci\u00F3n var\u00EDan seg\u00FAn el paso.</p><ul><li>Adapte los textos de instrucciones y ayuda visibles en los distintos pasos del proceso de candidatura.</li><li>A\u00F1ada preguntas propias a los pasos "$\:edit.step.personal.data", "$\:edit.step.academical.background" y "$\:edit.step.project".</li><li>Seleccione en el paso "$\:edit.step.documents" qu\u00E9 documentos se exigen a los candidatos.</li><li>Configure las opciones de feedback en el paso "$\:edit.step.review.and.submit".</li><li>Adapte en el paso "$\:edit.step.confirmation" el texto de confirmaci\u00F3n y el e-mail que reciben los candidatos tras enviar su candidatura.</li><li>Tenga en cuenta que las personas de referencia se configuran en la pesta\u00F1a "Persona de referencia / experto" de la navegaci\u00F3n principal del modo de edici\u00F3n.</li></ul>
