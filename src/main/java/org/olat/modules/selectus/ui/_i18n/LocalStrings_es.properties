edit.form_description=Rellene el formulario a continuaci\u00F3n para crear una convocatoria nueva. Con el estado de la convocatoria, publica la plaza vacante o la deja en el estado "En preparaci\u00F3n". Todos los campos se pueden modificar m\u00E1s adelante.
edit.form_description.apps.feedback=Seleccione si el personal administrativo puede solicitar feedback a los miembros de la facultad. En caso afirmativo, puede configurar los detalles a continuaci\u00F3n. Todos los campos se pueden modificar m\u00E1s adelante.<br>Los miembros de la facultad necesitan un inicio de sesi\u00F3n para dar feedback. La visibilidad de los documentos de la candidatura para los miembros de la facultad se configura en la pesta\u00F1a "$\:edit.step.references.visibility".
edit.form_description.comparative.experts=Seleccione si el personal administrativo puede a\u00F1adir expertos para un dictamen comparativo de varias candidaturas y, en ese caso, configure los detalles a continuaci\u00F3n. Esa persona obtiene acceso a varias candidaturas y puede subir un \u00FAnico archivo con un dictamen comparativo de esas candidaturas.<br>Tras la activaci\u00F3n, puede configurar en la pesta\u00F1a "$\:edit.step.references.visibility" qu\u00E9 elementos de las candidaturas son visibles para esas personas.
edit.form_description.configuration=Configure la convocatoria a continuaci\u00F3n seleccionando las opciones relevantes para esta convocatoria. Todos los campos se pueden modificar m\u00E1s adelante.
edit.form_description.decision=Active o desactive la herramienta de decisi\u00F3n, que puede utilizarse durante una sesi\u00F3n de la comisi\u00F3n. Las r\u00FAbricas de decisi\u00F3n se pueden crear directamente en la herramienta.
edit.form_description.document=Seleccione en la lista a continuaci\u00F3n qu\u00E9 documentos exige para la convocatoria. Haga clic en "Editar" para ajustar m\u00E1s detalles de un documento.
edit.form_description.experts=Seleccione si el personal administrativo puede a\u00F1adir expertos y, en ese caso, configure los detalles a continuaci\u00F3n. Un experto obtiene acceso a una \u00FAnica candidatura y puede subir un archivo con un dictamen sobre esa candidatura.<br>Tras la activaci\u00F3n, puede configurar en la pesta\u00F1a "$\:edit.step.references.visibility" qu\u00E9 elementos de las candidaturas son visibles para esas personas.
edit.form_description.public.feedback=Seleccione si las candidaturas tienen un enlace de retroalimentaci\u00F3n p\u00FAblica. En caso afirmativo, puede introducir el plazo de entrega a continuaci\u00F3n. Todos los campos se pueden modificar m\u00E1s adelante. Si los enlaces est\u00E1n activados, pueden copiarse para compartirlos (un enlace por candidatura). Los enlaces solo son accesibles con inicio de sesi\u00F3n. Las personas que abren el enlace solo ven el nombre del candidato.
edit.form_description.referees=Seleccione si el personal administrativo puede a\u00F1adir expertos y si los candidatos pueden indicar personas de referencia. En caso afirmativo, puede configurar los detalles a continuaci\u00F3n. Todos los campos se pueden modificar m\u00E1s adelante.
edit.form_description.referees.management=Seleccione si los candidatos pueden indicar y gestionar personas de referencia y, en ese caso, configure los detalles a continuaci\u00F3n.<br>Tenga en cuenta\: si los candidatos pueden gestionar personas de referencia, el e-mail a las personas de referencia se env\u00EDa siempre inmediatamente despu\u00E9s de enviar la candidatura.<br>Tras la activaci\u00F3n, puede configurar en la pesta\u00F1a "$\:edit.step.references.visibility" qu\u00E9 elementos de las candidaturas son visibles para las personas de referencia.
edit.form_description.status=Defina los plazos indicados y configure si los miembros de la comisi\u00F3n sin valoraci\u00F3n deben recibir recordatorios autom\u00E1ticos por e-mail. Con el estado de la convocatoria, publica la plaza vacante o la deja en el estado "En preparaci\u00F3n". Todos los campos se pueden modificar m\u00E1s adelante.
