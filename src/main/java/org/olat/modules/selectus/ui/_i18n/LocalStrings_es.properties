edit.rating.policy.points.confidentiality=Le rogamos que trate toda la informaci\u00F3n y todos los documentos de forma estrictamente confidencial. Todos los documentos e informaciones orales sobre las candidaturas que la comisi\u00F3n de selecci\u00F3n recibe durante la preparaci\u00F3n del procedimiento est\u00E1n sujetos a confidencialidad.<br/>Los documentos est\u00E1n destinados exclusivamente a los miembros de la comisi\u00F3n de selecci\u00F3n. Los documentos no pueden copiarse ni ponerse a disposici\u00F3n de terceros de ninguna otra forma. Los documentos descargados y las copias impresas deben eliminarse o destruirse una vez concluido el procedimiento.<br/>Sus valoraciones en la herramienta est\u00E1n anonimizadas para el personal administrativo, la presidencia de la comisi\u00F3n y los dem\u00E1s miembros de la comisi\u00F3n.<br/>Sus comentarios son personales. El personal administrativo, la presidencia de la comisi\u00F3n y los dem\u00E1s miembros de la comisi\u00F3n no tienen acceso a ellos. Una vez concluido todo el procedimiento, se eliminar\u00E1n del servidor todos los datos relevantes.
edit.rating.policy.points.confidentiality.title=Confidencialidad\:
edit.rating.policy.points.focus=Lo esencial es la excelencia en investigaci\u00F3n y docencia. Un ajuste perfecto al perfil es secundario.
edit.rating.policy.points.focus.title=Enfoque en la excelencia\:
edit.rating.policy.points.introduction=Es habitual que cient\u00EDficas y cient\u00EDficos cualificados que no han presentado su candidatura y que, por tanto, no figuran en la lista de candidaturas puedan proponerse en cualquier fase del procedimiento. Animamos expresamente a todos los miembros de la comisi\u00F3n de selecci\u00F3n a pensar en posibles candidaturas destacadas y a traer su curr\u00EDculum vitae y su lista de publicaciones a las sesiones o a envi\u00E1rnoslos con antelaci\u00F3n, para que podamos remitirlos a todos los miembros de la comisi\u00F3n de antemano.
edit.rating.policy.points.introduction.title=Propuesta de posibles candidaturas\:
edit.rating.policy.points.women=Para aumentar el n\u00FAmero de mujeres en puestos acad\u00E9micos de direcci\u00F3n, la facultad da preferencia a las candidatas frente a los candidatos con una cualificaci\u00F3n cient\u00EDfica y docente comparable.
