apply_application.email.referee.mgmt=<p>Acuse de recibo generado autom\u00E1ticamente</p><p>$applicantDearTitleName</p><p>Le agradecemos su candidatura para "$positionTitle". Su documentaci\u00F3n se remitir\u00E1 a la comisi\u00F3n de selecci\u00F3n competente.</p><p>Como parte de su candidatura, la comisi\u00F3n requiere cartas de recomendaci\u00F3n. Siga el enlace a continuaci\u00F3n para iniciar sesi\u00F3n en el Faculty Recruiting Tool y seguir el estado de sus referencias. Puede designar personas de referencia adicionales si alguna rechaza la solicitud de una carta de recomendaci\u00F3n. Las cartas de recomendaci\u00F3n enviadas son confidenciales y usted no puede consultarlas.<br>$applicantURL</p><p>La valoraci\u00F3n de las candidaturas llevar\u00E1 alg\u00FAn tiempo. Le informaremos en cuanto la comisi\u00F3n haya tomado una decisi\u00F3n.</p><p>Atentamente</p>
