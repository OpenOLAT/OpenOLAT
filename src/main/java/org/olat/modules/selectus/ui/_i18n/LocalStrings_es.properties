reference.comparative.expert.mail.body=<p>$refereeDearTitleName,</p><p>me dirijo a usted en relaci\u00F3n con el procedimiento de selecci\u00F3n de la OpenOlat University para la plaza vacante "$positionTitle".</p><p>La comisi\u00F3n de selecci\u00F3n est\u00E1 considerando las siguientes candidaturas para esta plaza\:<br>$applicantList</p><p>Dado que usted dispone de conocimientos especializados en este \u00E1mbito, le estar\u00EDamos muy agradecidos si nos apoyara en la valoraci\u00F3n y redactara un dictamen comparativo sobre la idoneidad de estas candidaturas para la plaza vacante. Esperamos recibir su dictamen lo antes posible y, a m\u00E1s tardar, el $refereeDeadline.</p><p>Siga el enlace a continuaci\u00F3n para aceptar nuestra solicitud, obtener informaci\u00F3n sobre las candidaturas y el perfil de la plaza y subir su dictamen como un \u00FAnico archivo PDF. Si no puede actuar como experto, le rogamos que nos lo comunique mediante el mismo enlace y rechace la solicitud\:<br>$refereeUrl</p><p>Atentamente<br>$headFirstname $headLastname<br>Presidencia de la comisi\u00F3n de selecci\u00F3n</p>
