apply_application.email=<p>Estimada se\u00F1ora, estimado se\u00F1or {0}</p><p>En nombre del decanato le agradecemos su candidatura para el puesto arriba mencionado. Su candidatura se presentar\u00E1 a la comisi\u00F3n que asesora al decanato en la selecci\u00F3n de candidatos.</p><p>El examen cuidadoso de las numerosas candidaturas llevar\u00E1 alg\u00FAn tiempo. Nos pondremos en contacto con usted lo antes posible.</p><p>Atentamente<br>Oficina administrativa</p>
