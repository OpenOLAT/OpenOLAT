rejection.mail.-.subject=Confidencial - {0}
rejection.mail.body=<p>Estimada se\u00F1ora, estimado se\u00F1or $nameAndTitle</p><p>me dirijo a usted en relaci\u00F3n con su candidatura para el puesto arriba mencionado.</p><p>La comisi\u00F3n de selecci\u00F3n que me asesora en este asunto ha examinado detenidamente las candidaturas. Tras un amplio debate, sus miembros han recomendado tener en cuenta otras candidaturas para el procedimiento de selecci\u00F3n. He decidido seguir esta recomendaci\u00F3n y lamento comunicarle que, por lo tanto, su candidatura no seguir\u00E1 siendo considerada.</p><p>Le agradezco mucho el tiempo que ha dedicado a su candidatura y le deseo mucho \u00E9xito en su trayectoria profesional.</p><p>Atentamente<br>$headFirstname $headLastname<br>Presidencia de la comisi\u00F3n</p>
rejection.mail.bonhold.body=<p>$dearTitleAndName</p><p>Usted ha presentado su candidatura para "{0}". Le agradecemos el inter\u00E9s mostrado por trabajar en la Universidad OpenOlat. </p><p>Lamento comunicarle que la comisi\u00F3n de selecci\u00F3n competente, tras un examen detenido de su candidatura, ha decidido no incluirla en la terna final para la plaza convocada. No obstante, si usted est\u00E1 de acuerdo, la comisi\u00F3n desea mantener su candidatura en espera. Su documentaci\u00F3n enviada electr\u00F3nicamente solo se eliminar\u00EDa tras la conclusi\u00F3n definitiva del procedimiento de selecci\u00F3n, del cual le volver\u00EDamos a informar.</p><p>Atentamente<br>Prof. Dr. {2}<br>Presidencia de la comisi\u00F3n de selecci\u00F3n<br>Universidad OpenOlat</p>
rejection.mail.bonhold.subject=Su candidatura en la Universidad OpenOlat
rejection.mail.crejection.body=<p>$dearTitleAndName</p><p>Usted ha presentado su candidatura para "{0}". Le agradecemos el inter\u00E9s mostrado por trabajar en la Universidad OpenOlat.</p><p>Lamento comunicarle que la comisi\u00F3n de selecci\u00F3n competente ha decidido no seguir considerando su candidatura en el procedimiento.</p><p>Su documentaci\u00F3n electr\u00F3nica se eliminar\u00E1 por motivos de protecci\u00F3n de datos.</p><p>En nombre de la comisi\u00F3n, le deseo mucho \u00E9xito en su carrera cient\u00EDfica.</p><p>Atentamente<br>Prof. Dr. {2}<br>Presidencia de la comisi\u00F3n de selecci\u00F3n\nUniversidad OpenOlat</p>
