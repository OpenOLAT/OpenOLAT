disclaimer.privacy.accept=<strong>He comprendido las disposiciones de protecci\u00F3n de datos y acepto el almacenamiento y el tratamiento de mis datos.</strong>
disclaimer.privacy.ok=Aceptar
disclaimer.privacy.text=<h5>Recopilaci\u00F3n de datos</h5><p>Al utilizar Selectus se guardan datos. Por motivos de trazabilidad, esto tambi\u00E9n se aplica si el proceso se interrumpe.</p><p>Se recopilan datos personales como el nombre, el e-mail y la direcci\u00F3n. Los datos y documentos enviados son visibles para la comisi\u00F3n que valora y, en su caso, tambi\u00E9n para expertos y revisores. Adem\u00E1s, se registran datos en l\u00EDnea como la direcci\u00F3n IP, la ubicaci\u00F3n, la versi\u00F3n del navegador y la fecha y hora de acceso. Estos datos se guardan en archivos de registro con fines de trazabilidad.</p><p>Una vez concluido un procedimiento, los datos se conservan durante dos a\u00F1os m\u00E1s y despu\u00E9s se eliminan definitivamente.</p><h5>Transferencia de datos</h5><p>Todo el tr\u00E1fico de datos est\u00E1 cifrado. Los servidores de almacenamiento de datos son propiedad de frentix GmbH y se encuentran en Suiza.</p><h5>Eliminar o consultar datos</h5><p>Env\u00EDe las solicitudes de eliminaci\u00F3n o consulta de sus datos a datenschutz@frentix.com. Tras la eliminaci\u00F3n, los datos permanecen en las copias de seguridad durante tres meses m\u00E1s antes de eliminarse definitivamente. Las exportaciones de datos no permiten conocer la evaluaci\u00F3n ni la valoraci\u00F3n de su candidatura.</p><h5>Aceptar</h5>
