room.size.desc=El n\u00FAmero m\u00E1ximo de participantes limita las plazas disponibles de la sala de la sesi\u00F3n. Cuando todas las plazas est\u00E1n ocupadas, ning\u00FAn usuario nuevo puede unirse a la sesi\u00F3n.
