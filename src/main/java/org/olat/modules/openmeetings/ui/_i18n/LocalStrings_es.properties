room.type.desc=Tipo de sesi\u00F3n. Esto determina las herramientas y los derechos de moderaci\u00F3n disponibles en la sala de la sesi\u00F3n. Las conferencias est\u00E1n pensadas para un n\u00FAmero de usuarios m\u00E1s bien reducido, en el que todos los participantes intervienen en igualdad de condiciones con se\u00F1al de video y pueden utilizar todas las herramientas. Un webinar, en cambio, corresponde a una clase magistral con un ponente con se\u00F1al de video y muchos oyentes. Una entrevista es una sesi\u00F3n en la que se entrevista a una persona y se graba la conversaci\u00F3n. 
