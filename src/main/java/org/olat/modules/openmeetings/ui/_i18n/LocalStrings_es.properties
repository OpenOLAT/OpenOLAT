room.moderation.mode.desc=Si est\u00E1 habilitada en la administraci\u00F3n, esta opci\u00F3n obliga a que haya un moderador presente. Quienes no son moderadores no pueden realizar ninguna acci\u00F3n en la sala hasta que entre un moderador. En los cursos se consideran moderadores los autores y los tutores del curso; en los grupos, los tutores del grupo.
