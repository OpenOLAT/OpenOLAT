check.explanation=Antes de trabajar con OpenMeetings, deber\u00EDa comprobar la conexi\u00F3n con OpenMeetings. Todas las pruebas deben superarse para poder trabajar con OpenMeetings. De lo contrario, habr\u00E1 limitaciones.\nSi a pesar de haber superado las pruebas tiene problemas al utilizar OpenMeetings, escr\u00EDbanos un e-mail y describa el problema.\n\nComo OpenMeetings se basa en Flash, actualmente no es posible utilizarlo con tabletas y smartphones.
