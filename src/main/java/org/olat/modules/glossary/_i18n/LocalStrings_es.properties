edit.intro=De forma predeterminada, solo los propietarios de este glosario pueden crear y editar entradas. La opci\u00F3n "Permitir derechos de escritura para todos los usuarios" permite a todos los usuarios del sistema crear nuevas entradas del glosario y, a continuaci\u00F3n, modificar y volver a eliminar las entradas que hayan creado. Los propietarios pueden modificar o eliminar en cualquier momento las entradas creadas por otros usuarios.<br /><br />Si esta funci\u00F3n est\u00E1 activada, junto a la entrada del glosario se muestran su autor y la \u00FAltima persona que realiz\u00F3 cambios.
