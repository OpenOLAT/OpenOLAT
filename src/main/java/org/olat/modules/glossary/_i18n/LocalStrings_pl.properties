edit.intro=Domy\u015Blnie tylko w\u0142a\u015Bciciele tego s\u0142ownika mog\u0105 tworzy\u0107 i edytowa\u0107 wpisy. Opcja "W\u0142\u0105cz uprawnienia zapisu dla wszystkich u\u017Cytkownik\u00F3w" pozwala wszystkim u\u017Cytkownikom systemu tworzy\u0107 nowe wpisy s\u0142ownika, a nast\u0119pnie zmienia\u0107 i usuwa\u0107 wpisy utworzone przez siebie. W\u0142a\u015Bciciele mog\u0105 w ka\u017Cdej chwili zmienia\u0107 lub usuwa\u0107 wpisy utworzone przez innych u\u017Cytkownik\u00F3w.<br /><br />Je\u015Bli ta funkcja jest w\u0142\u0105czona, obok wpisu s\u0142ownika wy\u015Bwietlany jest jego autor oraz osoba, kt\u00F3ra jako ostatnia wprowadzi\u0142a zmiany.
