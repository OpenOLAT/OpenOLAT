register.intro=Ten spis bazuje na alfabecie \u0142aci\u0144skim, wi\u0119c zawiera litery od A do Z. \u017Beby u\u017Cywa\u0107 s\u0142ownika z innym zestawem znak\u00F3w, musisz wy\u0142\u0105czy\u0107 obecny.
