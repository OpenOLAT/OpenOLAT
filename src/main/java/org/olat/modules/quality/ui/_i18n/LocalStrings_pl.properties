reminder.reminder1.body2=<h1>$title</h1>Dzie\u0144 dobry,<br><br>zapraszamy Pa\u0144stwa do udzia\u0142u w badaniu "$title".<br><br><div class\="o_email_button_group"><a class\="o_email_button" href\="$url">Otw\u00F3rz sonda\u017C</a></div><br><br><b>$invitation</b> uprzejmie zaprosili\u015Bmy Pa\u0144stwa do udzia\u0142u w przes\u0142anym badaniu. Niestety do tej pory nie otrzymali\u015Bmy Pa\u0144stwa odpowiedzi. Prosimy o po\u015Bwi\u0119cenie czasu na wype\u0142nienie ankiety. Pomog\u0105 nam Pa\u0144stwo w ten spos\u00F3b stale ulepsza\u0107 ofert\u0119 naszej instytucji edukacyjnej.<br><br><strong>Przedmiot opiniowania\: $topictype $topic</strong>$context<br><br>Sonda\u017C ko\u0144czy si\u0119 <strong>$deadline</strong>. Po tym terminie udzia\u0142 w badaniu nie b\u0119dzie ju\u017C mo\u017Cliwy.<br><br>Dzi\u0119kujemy\!<br><br>Z powa\u017Caniem<br>Pe\u0142nomocnik ds. jako\u015Bci
