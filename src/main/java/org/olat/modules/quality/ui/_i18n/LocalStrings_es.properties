qualitative.feedback.body2=<h1>$title</h1>Buenos d\u00EDas:<br><br>En la encuesta "$title" se ha dejado feedback cualitativo.<br><br><div class\="o_email_button_group"><a class\="o_email_button" href\="$url">Ir al feedback</a></div><br><br>Se trata de una encuesta con las siguientes caracter\u00EDsticas\:<br><br><strong>Objeto de valoraci\u00F3n\: $topictype $topic</strong>$context<br><br>Atentamente,<br>Su responsable de calidad<br>
