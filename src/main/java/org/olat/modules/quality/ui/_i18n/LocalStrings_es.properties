reminder.invitation.body2=<h1>$title</h1>Buenos d\u00EDas:<br><br>Le invitamos a participar en la encuesta "$title".<br><br><div class\="o_email_button_group"><a class\="o_email_button" href\="$url">Abrir encuesta</a></div><br><br>Con sus respuestas nos ayuda a mejorar continuamente nuestra oferta como instituci\u00F3n educativa.<br><br><strong>Objeto de valoraci\u00F3n\: $topictype $topic</strong>$context<br><br>La encuesta finaliza el <strong>$deadline</strong>. Despu\u00E9s de esta fecha ya no ser\u00E1 posible participar en la encuesta.<br><br>\u00A1Muchas gracias\!<br><br>Atentamente,<br>Su responsable de calidad
reminder.invitation.date=Fecha de env\u00EDo de la invitaci\u00F3n
reminder.invitation.subject=$title\: $topictype $topic
reminder.reminder1.body2=<h1>$title</h1>Buenos d\u00EDas:<br><br>Le invitamos a participar en la encuesta "$title".<br><br><div class\="o_email_button_group"><a class\="o_email_button" href\="$url">Abrir encuesta</a></div><br><br>El <b>$invitation</b> le invitamos amablemente a participar en la encuesta que le enviamos. Lamentablemente, hasta la fecha no hemos recibido sus respuestas. Le rogamos que dedique un momento a rellenar el cuestionario. As\u00ED nos ayuda a mejorar continuamente nuestra oferta como instituci\u00F3n educativa.<br><br><strong>Objeto de valoraci\u00F3n\: $topictype $topic</strong>$context<br><br>La encuesta finaliza el <strong>$deadline</strong>. Despu\u00E9s de esta fecha ya no ser\u00E1 posible participar en la encuesta.<br><br>\u00A1Muchas gracias\!<br><br>Atentamente,<br>Su responsable de calidad
reminder.reminder1.date=Fecha de env\u00EDo del recordatorio 1
reminder.reminder1.subject=$title\: $topictype $topic
reminder.reminder2.body2=<h1>$title</h1>Buenos d\u00EDas:<br><br>Le invitamos a participar en la encuesta "$title".<br><br><div class\="o_email_button_group"><a class\="o_email_button" href\="$url">Abrir encuesta</a></div><br><br>El <b>$invitation</b> le invitamos amablemente a participar en la encuesta que le enviamos. Lamentablemente, hasta la fecha no hemos recibido sus respuestas. Le rogamos que dedique cuanto antes un momento a rellenar el cuestionario. Con su respuesta nos ayuda a mejorar continuamente nuestra oferta como instituci\u00F3n educativa.<br><br><strong>Objeto de valoraci\u00F3n\: $topictype $topic</strong>$context<br><br>La encuesta finaliza el <strong>$deadline</strong>. Despu\u00E9s de esta fecha ya no ser\u00E1 posible participar en la encuesta.<br><br>\u00A1Muchas gracias\!<br><br>Atentamente,<br>Su responsable de calidad
