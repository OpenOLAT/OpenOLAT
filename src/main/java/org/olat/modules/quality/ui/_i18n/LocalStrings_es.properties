reminder.announcement.coach.context.body2=<h1>$title</h1>Buenos d\u00EDas:<br><br>Le informamos de que el $start su clase realizar\u00E1 la valoraci\u00F3n sobre usted. Le rogamos que reserve tiempo para esta encuesta.<br><br><strong>Objeto de valoraci\u00F3n\: $topictype $topic</strong>$context<br><br>Muchas gracias por su colaboraci\u00F3n y que tenga un buen d\u00EDa.<br><br>Atentamente,<br>Su responsable de calidad
