import.curriculums.hint.file=Aqu\u00ED puede importar elementos o actualizar elementos existentes subiendo los datos en un archivo Excel. Durante la importaci\u00F3n, los datos se comprueban y se procesan: los elementos nuevos se crean y los elementos existentes se actualizan seg\u00FAn su ID.<br>En el siguiente paso recibir\u00E1 un resumen de todos los cambios antes de que se apliquen.
import.curriculums.infos.file1=El archivo Excel y su contenido deben cumplir las siguientes condiciones:<ul><li>Debe existir la hoja "Productos"</li><li>Todos los campos obligatorios deben estar rellenados (marcados con un asterisco)</li><li>Solo se pueden actualizar determinados atributos de los elementos; todos los dem\u00E1s se ignoran</li><li>Las referencias deben ser \u00FAnicas en todo el sistema</li><li>Las organizaciones, los tipos de elemento y las \u00E1reas tem\u00E1ticas ya deben existir en el sistema</li></ul>
