<div class="o_curriculum_widget_catalog_cards">
	<div class="o_curriculum_widget_catalog_card $internalCss">
		<div class="o_catalog_name">$r.translate("access.status.intern")</div>
		<div class="o_catalog_status"><i class="o_icon o_icon-fw $internalIconCss"> </i> $internalLabelName</div>
	</div>
	#if($externalCss)
		<div class="o_curriculum_widget_catalog_card $externalCss">
			<div class="o_catalog_name">$r.translate("access.status.extern")</div>
			<div class="o_catalog_status"><i class="o_icon o_icon-fw $externalIconCss"> </i> $externalLabelName</div>
		</div>
	#end
</div>
