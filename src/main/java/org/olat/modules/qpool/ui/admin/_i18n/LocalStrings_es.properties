admin.configuration.title=Banco de preguntas
admin.levels.intro=Cree los niveles disponibles que tengan sentido para su nivel de formaci\u00F3n. Ejemplos de niveles en un contexto escolar son\: primaria, secundaria, bachillerato, grado, m\u00E1ster. En un contexto empresarial, los niveles podr\u00EDan ser\: sin formaci\u00F3n profesional, con formaci\u00F3n profesional, funci\u00F3n directiva, administraci\u00F3n, mandos, direcci\u00F3n
admin.licenses.intro=Cree tipos de licencia adicionales si los tipos de licencia est\u00E1ndar de OpenOlat no son suficientes. Los tipos de licencia est\u00E1ndar no se pueden eliminar.
admin.pool.manager.title=Derechos de los gestores de pools
admin.pools.intro=Cree uno o varios pools de preguntas. Un pool es una base de datos de preguntas que est\u00E1 a disposici\u00F3n de todos los autores del sistema para el intercambio de preguntas (p\u00FAblico). Opcionalmente, un pool tambi\u00E9n se puede limitar a unos pocos autores, por ejemplo, el personal de un departamento (no p\u00FAblico).
