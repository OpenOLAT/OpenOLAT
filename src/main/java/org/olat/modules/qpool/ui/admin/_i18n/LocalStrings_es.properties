lower.limit.desc=Con el m\u00E9todo de valoraci\u00F3n "L\u00EDmite inferior", una pregunta pasa al estado "$org.olat.modules.qpool.ui\:lifecycle.status.finalVersion" cuando se alcanza el n\u00FAmero m\u00EDnimo de evaluaciones y todas las evaluaciones son superiores o iguales al l\u00EDmite inferior. Si una evaluaci\u00F3n est\u00E1 por debajo del l\u00EDmite inferior, el estado de la pregunta pasa inmediatamente a "$org.olat.modules.qpool.ui\:lifecycle.status.revised", aunque todav\u00EDa no se haya alcanzado el n\u00FAmero m\u00EDnimo de evaluaciones.
