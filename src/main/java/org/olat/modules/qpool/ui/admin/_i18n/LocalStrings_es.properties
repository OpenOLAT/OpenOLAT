admin.studyfields.intro=Las \u00E1reas tem\u00E1ticas sirven para indexar las preguntas por materia. Se trata de una estructura jer\u00E1rquica que, por lo general, refleja los posibles programas de estudio. Seleccione el bot\u00F3n "$org.olat.modules.taxonomy.ui\:add.taxonomy.level" para a\u00F1adir una nueva \u00E1rea tem\u00E1tica. Seleccione un \u00E1rea tem\u00E1tica existente para editarla.
admin.types.intro=Cree tipos de pregunta adicionales si los tipos de pregunta est\u00E1ndar de OpenOlat no son suficientes. Los tipos de pregunta est\u00E1ndar no se pueden eliminar. 
