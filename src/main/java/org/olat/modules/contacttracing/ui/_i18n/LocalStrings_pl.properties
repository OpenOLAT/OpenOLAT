contact.tracing.registration.intro=<p>Zamierzasz zarejestrowa\u0107 swoj\u0105 obecno\u015B\u0107 w nast\u0119puj\u0105cym miejscu. Ten proces rejestracji opiera si\u0119 na wymogach ustawy o pandemii.</p>\r\n<p>Twoje dane s\u0105 przechowywane prywatnie i nie s\u0105 powi\u0105zane z Twoim kontem.</p>\r\n<p>Twojej obecno\u015Bci nie mog\u0105 sprawdzi\u0107 wyk\u0142adowcy ani administracja kursu. <br />Raporty mog\u0105 by\u0107 tworzone wy\u0142\u0105cznie na wniosek upowa\u017Cnionych przedstawicieli w\u0142adz. <br />Wszystkie zarejestrowane dane s\u0105 automatycznie usuwane po {0} dniach.</p> {1}
