contact.tracing.locations.import.instructions=<p>Aby zaimportowa\u0107 lokalizacje do \u015Bledzenia kontakt\u00F3w, pobierz szablon udost\u0119pniony poni\u017Cej, wype\u0142nij go, zaznacz i skopiuj wszystkie wiersze opr\u00F3cz wiersza nag\u0142\u00F3wka, a nast\u0119pnie wklej je poni\u017Cej w polu tekstowym.</p><p>Dost\u0119pne s\u0105 nast\u0119puj\u0105ce opcje. Wa\u017Cne jest, aby zachowa\u0107 dok\u0142adnie tak\u0105 kolejno\u015B\u0107 kolumn, jaka jest.</p><ul><li>Odniesienie</li><li>Tytu\u0142</li><li>Budynek</li><li>Sala</li><li>Sektor</li><li>St\u00F3\u0142</li><li>Miejsce (je\u015Bli jest dost\u0119pne dla tej lokalizacji, wpisz "{0}", w przeciwnym razie "{1}")</li><li>Go\u015B\u0107 (je\u015Bli lokalizacja jest dost\u0119pna dla go\u015Bci, wpisz "{2}", w przeciwnym razie "{3}")</li><li>QR ID (opcjonalnie, pozostaw to pole puste, je\u015Bli ID maj\u0105 by\u0107 generowane automatycznie)</li><li>Tekst QR (opcjonalnie, wpisz HTML, aby sformatowa\u0107 tekst)</li></ul><p>Mo\u017Cesz r\u00F3wnie\u017C zmieni\u0107 istniej\u0105ce lokalizacje. Je\u015Bli lokalizacja ju\u017C istnieje w systemie, w nast\u0119pnym kroku zostanie oznaczona tr\u00F3jk\u0105tem ostrzegawczym.</p>
