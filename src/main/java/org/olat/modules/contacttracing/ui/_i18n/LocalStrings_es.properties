contact.tracing.registration.intro=<p>Est\u00E1 a punto de registrar su presencia en la siguiente ubicaci\u00F3n. Este proceso de registro se basa en los requisitos de la ley de pandemias.</p>\r\n<p>Sus datos se almacenan de forma privada y no est\u00E1n vinculados a su cuenta.</p>\r\n<p>Ni los docentes ni la administraci\u00F3n del curso pueden consultar su presencia. <br />Los informes solo pueden generarse a petici\u00F3n de representantes autorizados de las autoridades. <br />Todos los datos registrados se eliminan autom\u00E1ticamente despu\u00E9s de {0} d\u00EDas.</p> {1}
