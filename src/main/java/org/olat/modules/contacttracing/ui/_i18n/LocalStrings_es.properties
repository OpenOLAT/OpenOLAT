contact.tracing.locations.import.instructions=<p>Para importar ubicaciones para el rastreo de contactos, descargue la plantilla que se proporciona a continuaci\u00F3n, rell\u00E9nela, seleccione y copie todas las filas excepto la fila de encabezado y p\u00E9guelas abajo en el campo de texto.</p><p>Est\u00E1n disponibles las siguientes opciones. Es importante mantener el orden de las columnas exactamente como est\u00E1.</p><ul><li>Referencia</li><li>T\u00EDtulo</li><li>Edificio</li><li>Sala</li><li>Sector</li><li>Mesa</li><li>Asiento (si est\u00E1 disponible para esta ubicaci\u00F3n, escriba "{0}"; en caso contrario, "{1}")</li><li>Invitado (si est\u00E1 disponible para invitados, escriba "{2}"; en caso contrario, "{3}")</li><li>ID QR (opcional, deje este campo vac\u00EDo si desea generar los ID autom\u00E1ticamente)</li><li>Texto QR (opcional, introduzca HTML para dar formato a su texto)</li></ul><p>Tambi\u00E9n puede modificar ubicaciones existentes. Si una ubicaci\u00F3n ya existe en el sistema, se marcar\u00E1 con un tri\u00E1ngulo de advertencia en el paso siguiente.</p>
