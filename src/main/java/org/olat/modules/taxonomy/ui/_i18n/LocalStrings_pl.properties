import.taxonomy.step1.desc=<p>Wa\u017Cne jest dok\u0142adne zachowanie kolejno\u015Bci kolumn. Dane oznaczone gwiazdk\u0105 s\u0105 obowi\u0105zkowe.</p><p><ul><li><strong>\u015Acie\u017Cka *</strong></li><li><strong>Oznaczenie *</strong></li><li>Typ</li><li>Sortowanie</li><li><strong>J\u0119zyk *</strong></li><li><strong>Tytu\u0142 *</strong></li><li>Opis</li></ul></p><p>Pami\u0119taj, \u017Ce je\u015Bli chcesz zaimportowa\u0107 poziomy, kt\u00F3re s\u0105 elementami podrz\u0119dnymi innych, element nadrz\u0119dny musi ju\u017C istnie\u0107 lub zosta\u0107 zaimportowany w dowolnym wierszu przed elementem podrz\u0119dnym. Pomocne jest posortowanie importowanych danych wed\u0142ug \u015Bcie\u017Cki.</p>
