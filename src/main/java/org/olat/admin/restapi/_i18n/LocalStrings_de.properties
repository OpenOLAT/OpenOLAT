ratelimit.intro=Begrenzt die Anzahl Anfragen pro Benutzer{in} und pro IP-Adresse. Eine Anfrage \u00FCber der Limite erh\u00E4lt den HTTP-Status 429 mit dem Header Retry-After. Jede abgewiesene Anfrage wird im Audit-Log protokolliert, wenn es eingeschaltet ist. Im Cluster z\u00E4hlt jeder Knoten separat: Die wirksame Limite ist der konfigurierte Wert mal die Anzahl Knoten. Ausgenommen sind /restapi/ping, /restapi/i18n und /restapi/system f\u00FCr freigegebene IP-Adressen.
ratelimit.max.parallel=Maximale parallele Anfragen pro Benutzer{in}
ratelimit.per.node.hint=Wird pro Knoten gez\u00E4hlt. Im Cluster ist die wirksame Limite dieser Wert mal die Anzahl Knoten.
