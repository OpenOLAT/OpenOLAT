ratelimit.intro=Obmedzuje po\u010Det po\u017Eiadaviek na pou\u017E\u00EDvate\u013Ea a na IP adresu. Po\u017Eiadavka nad limitom dostane stav HTTP 429 s hlavi\u010Dkou Retry-After. Ka\u017Ed\u00E1 odmietnut\u00E1 po\u017Eiadavka sa zaznamen\u00E1 v auditnom protokole, ak je zapnut\u00FD. V klastri po\u010D\u00EDta ka\u017Ed\u00FD uzol samostatne: \u00FA\u010Dinn\u00FD limit je nakonfigurovan\u00E1 hodnota vyn\u00E1soben\u00E1 po\u010Dtom uzlov. V\u00FDnimku maj\u00FA /restapi/ping, /restapi/i18n a /restapi/system pre povolen\u00E9 IP adresy.
