managed.info=Divers objets (par exemple des cours et des groupes) peuvent \u00EAtre cr\u00E9\u00E9s via l'API REST. Ces objets g\u00E9r\u00E9s en externe sont dits "g\u00E9r\u00E9s" car un syst\u00E8me externe est responsable de leur cycle de vie. Pour le calendrier, il existe \u00E9galement des objets g\u00E9r\u00E9s en interne (par exemple, des \u00E9v\u00E9nements de calendrier provenant de projets et d'\u00E9l\u00E9ments de cours). Cette fonctionnalit\u00E9 peut \u00EAtre activ\u00E9e/d\u00E9sactiv\u00E9e dans les cases \u00E0 cocher ci-dessous.
