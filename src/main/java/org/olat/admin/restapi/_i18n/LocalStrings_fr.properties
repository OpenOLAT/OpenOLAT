ratelimit.intro=Limite le nombre de requ\u00EAtes par utilisateur{rice} et par adresse IP. Une requ\u00EAte au-del\u00E0 de la limite re\u00E7oit le statut HTTP 429 avec l'en-t\u00EAte Retry-After. Chaque requ\u00EAte refus\u00E9e est enregistr\u00E9e dans le journal d'audit si celui-ci est activ\u00E9. Dans un cluster, chaque n\u0153ud compte s\u00E9par\u00E9ment: la limite effective correspond \u00E0 la valeur configur\u00E9e multipli\u00E9e par le nombre de n\u0153uds. Sont exempt\u00E9s /restapi/ping, /restapi/i18n et /restapi/system pour les adresses IP autoris\u00E9es.
ratelimit.max.parallel=Nombre maximal de requ\u00EAtes parall\u00E8les par utilisateur{rice}
ratelimit.per.node.hint=Compt\u00E9 par n\u0153ud. Dans un cluster, la limite effective correspond \u00E0 cette valeur multipli\u00E9e par le nombre de n\u0153uds.
