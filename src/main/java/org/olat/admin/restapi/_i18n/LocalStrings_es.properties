ratelimit.intro=Limita el n\u00FAmero de solicitudes por usuario y por direcci\u00F3n IP. Una solicitud que supera el l\u00EDmite recibe el estado HTTP 429 con la cabecera Retry-After. Cada solicitud rechazada se registra en el registro de auditor\u00EDa si est\u00E1 activado. En un cl\u00FAster, cada nodo cuenta por separado: el l\u00EDmite efectivo es el valor configurado multiplicado por el n\u00FAmero de nodos. Quedan exentos /restapi/ping, /restapi/i18n y /restapi/system para las direcciones IP autorizadas.
ratelimit.max.parallel=N\u00FAmero m\u00E1ximo de solicitudes paralelas por usuario
ratelimit.per.node.hint=Se cuenta por nodo. En un cl\u00FAster, el l\u00EDmite efectivo es este valor multiplicado por el n\u00FAmero de nodos.
