managed.info=Diversos objetos (p. ej., cursos y grupos) se pueden crear mediante la REST API. Estos objetos gestionados externamente se denominan "managed", ya que un sistema externo es responsable de su ciclo de vida. Para el calendario existen adem\u00E1s objetos gestionados internamente (p. ej., citas del calendario procedentes de proyectos y elementos del curso). Esta funcionalidad se puede activar/desactivar con las casillas de verificaci\u00F3n siguientes.
