ratelimit.intro=Limita il numero di richieste per utente e per indirizzo IP. Una richiesta oltre il limite riceve lo stato HTTP 429 con l'header Retry-After. Ogni richiesta rifiutata viene registrata nel registro di audit, se \u00E8 attivato. In un cluster ogni nodo conta separatamente: il limite effettivo \u00E8 il valore configurato moltiplicato per il numero di nodi. Sono esclusi /restapi/ping, /restapi/i18n e /restapi/system per gli indirizzi IP autorizzati.
