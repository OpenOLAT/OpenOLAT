managed.info=Vari oggetti (ad esempio, corsi e gruppi) possono essere creati tramite API REST. Questi oggetti gestiti esternamente sono detti \u201Cgestiti\u201D in quanto un sistema esterno \u00E8 responsabile del loro ciclo di vita. Per il calendario, ci sono anche oggetti gestiti internamente (ad esempio, eventi di calendario da progetti ed elementi di corsi). Questa funzionalit\u00E0 pu\u00F2 essere attivata/disattivata nelle caselle di controllo sottostanti.
