statistics.fullrecalculation.really.text=Con el rec\u00E1lculo completo se <b>eliminan y se vuelven a calcular todos los datos estad\u00EDsticos existentes</b>\! Por ello pueden perderse datos si entretanto se han eliminado datos antiguos de la tabla de logging\!<p/><p/>El rec\u00E1lculo completo puede durar mucho tiempo (de minutos a horas) y provocar que <b>temporalmente los datos estad\u00EDsticos</b> para los usuarios <b>no est\u00E9n disponibles</b>\!
statistics.fullrecalculation.really.title=\u00BFDesea realmente recalcular todo por completo?
statistics.fullrecalculation.trigger.button=Recalcular las estad\u00EDsticas por completo
statistics.generation.feedback=La generaci\u00F3n de estad\u00EDsticas ha finalizado.
statistics.info=Las estad\u00EDsticas se generan de nuevo peri\u00F3dicamente a partir de los datos de logging en el nodo single-service. La frecuencia de esta generaci\u00F3n determina la actualidad de las estad\u00EDsticas de cada curso.
statistics.lastupdated=La \u00FAltima generaci\u00F3n de estad\u00EDsticas se inici\u00F3 el <i>{0}</i>.
statistics.lastupdated.never=La generaci\u00F3n de estad\u00EDsticas no se ha iniciado nunca.
statistics.status.disabled=La generaci\u00F3n autom\u00E1tica de estad\u00EDsticas est\u00E1 <strong>desactivada</strong> en este momento (en este nodo).
statistics.status.enabled=La generaci\u00F3n autom\u00E1tica de estad\u00EDsticas est\u00E1 <strong>activada</strong> en este momento y se inicia seg\u00FAn la siguiente regla "<strong>{0}</strong>" (sintaxis cron).
statistics.status.title=Estado
statistics.title=Estad\u00EDsticas
statistics.update.intro=Hay dos variantes para actualizar las estad\u00EDsticas\: el rec\u00E1lculo completo y la actualizaci\u00F3n incremental. El rec\u00E1lculo completo puede durar mucho tiempo; la actualizaci\u00F3n incremental es relativamente r\u00E1pida.
statistics.update.ongoing=Las estad\u00EDsticas se est\u00E1n actualizando...
statistics.update.title=Actualizar estad\u00EDsticas
statistics.update.trigger.button=Actualizar las estad\u00EDsticas de forma incremental
