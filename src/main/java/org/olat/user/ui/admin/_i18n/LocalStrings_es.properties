organisations.intro=Las organizaciones permiten situar contenidos did\u00E1cticos, cuentas de acceso y otros objetos en un contexto organizativo. A ellas est\u00E1n vinculados los roles y los permisos y, por tanto, la visibilidad de estos objetos. Las organizaciones reproducen algunas funciones de un sistema multicliente, pero, a diferencia de este, forman un sistema permeable. Por ejemplo, los cursos se pueden publicar para varias organizaciones a la vez.
