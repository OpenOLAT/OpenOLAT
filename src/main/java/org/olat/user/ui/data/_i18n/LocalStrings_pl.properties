export.user.data.ready.text=<p>Jako mened\u017Cer u\u017Cytkownik\u00F3w w OpenOlat wykonano eksport danych osobowych dla konta "{0}". Dane zosta\u0142y wygenerowane i s\u0105 dost\u0119pne dla u\u017Cytkownika w jego obszarze osobistym w OpenOlat.</p><p>Poni\u017Cszy link zapewnia bezpo\u015Bredni dost\u0119p do eksportu\: <a href\="{1}">{1}</a><br>Mo\u017Cesz przekaza\u0107 ten link osobie, kt\u00F3rej dotycz\u0105 dane.</p><p>Wa\u017Cne\: te dane mo\u017Ce wy\u015Bwietli\u0107 TYLKO ta osoba, a nie inni u\u017Cytkownicy systemu. R\u00F3wnie\u017C Ty w roli mened\u017Cera u\u017Cytkownik\u00F3w nie masz dost\u0119pu do danych osobowych tej osoby.</p>
