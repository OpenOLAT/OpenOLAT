export.user.data.explain=Wybierz elementy, kt\u00F3re maj\u0105 zosta\u0107 wyeksportowane dla tego konta. Eksport mo\u017Ce potrwa\u0107 kilka godzin. Po zako\u0144czeniu eksportu otrzymasz powiadomienie e-mail.
