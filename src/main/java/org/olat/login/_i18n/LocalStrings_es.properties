about.financing.intro=El sistema open source OpenOlat lo desarrolla y financia <a href\="http\://www.frentix.com" target\="_blank"><i class\="o_icon o_icon_link_extern"> </i> frentix GmbH</a> en colaboraci\u00F3n con los socios de OpenOlat. Usted tambi\u00E9n puede contribuir al futuro de OpenOlat apoy\u00E1ndolo econ\u00F3micamente. 
about.history=El sistema de gesti\u00F3n del aprendizaje OpenOlat se desarrolla en la comunidad OpenOlat desde 2011. OpenOlat es un fork del LMS open source OLAT de la Universidad de Z\u00FArich y se utiliza en todo el mundo en instituciones educativas y empresas. OpenOlat es un producto open source y se puede utilizar y modificar libremente.
