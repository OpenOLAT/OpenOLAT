about.elearningjournal.test.2015=La prestigiosa revista eLearning-Journal ha calificado el LMS OpenOlat con la menci\u00F3n "muy bueno" en una amplia prueba comparativa de LMS. Con ello, OpenOlat se sit\u00FAa entre los primeros. Se destac\u00F3 especialmente la gran cantidad de funciones de la soluci\u00F3n open source OpenOlat.
