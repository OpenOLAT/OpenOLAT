about.elearningjournal.test.2015=Renomowany eLearning-Journal oceni\u0142 LMS OpenOlat w obszernym te\u015Bcie por\u00F3wnawczym system\u00F3w LMS na "bardzo dobry". Dzi\u0119ki temu OpenOlat znajduje si\u0119 w \u015Bcis\u0142ej czo\u0142\u00F3wce. Szczeg\u00F3lnie podkre\u015Blono du\u017Cy zakres funkcji rozwi\u0105zania open source OpenOlat.
