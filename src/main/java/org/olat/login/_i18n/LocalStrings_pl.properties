about.history=System zarz\u0105dzania nauczaniem OpenOlat jest rozwijany przez spo\u0142eczno\u015B\u0107 OpenOlat od 2011 roku. OpenOlat jest forkiem LMS open source OLAT Uniwersytetu w Zurychu i jest u\u017Cywany na ca\u0142ym \u015Bwiecie w instytucjach edukacyjnych i firmach. OpenOlat jest produktem open source i mo\u017Cna go swobodnie u\u017Cywa\u0107 i modyfikowa\u0107.
