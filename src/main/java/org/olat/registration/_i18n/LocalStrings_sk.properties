set.login.credentials.body=<p>Dobr\u00FD de\u0148, {0}</p><p>Pre v\u00E1\u0161 \u00FA\u010Det OpenOlat \u201E{1}\u201C boli vy\u017Eiadan\u00E9 nov\u00E9 prihlasovacie \u00FAdaje.</p><p>Kliknite na nasleduj\u00FAci odkaz a nastavte si prihlasovacie \u00FAdaje\: <a href\="{2}">Nastavi\u0165 prihlasovacie \u00FAdaje</a><br>Po aktualiz\u00E1cii sa m\u00F4\u017Eete <a href\="{3}">prihl\u00E1si\u0165 do syst\u00E9mu OpenOlat</a>.<br><br>Ak ste o t\u00FAto zmenu ne\u017Eiadali, tento e-mail m\u00F4\u017Eete ignorova\u0165. Va\u0161e s\u00FA\u010Dasn\u00E9 prihlasovacie \u00FAdaje zostan\u00FA v takom pr\u00EDpade nezmenen\u00E9.</p>
