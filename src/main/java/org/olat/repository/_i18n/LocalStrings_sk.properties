wizard.hint=Tieto nastavenia je mo\u017En\u00E9 zmeni\u0165 aj nesk\u00F4r.
wizard.step2.attention=<b>UPOZORNENIE\:</b> Po v\u00FDbere mo\u017Enosti "Odstr\u00E1ni\u0165 v\u0161etk\u00FDch t\u00FAtorov a \u00FA\u010Dastn\u00EDkov z u\u010Debn\u00FDch a spr\u00E1vnych skup\u00EDn tohto kurzu" t\u00FAtori, ako aj \u00FA\u010Dastn\u00EDci v\u00E1\u0161ho kurzu u\u017E nemusia ma\u0165 pr\u00EDstup k cel\u00E9mu obsahu kurzu. \u00DA\u010Dastn\u00EDci kurzu si u\u017E nebud\u00FA m\u00F4c\u0165 prezera\u0165 napr. v\u00FDsledky svojich testov prostredn\u00EDctvom hodnotiaceho n\u00E1stroja v\u00E1\u0161ho kurzu.
wizard.step3.mail.body=*** Toto je automaticky generovan\u00E1 spr\u00E1va. Na tento e-mail neodpovedajte\! *** Kurz {0} bol ozna\u010Den\u00FD ako zru\u0161en\u00FD osobou s pr\u00E1vami na spr\u00E1vu kurzu, {1}. Kurz u\u017E nie je spravovan\u00FD ani aktualizovan\u00FD. Ak ste sa prihl\u00E1sili na odber jednotliv\u00FDch prvkov kurzu, m\u00F4\u017Eete sa z nich odhl\u00E1si\u0165 vo svojom domovskom syst\u00E9me OpenOlat v \u013Eavom menu v \u010Dasti "Ozn\u00E1menia". Va\u0161e \u010Dlenstvo v skupine tohto kurzu mohlo by\u0165 zru\u0161en\u00E9. Ak m\u00E1te \u010Fal\u0161ie ot\u00E1zky t\u00FDkaj\u00FAce sa tohto procesu, obr\u00E1\u0165te sa na lektora kurzu {1}.
wizard.step3.mail.subject=[OpenOlat] Kurz {0} bol ukon\u010Den\u00FD
wizard.velocity.step1.par1=\u010Co znamen\u00E1 funkcia "Deaktivova\u0165"?
wizard.velocity.step1.par2=Pomocou tohto sprievodcu nastavte stav tohto kurzu na <b>[deaktivovan\u00FD]</b>. T\u00FDm informujete \u00FA\u010Dastn\u00EDkov kurzu, \u017Ee tento kurz sa u\u017E nebude upravova\u0165 a aktualizova\u0165.
wizard.velocity.step1.par3=Ak\u00E9 s\u00FA \u010Fal\u0161ie mo\u017Enosti?
wizard.velocity.step1.par3a=V kroku 2 sprievodcu m\u00F4\u017Eete <b>vymaza\u0165 v\u0161etky polo\u017Eky katal\u00F3gu tohto kurzu</b> a <b>odstr\u00E1ni\u0165 v\u0161etk\u00FDch lektorov a \u00FA\u010Dastn\u00EDkov z pr\u00EDslu\u0161n\u00FDch vzdel\u00E1vac\u00EDch a spr\u00E1vnych skup\u00EDn</b>.
wizard.velocity.step1.par3b=V kroku 3 sprievodcu m\u00F4\u017Eete <b>informova\u0165 v\u0161etk\u00FDch lektorov a \u00FA\u010Dastn\u00EDkov vzdel\u00E1vac\u00EDch a spr\u00E1vnych skup\u00EDn</b> v tomto kurze, \u017Ee ho pl\u00E1nujete deaktivova\u0165 <b>prostredn\u00EDctvom e-mailu</b>.
wizard.velocity.step1.par4=\u010Co sp\u00F4sobuje funkcia "Ukon\u010Di\u0165"?
wizard.velocity.step1.par4a=Konfigur\u00E1cia kurzu (nastavenia kurzu, vidite\u013Enos\u0165 a pravidl\u00E1 pr\u00EDstupu) zost\u00E1va nezmenen\u00E1.
wizard.velocity.step1.par4b=V\u0161etci opr\u00E1vnen\u00ED u\u017E\u00EDvatelia bud\u00FA ma\u0165 st\u00E1le pr\u00EDstup k obsahu kurzu pod\u013Ea svojich individu\u00E1lnych pr\u00E1v.<br /><b>POZOR\:</b> V\u00FDberom mo\u017Enosti \u201EOdstr\u00E1ni\u0165 v\u0161etk\u00FDch lektorov a \u00FA\u010Dastn\u00EDkov z u\u010Debn\u00FDch a spr\u00E1vnych skup\u00EDn tohto kurzu\u201C u\u017E nebude m\u00F4c\u0165 kontrolova\u0165 v\u00FDsledky testov \u00FA\u010Dastn\u00EDkov kurzu at\u010F. prostredn\u00EDctvom hodnotiaceho n\u00E1stroja.
wizard.velocity.step1.par4c=V\u0161etky \u00FAdaje pou\u017E\u00EDvate\u013Eov a \u00FAdaje o \u010Dinnosti (napr. pr\u00EDspevky vo f\u00F3rach a Wiki) zostan\u00FA zachovan\u00E9 a na\u010Falej sa daj\u00FA otv\u00E1ra\u0165 a upravova\u0165. <br>
wizard.velocity.step1.par4d=V\u0161etky odkazy na z\u00E1lo\u017Eky tohto kurzu zobrazuj\u00FA stav [dokon\u010Den\u00E9].
wizard.velocity.step1.par4e=<b>POZOR\: Zmenu stavu kurzu <b>nie je mo\u017En\u00E9 vr\u00E1ti\u0165</b> sp\u00E4\u0165.</b>
