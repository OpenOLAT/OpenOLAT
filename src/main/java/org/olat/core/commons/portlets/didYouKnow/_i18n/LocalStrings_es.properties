A-0=Mediante 'Grupos' puedes crear un grupo de colaboraci\u00F3n que te proporcione la posibilidad de intercambiar documentos o utilizar un foro.
A-1=Cada foro contiene el enlace 'suscribirse' en la p\u00E1gina de vista r\u00E1pida. Al seleccionar \u00E9ste se te notificar\u00E1n todas las modificaciones en este foro mediante e-mail sin tener que entrar en OpenOlat.
A-10=Pincha en el enlace "Otros usuarios" en la p\u00E1gina principal y busca la persona que quieres contactar. Tienes la posibilidad de ver la tarjeta de la persona as\u00ED como su carpeta p\u00FAblica personal o ponerte en contacto mediante E-Mail.
A-11=Pon estos documentos en tu carpeta personal, en la carpeta llamada "p\u00FAblico". Los otros usuarios podr\u00E1n encontrar estos documentos pinchando en "Otros usuarios" y seleccionando tu nombre.
A-12=OpenOlat trabaja igual que, por ejemplo una aplicaci\u00F3n de banca por internet\: Utilizando el bot\u00F3n Atr\u00E1s en tu navegador puedes ocasionar problemas. Por favor utiliza la navegaci\u00F3n propia de OpenOlat para ir donde quieras.
A-13=Utiliza el icono peque\u00F1o con la marca de interrogaci\u00F3n donde lo necesites; Te proporcionar\u00E1 informaci\u00F3n importante.
A-14=En la vista detallada de un curso, en el \u00E1rea 'Informaci\u00F3n sobre la entrada', en 'Enlace externo a este recurso did\u00E1ctico', se indica el enlace directo al curso.
A-15=Los elementos del curso como p\u00E1ginas individuales, el foro y el wiki se pueden mostrar en una ventana nueva y, al mismo tiempo, navegar a otro lugar de OpenOlat en la ventana principal.
A-16=Con la estrella verde de la cabecera puede cambiar su estado de mensajer\u00EDa instant\u00E1nea. As\u00ED puede mostrar f\u00E1cilmente si est\u00E1 disponible y de qu\u00E9 forma. Puede elegir entre 'Disponible', 'Me gustar\u00EDa chatear', 'Ausente', 'Ausente por m\u00E1s tiempo', 'No molestar' o 'No disponible'.
A-17=Junto a la estrella verde de la cabecera se muestra entre par\u00E9ntesis cu\u00E1ntos conocidos de sus grupos est\u00E1n disponibles en el chat. Si hace clic, se abre la selecci\u00F3n de conocidos de sus grupos que est\u00E1n en l\u00EDnea en ese momento. Tambi\u00E9n puede mostrarlos por pertenencia a un grupo.
A-18=En la vista del curso, a la derecha en el cuadro 'General', tiene la funci\u00F3n 'A\u00F1adir marcador'. Puede consultar todos sus marcadores reunidos en Inicio. Desde all\u00ED puede abrir los cursos c\u00F3modamente.
A-19=As\u00ED puede buscar de forma espec\u00EDfica en el texto, la descripci\u00F3n, el t\u00EDtulo o los metadatos, por autores o fecha (fecha de creaci\u00F3n, \u00FAltima modificaci\u00F3n) de un recurso did\u00E1ctico, as\u00ED como en \u00E1reas, tipos de documento o tipos de archivo.
A-2=Cada carpeta contiene el enlace 'suscribirse' en la p\u00E1gina de vista r\u00E1pida. Al seleccionar \u00E9ste se te notificar\u00E1n todas las modificaciones en esta carpeta mediante e-mail sin tener que entrar en OpenOlat.
A-20=Seleccione el calendario de un curso a la derecha en el cuadro 'General' o, si existe, el elemento del curso Calendario. Con el bot\u00F3n 'A\u00F1adir al calendario personal' puede mostrarlo en su calendario en Inicio.
A-21=En Inicio, en 'Opciones', pesta\u00F1a 'Sistema', puede configurar si desea recibir las novedades por e-mail, p. ej. 'Diariamente', 'Semanalmente' o 'Mensualmente'. All\u00ED tambi\u00E9n puede cancelarlas seleccionando 'Nunca'.
A-22=En 'Suscripciones' puede consultar los cambios de los recursos a los que est\u00E1 suscrito como lista o feed RSS y gestionar sus suscripciones. Cada novedad est\u00E1 enlazada con el recurso correspondiente y lleva directamente a \u00E9l. De forma predeterminada se muestran las notificaciones de las \u00FAltimas 24 horas. Sin embargo, aqu\u00ED tambi\u00E9n puede mostrar los cambios desde una fecha determinada. En el feed RSS se muestran las notificaciones de los \u00FAltimos 30 d\u00EDas.
A-3=Selecciona el enlace RSS en tu p\u00E1gina principal o m\u00E1rcalo. Permanece informado. Siempre.
A-4=OpenOlat ofrece una completa soluci\u00F3n de e-portfolio. Con la herramienta de recopilaci\u00F3n re\u00FAne sus artefactos personales y los agrupa en un archivador de portfolio para otros usuarios. Tambi\u00E9n son posibles los portfolios de grupo y las tareas de portfolio.   
A-5=OpenOlat se puede descargar gratis en <a href\="http\://www.openolat.org" target\="_blank">www.openolat.org</a>. Existen listas de correo as\u00ED como otras informaciones t\u00E9cnicas secundarias sobre el Sistema de Aprendizaje OpenOlat.
A-6=OpenOlat significa <b>O</b>line <b>L</b>earning <b>A</b>nd <b>T</b>raining. OpenOlat es un Sistema de Administraci\u00F3n de Aprendizaje de c\u00F3digo abierto. Es la aplicaci\u00F3n con la que est\u00E1s trabajando ahora mismo.
A-7=Pincha el enlace "Configurar p\u00E1gina" en "Inicio" y puedes modificar y seleccionar la disposici\u00F3n de las casillas.
A-8=Pincha en "Opciones" en la p\u00E1gina de inicio y selecciona la pesta\u00F1a "Mi tarjeta de visita". Puedes determinar qu\u00E9 informaci\u00F3n ser\u00E1 visible para los otros usuarios OpenOlat. Adem\u00E1s tienes la posibilidad de subir una imagen y crear un texto corto.
A-9=Puedes almacenar documentos en tu carpeta personal que puedes utilizar cuando quieras. OpenOlat te proporciona 10 MB para este prop\u00F3sito.
