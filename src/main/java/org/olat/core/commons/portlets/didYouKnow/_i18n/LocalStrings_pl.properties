A-0=U\u017Cywaj\u0105c zak\u0142adki "Grupy" mo\u017Cesz utworzy\u0107 tzw. grup\u0119 projekt\u00F3w i umie\u015Bci\u0107 w niej narz\u0119dzia wsp\u00F3\u0142pracy jak np. folder, forum czy portal Wiki.
A-1=Na stronie g\u0142\u00F3wnej ka\u017Cdego forum widnieje link "Subskrybuj". Aktywuj\u0105c subskrypcj\u0119 b\u0119dziesz informowany o zmianach na tym forum m.in. poprzez e-mail.
A-10=U\u017Cywaj\u0105c zak\u0142adki "Grupy" mo\u017Cesz utworzy\u0107 tzw. grup\u0119 projekt\u00F3w i umie\u015Bci\u0107 w niej narz\u0119dzie wsp\u00F3\u0142pracy jak np. folder, forum czy portal Wiki.
A-11=Umie\u015B\u0107 dokumenty w swoim osobistym folderze, w sekcji "public". Od tej chwili pozostali u\u017Cytkownicy b\u0119d\u0105 mogli je przegl\u0105da\u0107.
A-12=OpenOlat jest aplikacj\u0105 dzia\u0142aj\u0105c\u0105 w przegl\u0105darce internetowej i posiada w\u0142asny system nawigacji, dlatego u\u017Cywanie przycisk\u00F3w "Wstecz" i "Od\u015Bwie\u017C" przegl\u0105darki internetowej mo\u017Ce powodowa\u0107 problemy w trakcie pracy.
A-13=Kliknij w tym celu ikon\u0119 ze znakiem zapytania, a otrzymasz niezb\u0119dne informacje.
A-14=W widoku szczeg\u00F3\u0142owym kursu w obszarze 'Informacje o wpisie' pod 'Link zewn\u0119trzny do tego zasobu edukacyjnego' podany jest bezpo\u015Bredni link do kursu.
A-15=Elementy kursu, takie jak pojedyncze strony, forum i wiki, mo\u017Cna wy\u015Bwietli\u0107 w nowym oknie i jednocze\u015Bnie w oknie g\u0142\u00F3wnym przej\u015B\u0107 do innego miejsca w OpenOlat.
A-16=Za pomoc\u0105 zielonej gwiazdki w nag\u0142\u00F3wku mo\u017Cna zmieni\u0107 status komunikatora. W ten spos\u00F3b \u0142atwo pokaza\u0107, czy i jak jest si\u0119 dost\u0119pnym. Do wyboru s\u0105 'Dost\u0119pny', 'Chc\u0119 porozmawia\u0107', 'Nieobecny', 'D\u0142u\u017Cej nieobecny', 'Nie przeszkadza\u0107' lub 'Niedost\u0119pny'.
A-17=Obok zielonej gwiazdki w nag\u0142\u00F3wku w nawiasie wy\u015Bwietlana jest liczba znajomych z grup, kt\u00F3rzy s\u0105 dost\u0119pni na czacie. Po klikni\u0119ciu otwiera si\u0119 lista znajomych z grup, kt\u00F3rzy s\u0105 aktualnie online. Mo\u017Cna ich tak\u017Ce wy\u015Bwietli\u0107 wed\u0142ug przynale\u017Cno\u015Bci do grup.
A-18=W widoku kursu po prawej stronie w polu 'Og\u00F3lne' dost\u0119pna jest funkcja 'Ustaw zak\u0142adk\u0119'. Wszystkie zak\u0142adki mo\u017Cna zebrane przegl\u0105da\u0107 na stronie g\u0142\u00F3wnej. Stamt\u0105d mo\u017Cna wygodnie otwiera\u0107 kursy.
A-19=Mo\u017Cna w ten spos\u00F3b wyszukiwa\u0107 w tek\u015Bcie, opisie, tytule lub metadanych, wed\u0142ug autor\u00F3w lub daty (data utworzenia, ostatnia zmiana) zasobu edukacyjnego, a tak\u017Ce w obszarach, typach dokument\u00F3w lub typach plik\u00F3w.
A-2=Na stronie g\u0142\u00F3wnej ka\u017Cdego folderu widnieje link "Subskrybuj". Aktywuj\u0105c subskrypcj\u0119 b\u0119dziesz informowany o zmianach w tym folderze m.in. poprzez e-mail.
A-20=Wybierz kalendarz kursu po prawej stronie w polu 'Og\u00F3lne' albo, je\u015Bli jest dost\u0119pny, element kursu Kalendarz. Za pomoc\u0105 przycisku 'Dodaj do kalendarza osobistego' mo\u017Cna go nast\u0119pnie wy\u015Bwietli\u0107 w swoim kalendarzu na stronie g\u0142\u00F3wnej.
A-21=Na stronie g\u0142\u00F3wnej w 'Ustawieniach' w zak\u0142adce 'System' mo\u017Cna skonfigurowa\u0107, czy informacje o nowo\u015Bciach maj\u0105 przychodzi\u0107 e-mailem np. 'Codziennie', 'Co tydzie\u0144' lub 'Co miesi\u0105c'. Mo\u017Cna tam r\u00F3wnie\u017C z nich zrezygnowa\u0107, wybieraj\u0105c 'Nigdy'.
A-22=W sekcji 'Subskrypcje' mo\u017Cna przegl\u0105da\u0107 zmiany w subskrybowanych zasobach jako list\u0119 lub kana\u0142 RSS i zarz\u0105dza\u0107 subskrypcjami. Ka\u017Cda nowo\u015B\u0107 jest po\u0142\u0105czona z odpowiednim zasobem i prowadzi bezpo\u015Brednio do niego. Domy\u015Blnie wy\u015Bwietlane s\u0105 powiadomienia z ostatnich 24 godzin. Mo\u017Cna tu jednak r\u00F3wnie\u017C wy\u015Bwietli\u0107 zmiany od okre\u015Blonej daty. W kanale RSS wy\u015Bwietlane s\u0105 powiadomienia z ostatnich 30 dni.
A-3=Kliknij link RSS na swojej stronie g\u0142\u00F3wnej w OpenOlat i dodaj go do zak\u0142adek. B\u0105d\u017A zawsze na bie\u017C\u0105co.
A-4=OpenOlat oferuje kompleksowe rozwi\u0105zania e-portfolio. Z kreatorem mo\u017Cna zebra\u0107 wszystkie osobiste "artefakty" i wykorzysta\u0107 je do stworzenia "teczki" dla innych u\u017Cytkownik\u00F3w. Mo\u017Cliwe jest r\u00F3wnie\u017C tworzenie portfolio grupowych lub zada\u0144 portfolio w kursach.
A-5=Na stronie g\u0142\u00F3wnej, w lewym menu wybierz "Ustawienia", a nast\u0119pnie kliknij w zak\u0142adk\u0119 "Wizyt\u00F3wka". Mo\u017Cesz tam wybra\u0107 dane, kt\u00F3re b\u0119d\u0105 widoczne dla innych u\u017Cytkownik\u00F3w. Ponadto mo\u017Cesz za\u0142adowa\u0107 tam sw\u00F3j obrazek i wpisa\u0107 kr\u00F3tki tekst.
A-6=Mo\u017Cesz przechowywa\u0107 dokumenty w swoim folderze osobistym i mie\u0107 do nich dost\u0119p w ka\u017Cdej chwili.
A-7=Kliknij link "Inni u\u017Cytkownicy" na stronie domowej i wyszukaj interesuj\u0105c\u0105 Ci\u0119 osob\u0119. Opr\u00F3cz wizyt\u00F3wki, mo\u017Cesz tak\u017Ce obejrze\u0107 zawarto\u015B\u0107 folderu publicznego danego u\u017Cytkownika i skontaktowa\u0107 si\u0119 z nim za pomoc\u0105 formularza kontaktowego.
A-8=Umie\u015B\u0107 dokumenty w swoim osobistym folderze, w sekcji "public". Od tej chwili pozostali u\u017Cytkownicy b\u0119d\u0105 mogli je przegl\u0105da\u0107.
A-9=Mo\u017Cesz przechowywa\u0107 dokumenty w folderze osobistym, kt\u00F3ry mo\u017Cna wykorzysta\u0107 w ka\u017Cdej chwili. OpenOlat zapewnia 20 MB przestrzeni dla tego celu.
