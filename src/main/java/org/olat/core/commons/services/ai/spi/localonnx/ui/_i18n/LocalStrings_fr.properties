local.onnx.admin.naming.rule=Le nom du sous-r\u00E9pertoire ne doit contenir que les caract\u00E8res [a-zA-Z0-9_-]. Les autres caract\u00E8res sont supprim\u00E9s automatiquement.
local.onnx.admin.permissions=Les fichiers doivent \u00EAtre lisibles par l'utilisateur du processus OpenOlat (p. ex. chmod 640 model.onnx && chown openolat\:openolat model.onnx).
