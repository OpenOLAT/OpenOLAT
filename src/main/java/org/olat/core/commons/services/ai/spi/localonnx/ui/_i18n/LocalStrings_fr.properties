local.onnx.admin.dir.notconfigured=Le r\u00E9pertoire local des mod\u00E8les n'est pas configur\u00E9. D\u00E9finissez le chemin dans olat.local.properties.
local.onnx.admin.externaldata=Les grands mod\u00E8les (p. ex. Qwen3-Embedding-8B) utilisent le format ONNX External Data\: le fichier .onnx ne contient que des m\u00E9tadonn\u00E9es, les poids se trouvent dans un fichier voisin (p. ex. model.onnx_data). D\u00E9posez le fichier voisin \u00E0 c\u00F4t\u00E9 de model.onnx avec le nom de fichier exact g\u00E9n\u00E9r\u00E9 lors de l'export - cette r\u00E9f\u00E9rence est cod\u00E9e dans le protobuf .onnx.
local.onnx.admin.info.intro=G\u00E9rez les mod\u00E8les d'embedding ONNX locaux. Les mod\u00E8les sont d\u00E9pos\u00E9s directement dans le syst\u00E8me de fichiers du serveur.
