local.onnx.admin.activate=Apr\u00E8s avoir d\u00E9pos\u00E9 les fichiers\: cliquez sur "R\u00E9analyser" pour d\u00E9tecter le mod\u00E8le, puis sur "Valider" pour v\u00E9rifier qu'il se charge correctement.
