<dialog id="callout_$r.getCId()" aria-modal="true" #if($r.isNotEmpty($title))aria-labelledby="callout_title_$r.getCId()" #elseif($r.isNotEmpty($ariaLabel))aria-label="$r.escapeForHtmlAttribute($ariaLabel)" #end class="popover in bottom #if($r.isTrue($wider))o_wide_popover #end" style="z-index:$zindexarea;">
	#if($arrow && ($orientation == "bottom" || $orientation == "bottomOrTop"))<div class="arrow"></div>#end
	#if($r.isNotEmpty($title))
		<div class="popover-title" id="callout_title_$r.getCId()">$r.escapeHtml($title)</div>
	#end
	<div class="popover-content">$r.render("cont")</div>
	#if($arrow && ($orientation == "bottom" || $orientation == "bottomOrTop"))<div class="arrow"></div>#end
</dialog>
<script>
"use strict";

## alignment: center (default), edge or targetWidth, see CalloutSettings.CalloutAlignment
function positionBottomOrTopCallout(target, callout, alignment) {
	if (target.length === 0 || callout.length === 0) {
		return;
	}

	var targetOffset = target.offset();
	var targetWidth = target.outerWidth();
	var targetHeight = target.outerHeight();
	// If target is a wide object (e.g. a full-width button in a form on a wide screen),
	// let the popup's width grow to that width.
	if (alignment === 'targetWidth') {
		// like a dropdown menu: exactly as wide as the target
		callout.css({'max-width': targetWidth + 'px', 'min-width': targetWidth + 'px', 'width': targetWidth + 'px', 'padding-left': 0, 'padding-right': 0});
	} else if (alignment === 'edge') {
		// the content box starts exactly at the edge of the target
		callout.css({'padding-left': 0, 'padding-right': 0});
	} else if (targetWidth > 450) {
		callout.css({'max-width': targetWidth + 'px', 'width': targetWidth + 'px', 'padding-left': 0, 'padding-right': 0});
	}
	var calloutWidth = callout.outerWidth();
	var calloutHeight = callout.outerHeight();

	var docWidth = jQuery(document).width();
	var idealLeft = targetOffset.left + (targetWidth - calloutWidth) / 2;
	if (alignment === 'targetWidth') {
		idealLeft = targetOffset.left;
	} else if (alignment === 'edge') {
		// the left edge of the target, the right edge if there is no room on the right
		idealLeft = targetOffset.left;
		if (idealLeft + calloutWidth > docWidth - 5) {
			idealLeft = targetOffset.left + targetWidth - calloutWidth;
		}
	}
	// clamp into the viewport, e.g. for a target close to the left or right edge
	var left = Math.max(5, Math.min(idealLeft, docWidth - calloutWidth - 5));

	var topPos = targetOffset.top - calloutHeight;
	var bottomPos = targetOffset.top + targetHeight;
	var topDist = topPos;
	var bottomDist = window.innerHeight - (bottomPos + calloutHeight - jQuery(document).scrollTop());
	var showBottom = bottomDist > topDist;
	if (alignment === 'edge' || alignment === 'targetWidth') {
		// like a dropdown menu: below the target, above it only if there is no room below
		// (neither fits: the side with more room)
		var topRoom = topPos - jQuery(document).scrollTop();
		showBottom = bottomDist >= 0 || (topRoom < 0 && bottomDist > topRoom);
	}

	callout.offset({left: left, top: showBottom ? bottomPos : topPos});
	if (showBottom) {
		callout.removeClass('top').addClass('bottom');
	} else {
		callout.removeClass('bottom').addClass('top');
	}

	if (left !== idealLeft && calloutWidth > 0) {
		// point the arrow back at the target's horizontal center, relative to the (clamped) callout's own left edge
		var percent = (targetOffset.left + targetWidth / 2 - left) / calloutWidth * 100;
		callout.find('.arrow').css({'left': percent + '%'});
	}
}

jQuery(function() {
	jQuery('#callout_$r.getCId()').each(function(index, el) {
		if(el != null && !el.open) {
			el.showModal();
		}
		var targetEl = jQuery('#$guimsgtarget,#o_c$guimsgtarget');
		o_scrollToElementIfInvisible(targetEl.get(0));
		var targetOffset = targetEl.offset();
		if(targetOffset) {
			var callout = jQuery(el);
			callout.css('display','block').css('z-index', o_info.zseed + 105);
			
			var orientation = '${orientation}';
			var arrow = $arrow;
			var docWidth = jQuery(document).width();
			if(orientation == 'top') {
				if(targetOffset.left >= 0 && callout.outerWidth() > 50 && targetOffset.left <= ((callout.outerWidth() - targetEl.outerWidth()) / 2)) {
					## left edge case: show at left border
					## add 15px for button size
					## add 10px for a bit space at left side
					callout.offset({
						top: Math.round(targetOffset.top - targetEl.height() - 25) ,
						left: '10'
					});
					var percent = (targetOffset.left + targetEl.outerWidth()/2 + 15 + 10/2) / callout.outerWidth() * 100; 
					callout.find('.arrow').css({'left' : percent + '%'});
					
				} else if(targetOffset.left >= 0 && callout.outerWidth() > 50 && callout.outerWidth() > targetEl.outerWidth() && (targetOffset.left + (callout.outerWidth() - targetEl.outerWidth() / 2)) >= docWidth) {
					## right edge case: show at right border
					## add 15px for button size
					## add 10px for a bit space at right side
					callout.offset({
						top: Math.round(targetOffset.top - targetEl.height() - 25) ,
						left: Math.round(docWidth - callout.outerWidth() - 10)
					});
					var percent = (1 - ((docWidth - targetOffset.left - targetEl.outerWidth()/2 - 15 - 10/2 ) / callout.outerWidth() )) * 100; 
					callout.find('.arrow').css({'left' : percent + '%'});
	
				} else {
					## standard case: show centered below element.  -1 to compensate for the center of the triangle, best visual effort
					callout.offset({
						top: Math.round(targetOffset.top - targetEl.height() - 25),
						left: Math.round((targetOffset.left + targetEl.outerWidth()) - callout.outerWidth()/2 -1)
					});
				}
			} else if (orientation === 'bottomOrTop') {
				var alignment = '$!alignment';
				positionBottomOrTopCallout(targetEl, callout, alignment);
				## the target can be re-rendered while the callout is open: query it again
				var reposition = function() {
					positionBottomOrTopCallout(jQuery('#$guimsgtarget,#o_c$guimsgtarget'), callout, alignment);
				};
				if (window.ResizeObserver) {
					new ResizeObserver(reposition).observe(callout[0]);
				}
				var calloutResizeNS = 'resize.' + callout.attr('id');
				jQuery(window).on(calloutResizeNS, reposition);
				callout.on('close', function() {
					jQuery(window).off(calloutResizeNS);
				});
			} else {
				if(targetOffset.left >= 0 && callout.outerWidth() > 50 && targetOffset.left <= ((callout.outerWidth() - targetEl.outerWidth()) / 2)) {
					## left edge case: show at left border
					## add 15px for button size
					## add 10px for a bit space at left side
					callout.offset({
						top: Math.round(targetOffset.top + targetEl.height() +  (arrow ? 15 : 5)) ,
						left: '10'
					});
					var percent = (targetOffset.left + targetEl.outerWidth()/2 + 15 + 10/2) / callout.outerWidth() * 100; 
					callout.find('.arrow').css({'left' : percent + '%'});
				} else if(targetOffset.left >= 0 && callout.outerWidth() > 50 && callout.outerWidth() > targetEl.outerWidth() && (targetOffset.left + (callout.outerWidth() - targetEl.outerWidth() / 2)) >= docWidth) {
					## right edge case: show at right border
					## add 15px for button size
					## add 10px for a bit space at right side
					callout.offset({
						top: Math.round(targetOffset.top + targetEl.height() + (arrow ? 15 : 5)) ,
						left: Math.round(docWidth - callout.outerWidth() - 10)
					});
					var percent = (1 - ((docWidth - targetOffset.left - targetEl.outerWidth()/2 - 15 - 10/2 ) / callout.outerWidth() )) * 100; 
					callout.find('.arrow').css({'left' : percent + '%'});
	
				} else {
					## standard case: show centered below element. -1 to compensate for the center of the triangle, best visual effort
					callout.offset({
						top: Math.round(targetOffset.top + targetEl.height() + (arrow ? 15 : 5)),
						left: Math.round((targetOffset.left + (targetEl.outerWidth() / 2)) - callout.outerWidth()/2 -1)
					});
				}
			}
		}
	});
});
</script>
