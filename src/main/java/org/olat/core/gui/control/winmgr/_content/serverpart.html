## Set height to 0 to fix IE rendering issue (div would consume some visible space)
<div style="height:0px">
<script>
"use strict";

let stopped = true;
function initPolling () {
	o_info.lastClickTime = new Date().getTime();
	pollgrowth = 0;
	pollcount  = 0;
	if (stopped) {
		stopped = false;
		tick();
	}
}

##observe mouse/keyboard activity to resume polling
jQuery("#o_body").bind("mouseover click keypress", function(event){initPolling();});

o_info.wins = {};
o_info.poller = null;

let growthrate = 10;
let pollminutes = 60;
let pollcount = 0;
let pollError = 0;
let pollgrowth = 0;
let timestampLastPoll = new Date().getTime();

## starts an interval which checks every second whether to send an poll request based on
## the pollperiod or not 10 min after the last click the poll process stops
function tick () {
	o_info.poller = jQuery.periodic({period: $pollperiod, decay:1.005, max_period: Number.MAX_VALUE}, function() {
		if ( !o_info.linkbusy && (this.period > 1000) && (pollError < 2) ) {
			try {
				let now = new Date().getTime();
				if ((now - o_info.lastClickTime) < (pollminutes * 60 * 1000)) {
					if ((now - timestampLastPoll) > (this.period + pollgrowth)) {
						timestampLastPoll = now;
						pollcount++;
						pollgrowth = Math.ceil((this.period+pollgrowth)*(100+growthrate)/100) - this.period;
						#if($r.isTrue($websocketEnabled))
						checkWebSocket();
						#end

						let data = {
							"_csrf": "$csrfToken",
							"oow": window.name
						};
						o_info.ajaxpp = jQuery.ajax({
							method:'POST',
							url:'$mapuri/',
							dataType: 'json',
							data: data,
							cache: false,
							success:onPollSuccess,
							error:onPollFailure
						});

					}
				} else {
					stopped = true;
				}
			} catch (e) {
				if(window.console) console.log(e);
				o_info.poller.cancel(); //stop on errors
			}
		}

		if(pollError >= 2) {
			window.close();
		}
	});
}

jQuery(document).ready(initPolling);

#if($r.isTrue($websocketEnabled))
o_info.ws = null;
let wsPingTime = 0;
let wsFailures = 0;
let wsDisabled = false;
## time in milliseconds to wait for a pong before closing the connection
let wsPongTimeout = 15000;

function openWebSocket() {
	const wsUri = (window.location.protocol === "https:" ? "wss://" : "ws://") + window.location.host + "$wsuri?oow=" + window.name;
	const websocket = new WebSocket(wsUri);
	let opened = false;
	websocket.addEventListener("open", () => {
		opened = true;
		wsPingTime = 0;
		wsFailures = 0;
	});
	websocket.addEventListener("close", (event) => {
		if(o_info.ws === websocket) {
			o_info.ws = null;
		}
		## 1008 violated policy: not authenticated or window not found, retrying is useless
		## stop retrying too after 5 consecutive connections which could not be opened
		if(event.code === 1008 || (!opened && ++wsFailures >= 5)) {
			wsDisabled = true;
		}
	});
	websocket.addEventListener("error", (event) => {
		console.log('WebSocket error', event);
	});
	websocket.addEventListener("message", (event) => {
		if("pong" === event.data) {
			wsPingTime = 0;
		} else if("redraw" === event.data) {
			try {
				let data = {
					"_csrf": "$csrfToken",
					"oow": window.name
				};
				o_info.ajaxpp = jQuery.ajax({
					method:'POST',
					url:'$mapuri/',
					dataType: 'json',
					data: data,
					cache: false,
					success:onPollSuccess
				});
			} catch(e) {
				console.log(e);
			}
		} else {
			o_awsexecute(event);
		}
	});
	o_info.ws = websocket;
}

## called by the poller: reconnect a closed WebSocket, ping an open one and
## close it if the previous ping was not answered (half-open connection)
function checkWebSocket() {
	if(wsDisabled) return;

	try {
		const websocket = o_info.ws;
		if(websocket == null || websocket.readyState === WebSocket.CLOSING || websocket.readyState === WebSocket.CLOSED) {
			openWebSocket();
		} else if(websocket.readyState === WebSocket.OPEN) {
			let now = new Date().getTime();
			if(wsPingTime === 0) {
				wsPingTime = now;
				websocket.send("ping");
			} else if((now - wsPingTime) > wsPongTimeout) {
				o_info.ws = null;
				wsPingTime = 0;
				websocket.close();
			}
		}
	} catch(e) {
		console.log(e);
	}
}

jQuery(function() {
	setTimeout(openWebSocket);
});
#end

##check whether polling started or not. Wrap it makes it more stable
jQuery(function() { 
	setTimeout( function(){ if (!o_info.ajaxpp) {
			showMessageBox('error', 'error', 'Some core functionality could not be started. Please log out of OLAT and login again.');
		}},60000);
	}
);

function onPollSuccess(content, s, response) {
	if(response.status == 304) {
	 	pollError = 0;
	} else if(response.status >= 200 && response.status < 300) {
	 	pollError = 0;
	 	o_ainvoke(content);
	} else {
	 	pollError++;
	}
}

function onPollFailure(response) {
	pollError++;
	if(response.status == 404) { 
		## Not found - happens when user opened a second window and logged in while in the first window the poller is still running. 
		## Only solution: stop poller as this triggers some fancy ***.dms file downloads
		o_info.poller.cancel(); 
	}
}
</script>
$r.render("pollperiodPanel")
</div>
