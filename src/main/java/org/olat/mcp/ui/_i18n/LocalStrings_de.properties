user.fair.use=<strong>Faire Nutzung:</strong> Der Zugriff \u00FCber MCP-Clients geh\u00F6rt zu Ihrem pers\u00F6nlichen Konto und z\u00E4hlt wie eine Anmeldung in OpenOlat. Nutzen Sie ihn f\u00FCr Ihr eigenes Lernen und Arbeiten. Automatisierte Massenabfragen, dauerndes Abfragen im Hintergrund und die Weitergabe eines Tokens an andere Personen oder Systeme sind nicht erlaubt. OpenOlat begrenzt die Anzahl Anfragen pro Minute. Es gelten die Nutzungsbedingungen Ihrer Institution.
