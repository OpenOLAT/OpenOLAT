<div class="o_share_links">
	#foreach($link in $links)$r.render($link)#end
</div>
<script>
'use strict';
jQuery(function() {
	jQuery('.o_share_links a[target="_blank"]').on('click', function() {
		jQuery('.o_callout_content .close').last().trigger('click');
	});
});
</script>
#if($r.available("copyLink"))
<script>

	jQuery('#copyLink').on('click', function(e) {
		e.preventDefault();
		o_shareCopyLink('$r.escapeJavaScript($copyUrl)', '$r.escapeJavaScript($copyInfoTitle)', '$r.escapeJavaScript($copyLinkCopiedMessage)');
	});
});
</script>
#end
