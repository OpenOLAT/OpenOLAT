car.warning.text=Si no publica su curso, tampoco se mostrar\u00E1 de momento en la categor\u00EDa del cat\u00E1logo seleccionada en el paso 2. Para publicar su curso m\u00E1s adelante, abra el editor del curso mediante el men\u00FA "Herramientas". En el editor, haga clic en "Publicar" en la parte superior derecha de la barra de herramientas. El asistente le guiar\u00E1 por el proceso de publicaci\u00F3n y le permitir\u00E1 habilitar el curso y verificar o crear posteriormente la entrada del cat\u00E1logo. Si lo necesita, encontrar\u00E1 m\u00E1s informaci\u00F3n en la ayuda de OpenOlat.
