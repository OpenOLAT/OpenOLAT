mail.body.0=*** Este es un mensaje generado autom\u00E1ticamente. No responda a este e-mail\! ***\n\n Acaba de crear correctamente su curso "{0}" en OpenOlat\!\n\n Con este e-mail queremos darle algunas indicaciones y consejos para seguir trabajando con su curso\:\n\n
mail.body.1=1. Encontrar el curso\:\n - Encontrar\u00E1 su curso en el \u00E1rea de autor\u00EDa, en la pesta\u00F1a "Mis entradas".\n\n
mail.body.2=2. Enlazar el curso desde fuera de OpenOlat\:\n - Utilice este enlace, por ejemplo, para enlazar su curso desde la p\u00E1gina web de su c\u00E1tedra\:\n - {0}\n\n
mail.body.3=3. Registrar el curso en el cat\u00E1logo de OpenOlat\:\n - En las opciones del curso encontrar\u00E1 en el men\u00FA desplegable la entrada "Entrada de cat\u00E1logo". Haga clic en ella y a\u00F1ada el curso al cat\u00E1logo con "A\u00F1adir al cat\u00E1logo".\n\n
mail.body.4=4. Realizar cambios en su curso\:\n 4.1 General\:\n - Por lo general, puede realizar cambios funcionales en el editor del curso.\n\n
mail.body.4.2=4.{0} P\u00E1gina de informaci\u00F3n\:\n - Para cambiar el contenido de la p\u00E1gina, haga clic en "Editar" en el elemento del curso "P\u00E1gina de informaci\u00F3n" de la vista de contenido del curso.\n\n
mail.body.4.3=4.{0} Inscripci\u00F3n\:\n - Puede gestionar la lista de participantes inscritos en "Grupos". La encontrar\u00E1 en el men\u00FA desplegable, en la entrada "Gesti\u00F3n de miembros".\n\n
mail.body.4.4=4.{0} Carpeta de materiales\:\n - Puede subir y gestionar sus archivos directamente en el elemento del curso "Carpeta de materiales" de la vista de contenido del curso.\n\n
mail.body.4.5=4.{0} Foro\:\n - Inicie el foro con una primera publicaci\u00F3n haciendo clic en "Abrir hilo" en el foro. Consejo\: suscr\u00EDbase al foro para recibir autom\u00E1ticamente informaci\u00F3n sobre las publicaciones de otros usuarios por e-mail, RSS y en su Inicio de OpenOlat\!\n\n
mail.body.4.6=4.{0} E-mail\:\n - Para a\u00F1adir m\u00E1s destinatarios, abra el editor y haga clic en "Destinatarios" en el elemento del curso "E-mail".\n\n
mail.body.5=5. Su soporte de OpenOlat\:\n - Si tiene problemas o preguntas, las personas de contacto del soporte de OpenOlat le ayudar\u00E1n.\n\n
mail.body.6=6. M\u00E1s ayuda\:\n - En la ayuda de OpenOlat, en {0}  encontrar\u00E1 m\u00E1s informaci\u00F3n sobre la creaci\u00F3n y edici\u00F3n de cursos.\n\n
mail.body.greetings=\u00A1Le deseamos mucho \u00E9xito en su trabajo con OpenOlat\!\n\n Su equipo de OpenOlat\n\n
